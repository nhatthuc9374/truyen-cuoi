<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 980" width="100%" height="100%">
  <defs>
    <linearGradient id="fullTitleTeacher" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="30%" stop-color="#F43F5E"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Panel Gradients -->
    <linearGradient id="cgBg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/><stop offset="65%" stop-color="#FDE68A"/><stop offset="65%" stop-color="#E2E8F0"/><stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="cgBg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2"/><stop offset="65%" stop-color="#FEE2E2"/><stop offset="65%" stop-color="#E2E8F0"/><stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="cgBg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/><stop offset="60%" stop-color="#DBEAFE"/><stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="cgBg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3"/><stop offset="50%" stop-color="#FFF1F2"/><stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>

    <filter id="cgShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1330" height="980" fill="#0F172A" rx="20"/>

  <!-- Comic Title Header -->
  <rect x="25" y="12" width="1280" height="50" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="665" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="url(#fullTitleTeacher)" text-anchor="middle" letter-spacing="2">
    🏫👶 TRUYỆN TRANH HỌC ĐƯỜNG: CÔ GIÁO ĐI ĐẺ SINH BA 🎉
  </text>

  <!-- ==================== PANEL 1: BỤNG BẦU SIÊU TO ==================== -->
  <g transform="translate(25, 75) scale(0.97)">
    <rect width="640" height="425" rx="12" fill="url(#cgBg1)" stroke="#1E293B" stroke-width="3"/>
    
    <!-- Blackboard -->
    <rect x="135" y="45" width="350" height="135" rx="8" fill="#064E3B" stroke="#78350F" stroke-width="5"/>
    <text x="310" y="75" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#FEF08A" text-anchor="middle">★ TIẾT HỌC NGỮ VĂN ★</text>
    <text x="180" y="110" font-family="'Segoe UI', cursive, sans-serif" font-size="15" fill="#FFFFFF">"Công cha như núi Thái Sơn..."</text>
    <text x="180" y="140" font-family="'Segoe UI', cursive, sans-serif" font-size="15" fill="#86EFAC">"Nghĩa mẹ như nước trong nguồn..."</text>

    <!-- Teacher with big belly -->
    <g transform="translate(180, 110)">
      <ellipse cx="90" cy="205" rx="75" ry="12" fill="#000000" opacity="0.2"/>
      <path d="M50 75 Q75 60 100 75 L150 200 L25 200 Z" fill="#FDA4AF"/>
      <ellipse cx="115" cy="140" rx="68" ry="58" fill="#FB7185" stroke="#E11D48" stroke-width="3"/>
      <circle cx="75" cy="42" r="26" fill="#FFEDD5" stroke="#1E293B" stroke-width="2.5"/>
      <circle cx="75" cy="18" r="12" fill="#3B2005"/>
      <path d="M48 42 C45 15 105 15 102 42 Z" fill="#3B2005"/>
      <rect x="62" y="38" width="10" height="8" rx="1.5" fill="none" stroke="#DC2626" stroke-width="1.8"/>
      <rect x="78" y="38" width="10" height="8" rx="1.5" fill="none" stroke="#DC2626" stroke-width="1.8"/>
      <circle cx="67" cy="42" r="2" fill="#1E293B"/><circle cx="83" cy="42" r="2" fill="#1E293B"/>
      <path d="M70 50 Q75 56 80 50" fill="none" stroke="#E11D48" stroke-width="2"/>
    </g>

    <!-- Students -->
    <g transform="translate(380, 210)">
      <rect x="0" y="60" width="140" height="18" rx="3" fill="#D97706"/>
      <ellipse cx="50" cy="55" rx="18" ry="22" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
      <circle cx="50" cy="25" r="16" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
      <ellipse cx="100" cy="55" rx="18" ry="22" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
      <circle cx="100" cy="25" r="16" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
    </g>

    <!-- Speech 1 -->
    <g filter="url(#cgShadow)">
      <path d="M120 20 Q120 0 190 0 L400 0 Q440 0 440 25 Q440 52 380 52 L300 52 L280 75 L285 52 L170 52 Q120 52 120 20 Z" fill="#FFF1F2" stroke="#F43F5E" stroke-width="2.5"/>
      <text x="280" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#9F1239" text-anchor="middle">"Các em chép bài cẩn thận nhé..."</text>
      <text x="280" y="42" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#9F1239" text-anchor="middle">"Em bé trong bụng cô quẫy mạnh quá! ❤️"</text>

      <path d="M420 120 Q420 95 480 95 L590 95 Q630 95 630 120 Q630 148 570 148 L530 148 L515 172 L520 148 L460 148 Q420 148 420 120 Z" fill="#F0F9FF" stroke="#0284C7" stroke-width="2.5"/>
      <text x="525" y="118" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#0369A1" text-anchor="middle">"Bụng cô to tròn quá chừng!"</text>
      <text x="525" y="136" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#0369A1" text-anchor="middle">"Chắc sắp đón em bé rồi ạ!"</text>
    </g>

    <rect x="15" y="12" width="240" height="26" rx="6" fill="#1E293B"/>
    <text x="135" y="29" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38BDF8" text-anchor="middle">CẢNH 1: BỤNG BẦU SIÊU TO</text>
    <rect x="15" y="385" width="610" height="30" rx="6" fill="#0F172A" opacity="0.85"/>
    <text x="320" y="405" font-family="'Segoe UI', sans-serif" font-size="12" fill="#F8FAFC" text-anchor="middle">Cả lớp đang chăm chú học bài, cô giáo với chiếc bụng bầu siêu to vẫn say sưa giảng dạy...</text>
  </g>

  <!-- ==================== PANEL 2: CẢ TRƯỜNG NÁO LOẠN ==================== -->
  <g transform="translate(685, 75) scale(0.97)">
    <rect width="640" height="425" rx="12" fill="url(#cgBg2)" stroke="#1E293B" stroke-width="3"/>
    
    <!-- Window & Ambulance outside -->
    <rect x="420" y="45" width="200" height="150" rx="8" fill="#BAE6FD" stroke="#475569" stroke-width="2.5"/>
    <g transform="translate(450, 110)">
      <rect x="0" y="15" width="105" height="40" rx="5" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5"/>
      <rect x="0" y="32" width="100" height="10" fill="#EF4444"/>
      <text x="40" y="5" font-size="14" text-anchor="middle">🚨</text>
      <circle cx="25" cy="55" r="9" fill="#334155"/><circle cx="85" cy="55" r="9" fill="#334155"/>
    </g>
    <text x="550" y="85" font-family="'Impact'" font-size="11" fill="#DC2626">Ò... Í... Ò... Í...!</text>

    <!-- Teacher in pain -->
    <g transform="translate(110, 100)">
      <ellipse cx="115" cy="140" rx="68" ry="58" fill="#FB7185" stroke="#DC2626" stroke-width="3.5"/>
      <path d="M55 125 L45 140 L58 145 L48 165" fill="none" stroke="#FBBF24" stroke-width="3.5"/>
      <path d="M185 120 L195 135 L185 140 L198 155" fill="none" stroke="#FBBF24" stroke-width="3.5"/>
      <circle cx="75" cy="48" r="26" fill="#FFEDD5" stroke="#1E293B" stroke-width="2.5"/>
      <ellipse cx="75" cy="62" rx="12" ry="16" fill="#991B1B"/>
    </g>

    <!-- Students panic -->
    <g transform="translate(290, 200)">
      <circle cx="40" cy="38" r="18" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
      <circle cx="34" cy="36" r="4" fill="#FFFFFF"/><circle cx="34" cy="36" r="1.5" fill="#1E293B"/>
      <circle cx="46" cy="36" r="4" fill="#FFFFFF"/><circle cx="46" cy="36" r="1.5" fill="#1E293B"/>
    </g>

    <!-- Speech 2 -->
    <g filter="url(#cgShadow)">
      <path d="M50 25 L90 10 L115 20 L140 2 L170 20 L205 2 L215 25 L260 10 L250 40 L285 60 L255 80 L280 108 L240 105 L225 128 L200 108 L175 122 L165 100 L125 110 L132 88 L95 82 L115 60 Z" fill="#FEF2F2" stroke="#EF4444" stroke-width="3"/>
      <text x="180" y="45" font-family="'Impact', sans-serif" font-size="22" font-weight="900" fill="#DC2626" text-anchor="middle">Á Á Á ! ĐAU QUÁ !</text>
      <text x="180" y="68" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#991B1B" text-anchor="middle">"CÔ VỠ ỐI RỒI CÁC EM ƠI!"</text>

      <path d="M270 90 Q270 70 340 70 L480 70 Q510 70 510 95 Q510 120 460 120 L420 120 L405 145 L410 120 L320 120 Q270 120 270 90 Z" fill="#F0F9FF" stroke="#0284C7" stroke-width="2.5"/>
      <text x="390" y="92" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#0369A1" text-anchor="middle">"Cô sao thế ạ?!"</text>
      <text x="390" y="110" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#DC2626" text-anchor="middle">"Cô vỡ ối rồi! Xe cấp cứu đến rồi!"</text>
    </g>

    <rect x="15" y="12" width="240" height="26" rx="6" fill="#1E293B"/>
    <text x="135" y="29" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#EF4444" text-anchor="middle">CẢNH 2: CẢ TRƯỜNG NÁO LOẠN</text>
    <rect x="15" y="385" width="610" height="30" rx="6" fill="#0F172A" opacity="0.85"/>
    <text x="320" y="405" font-family="'Segoe UI', sans-serif" font-size="12" fill="#F8FAFC" text-anchor="middle">Cô giáo ôm bụng hét toáng lên, cả lớp xì xào hoảng hốt và xe cấp cứu lao tới như một cơn gió!</text>
  </g>

  <!-- ==================== PANEL 3: TIẾNG HÉT VƯỢT CẠN ==================== -->
  <g transform="translate(25, 520) scale(0.97)">
    <rect width="640" height="425" rx="12" fill="url(#cgBg3)" stroke="#1E293B" stroke-width="3"/>
    
    <!-- Lamp -->
    <ellipse cx="260" cy="80" rx="40" ry="16" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>
    <polygon points="230,90 120,330 380,330 290,90" fill="#FEF08A" opacity="0.25"/>

    <!-- Bed & Teacher -->
    <rect x="110" y="230" width="330" height="30" rx="6" fill="#0284C7"/>
    <g transform="translate(130, 120)">
      <circle cx="65" cy="45" r="24" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
      <path d="M40 45 C35 15 95 15 92 45 Z" fill="#3B2005"/>
      <ellipse cx="65" cy="56" rx="13" ry="15" fill="#7F1D1D"/>
      <ellipse cx="175" cy="115" rx="60" ry="42" fill="#FDA4AF" stroke="#E11D48" stroke-width="2.5"/>
    </g>

    <!-- Doctor -->
    <g transform="translate(440, 150)">
      <path d="M25 80 Q45 70 65 80 L75 180 L15 180 Z" fill="#10B981"/>
      <circle cx="45" cy="45" r="17" fill="#FFEDD5"/>
      <rect x="34" y="44" width="22" height="15" rx="3" fill="#FFFFFF"/>
    </g>

    <!-- Scream 3 -->
    <g filter="url(#cgShadow)">
      <path d="M100 25 L140 5 L160 20 L200 0 L230 22 L270 5 L290 25 L340 8 L330 40 L370 55 L330 75 L365 105 L325 98 L300 120 L275 95 L240 115 L225 92 L180 105 L185 78 L140 75 L160 50 Z" fill="#FEF2F2" stroke="#EF4444" stroke-width="3"/>
      <text x="240" y="45" font-family="'Impact', sans-serif" font-size="26" font-weight="900" fill="#DC2626" text-anchor="middle">Á Á Á ! HÉT RẤT TO !</text>
      <text x="240" y="70" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#991B1B" text-anchor="middle">"ÔM CHẶT BỤNG BẦU RẶN HẾT SỨC!"</text>

      <path d="M390 30 Q390 10 460 10 L590 10 Q630 10 630 35 Q630 65 560 65 L500 65 L485 85 L485 65 L430 65 Q390 65 390 30 Z" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
      <text x="510" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#047857" text-anchor="middle">"HÍT SÂU... CỐ LÊN CÔ ƠI!"</text>
      <text x="510" y="52" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#065F46" text-anchor="middle">"Rặn mạnh một hơi nữa là ra rồi!"</text>
    </g>

    <rect x="15" y="12" width="240" height="26" rx="6" fill="#1E293B"/>
    <text x="135" y="29" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#F87171" text-anchor="middle">CẢNH 3: TIẾNG HÉT VƯỢT CẠN</text>
    <rect x="15" y="385" width="610" height="30" rx="6" fill="#0F172A" opacity="0.85"/>
    <text x="320" y="405" font-family="'Segoe UI', sans-serif" font-size="12" fill="#F8FAFC" text-anchor="middle">Trong phòng sinh, cô giáo ôm chặt bụng bầu dồn hết sức hét thật to để đưa các con chào đời!</text>
  </g>

  <!-- ==================== PANEL 4: CẢ LỚP VỖ TAY HOAN HÔ ==================== -->
  <g transform="translate(685, 520) scale(0.97)">
    <rect width="640" height="425" rx="12" fill="url(#cgBg4)" stroke="#1E293B" stroke-width="3"/>
    
    <!-- Bunting -->
    <path d="M20 50 Q160 75 300 55 T630 50" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <polygon points="50,55 70,85 90,58" fill="#EF4444"/>
    <polygon points="120,62 140,90 160,65" fill="#F59E0B"/>
    <polygon points="190,66 210,95 230,66" fill="#10B981"/>
    <polygon points="260,65 280,95 300,62" fill="#3B82F6"/>
    <polygon points="330,58 350,88 370,56" fill="#EC4899"/>
    <polygon points="400,54 420,84 440,53" fill="#8B5CF6"/>

    <!-- Teacher smiling -->
    <g transform="translate(30, 160)">
      <circle cx="70" cy="48" r="24" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
      <path d="M45 44 C40 15 95 15 95 44 Z" fill="#3B2005"/>
      <rect x="58" y="44" width="10" height="8" rx="1.5" fill="none" stroke="#DC2626" stroke-width="1.8"/>
      <rect x="72" y="44" width="10" height="8" rx="1.5" fill="none" stroke="#DC2626" stroke-width="1.8"/>
      <circle cx="63" cy="48" r="2" fill="#1E293B"/><circle cx="77" cy="48" r="2" fill="#1E293B"/>
      <path d="M66 56 Q70 62 74 56" fill="none" stroke="#E11D48" stroke-width="2"/>
    </g>

    <!-- 3 Babies in bassinet -->
    <g transform="translate(175, 180)">
      <rect x="0" y="50" width="240" height="110" rx="16" fill="#FEF08A" stroke="#F59E0B" stroke-width="3"/>
      <!-- B1 -->
      <g transform="translate(20, 35)">
        <ellipse cx="22" cy="58" rx="18" ry="24" fill="#FDE047"/>
        <circle cx="22" cy="30" r="16" fill="#FFEDD5"/>
        <circle cx="12" cy="34" r="4" fill="#FDA4AF"/><circle cx="32" cy="34" r="4" fill="#FDA4AF"/>
        <circle cx="22" cy="35" r="5" fill="#38BDF8"/>
      </g>
      <!-- B2 -->
      <g transform="translate(85, 30)">
        <ellipse cx="24" cy="62" rx="20" ry="26" fill="#60A5FA"/>
        <circle cx="24" cy="32" r="17" fill="#FFEDD5"/>
        <ellipse cx="24" cy="20" rx="14" ry="10" fill="#38BDF8"/>
        <circle cx="14" cy="36" r="4" fill="#FDA4AF"/><circle cx="34" cy="36" r="4" fill="#FDA4AF"/>
        <path d="M20 37 Q24 43 28 37" fill="none" stroke="#DC2626" stroke-width="2"/>
      </g>
      <!-- B3 -->
      <g transform="translate(155, 35)">
        <ellipse cx="22" cy="58" rx="18" ry="24" fill="#F472B6"/>
        <circle cx="22" cy="30" r="16" fill="#FFEDD5"/>
        <circle cx="22" cy="13" r="3" fill="#EC4899"/>
        <circle cx="12" cy="34" r="4" fill="#F43F5E"/><circle cx="32" cy="34" r="4" fill="#F43F5E"/>
        <ellipse cx="22" cy="35" rx="3" ry="2" fill="#DC2626"/>
      </g>
      <rect x="35" y="125" width="170" height="24" rx="6" fill="#F59E0B"/>
      <text x="120" y="142" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">3 BÉ SIÊU DỄ THƯƠNG 💖</text>
    </g>

    <!-- Students Clapping -->
    <g transform="translate(440, 160)">
      <text x="30" y="25" font-family="'Impact'" font-size="15" fill="#EF4444">BỐP!</text>
      <text x="90" y="15" font-family="'Impact'" font-size="15" fill="#EF4444">HOAN HÔ!</text>
      <g transform="translate(15, 40)">
        <ellipse cx="30" cy="85" rx="18" ry="24" fill="#38BDF8"/>
        <circle cx="30" cy="35" r="18" fill="#FFEDD5"/>
        <text x="30" y="55" font-size="14" text-anchor="middle">👏</text>
      </g>
      <g transform="translate(70, 30)">
        <ellipse cx="30" cy="90" rx="18" ry="24" fill="#F43F5E"/>
        <circle cx="30" cy="45" r="18" fill="#FFEDD5"/>
      </g>
    </g>

    <!-- Speech 4 -->
    <g filter="url(#cgShadow)">
      <path d="M380 25 Q380 5 470 5 L600 5 Q630 5 630 32 Q630 60 560 60 L520 60 L505 82 L510 60 L440 60 Q380 60 380 25 Z" fill="#FEFCE8" stroke="#EAB308" stroke-width="2.5"/>
      <text x="505" y="28" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#854D0E" text-anchor="middle">"HOAN HÔ CÔ GIÁO! 👏🎉"</text>
      <text x="505" y="48" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#A16207" text-anchor="middle">"3 em bé nhìn cưng xỉu luôn cô ơi! 💖"</text>

      <path d="M30 25 Q30 5 100 5 L260 5 Q300 5 300 32 Q300 60 230 60 L170 60 L155 82 L160 60 L70 60 Q30 60 30 25 Z" fill="#FFF1F2" stroke="#F43F5E" stroke-width="2.5"/>
      <text x="165" y="28" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#BE123C" text-anchor="middle">"Cảm ơn cả lớp của cô!"</text>
      <text x="165" y="48" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#9F1239" text-anchor="middle">"3 thiên thần nhỏ chào các anh chị! 🥰"</text>
    </g>

    <rect x="15" y="12" width="240" height="26" rx="6" fill="#1E293B"/>
    <text x="135" y="29" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#FACC15" text-anchor="middle">CẢNH 4: CẢ LỚP VỖ TAY HOAN HÔ</text>
    <rect x="15" y="385" width="610" height="30" rx="6" fill="#0F172A" opacity="0.85"/>
    <text x="320" y="405" font-family="'Segoe UI', sans-serif" font-size="12" fill="#F8FAFC" text-anchor="middle">Cả lớp đồng thanh vỗ tay hoan hô chúc mừng khi cô giáo hạ sinh thành công 3 bé con siêu dễ thương!</text>
  </g>
</svg>
