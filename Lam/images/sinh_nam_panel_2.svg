<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <defs>
    <linearGradient id="hospBg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="65%" stop-color="#FEE2E2"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="painGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#EF4444" flood-opacity="0.6"/>
    </filter>
    <filter id="shadowH2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Panel Border & Background -->
  <rect x="5" y="5" width="640" height="440" rx="16" fill="url(#hospBg2)" stroke="#1E293B" stroke-width="4"/>

  <!-- Ultrasound Machine Screen on Left -->
  <rect x="25" y="60" width="120" height="90" rx="8" fill="#1E293B" stroke="#475569" stroke-width="3"/>
  <!-- Ultrasound Display Grid -->
  <rect x="33" y="68" width="104" height="74" rx="4" fill="#0F172A"/>
  <path d="M40 120 Q60 80 80 110 T120 90" fill="none" stroke="#22C55E" stroke-width="2"/>
  <text x="85" y="90" font-family="'Segoe UI', sans-serif" font-size="16" fill="#EF4444" text-anchor="middle" font-weight="bold">⚡ ALERT ⚡</text>
  <text x="85" y="115" font-family="'Courier New', monospace" font-size="11" fill="#38BDF8" text-anchor="middle">HR: 160 BPM</text>

  <!-- Pain Shockwaves / Speed Lines -->
  <g stroke="#EF4444" stroke-width="2.5" opacity="0.6" stroke-dasharray="8 6">
    <line x1="280" y1="210" x2="30" y2="40"/>
    <line x1="280" y1="210" x2="160" y2="20"/>
    <line x1="280" y1="210" x2="450" y2="20"/>
    <line x1="280" y1="210" x2="620" y2="80"/>
  </g>

  <!-- Mom Clutching Huge Belly in Agony (Center) -->
  <g id="mom-in-pain" transform="translate(180, 80)">
    <!-- Shadow -->
    <ellipse cx="110" cy="210" rx="85" ry="14" fill="#000000" opacity="0.25"/>

    <!-- Dress -->
    <path d="M60 85 Q90 65 120 85 L180 195 L30 195 Z" fill="#FDA4AF" stroke="#E11D48" stroke-width="2.5"/>

    <!-- GIANT BELLY with PAIN RAYS -->
    <ellipse cx="140" cy="140" rx="75" ry="65" fill="#FB7185" stroke="#DC2626" stroke-width="3.5" filter="url(#painGlow)"/>
    <!-- Pain Lightning around belly -->
    <path d="M70 125 L60 140 L75 145 L62 165" fill="none" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
    <path d="M210 115 L225 130 L212 135 L228 150" fill="none" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
    <path d="M140 60 L145 75 L135 80 L145 92" fill="none" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>

    <!-- Both Hands Gripping the Belly in Shock -->
    <path d="M70 95 Q60 135 110 145" fill="none" stroke="#FDA4AF" stroke-width="16" stroke-linecap="round"/>
    <circle cx="110" cy="145" r="13" fill="#FFEDD5" stroke="#1E293B" stroke-width="2.5"/>
    <path d="M150 95 Q180 135 160 148" fill="none" stroke="#FDA4AF" stroke-width="16" stroke-linecap="round"/>
    <circle cx="160" cy="148" r="13" fill="#FFEDD5" stroke="#1E293B" stroke-width="2.5"/>

    <!-- Mom's Agonized Screaming Face -->
    <circle cx="85" cy="48" r="28" fill="#FFEDD5" stroke="#1E293B" stroke-width="2.5"/>
    <!-- Hair disheveled in pain -->
    <path d="M52 48 C45 10 120 10 118 48 C118 68 108 72 100 60 C90 35 75 35 65 60 Z" fill="#451A03"/>

    <!-- Squeezed Shut Eyes with Tears -->
    <path d="M68 40 L78 46 L68 52" fill="none" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M102 40 L92 46 L102 52" fill="none" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="58" cy="38" r="4" fill="#38BDF8"/>
    <circle cx="112" cy="38" r="4" fill="#38BDF8"/>

    <!-- Wide Open Screaming Mouth -->
    <ellipse cx="85" cy="62" rx="14" ry="18" fill="#991B1B" stroke="#1E293B" stroke-width="2"/>
    <ellipse cx="85" cy="68" rx="8" ry="8" fill="#F87171"/>
    <rect x="76" y="47" width="18" height="5" fill="#FFFFFF"/>

    <!-- Huge Sweat Drops -->
    <path d="M42 28 Q48 20 44 14 Q38 20 42 28 Z" fill="#38BDF8"/>
    <path d="M115 28 Q122 20 118 14 Q112 20 115 28 Z" fill="#38BDF8"/>
  </g>

  <!-- Child ("Tôi") Panicking on Left -->
  <g id="child-panic" transform="translate(60, 180)">
    <ellipse cx="40" cy="115" rx="35" ry="8" fill="#000000" opacity="0.2"/>
    <!-- Body shivering -->
    <ellipse cx="40" cy="75" rx="22" ry="26" fill="#38BDF8" stroke="#0284C7" stroke-width="2.5"/>
    <!-- Hands holding own cheeks in terror -->
    <path d="M22 65 Q10 45 22 35" fill="none" stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
    <circle cx="22" cy="35" r="7" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
    <path d="M58 65 Q70 45 58 35" fill="none" stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
    <circle cx="58" cy="35" r="7" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
    <!-- Head -->
    <circle cx="40" cy="35" r="22" fill="#FFEDD5" stroke="#1E293B" stroke-width="2.5"/>
    <path d="M20 30 C18 8 62 8 60 30 Z" fill="#292524"/>
    <!-- Bug-eyed shock -->
    <circle cx="32" cy="30" r="7" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5"/><circle cx="32" cy="30" r="2.5" fill="#1E293B"/>
    <circle cx="48" cy="30" r="7" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5"/><circle cx="48" cy="30" r="2.5" fill="#1E293B"/>
    <ellipse cx="40" cy="45" rx="6" ry="8" fill="#991B1B"/>
    <text x="5" y="20" font-size="16">💦</text>
  </g>

  <!-- Doctor Panicking & Calling for Emergency Bed on Right -->
  <g id="doctor-action" transform="translate(440, 130)">
    <ellipse cx="50" cy="165" rx="45" ry="10" fill="#000000" opacity="0.2"/>
    <path d="M30 85 Q55 75 75 85 L85 160 L20 160 Z" fill="#FFFFFF" stroke="#64748B" stroke-width="2.5"/>
    <circle cx="52" cy="50" r="24" fill="#FFEDD5" stroke="#1E293B" stroke-width="2.5"/>
    <path d="M32 45 C30 20 74 20 72 45 Z" fill="#334155"/>
    <!-- Crooked glasses -->
    <rect x="36" y="44" width="12" height="9" rx="2" fill="none" stroke="#DC2626" stroke-width="2" transform="rotate(-15 42 48)"/>
    <rect x="52" y="42" width="12" height="9" rx="2" fill="none" stroke="#DC2626" stroke-width="2" transform="rotate(-15 58 46)"/>
    <!-- Shouting mouth -->
    <path d="M44 64 Q54 74 64 64 Z" fill="#DC2626"/>
    <!-- Doctor waving arm urgently -->
    <path d="M75 95 Q115 80 130 55" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
    <path d="M75 95 Q115 80 130 55" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="130" cy="55" r="9" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
    <!-- Hospital Gurney/Wheelchair Wheel -->
    <circle cx="130" cy="160" r="22" fill="none" stroke="#334155" stroke-width="4"/>
    <circle cx="130" cy="160" r="6" fill="#64748B"/>
  </g>

  <!-- Giant Scream Bubble: Mom -->
  <g filter="url(#shadowH2)">
    <path d="M120 20 
             L160 8 L185 18 L210 0 L240 18 L275 0 L285 22 L330 8 L320 38 L355 58 L325 78 L350 105 L310 102 L295 125 L270 105 L245 120 L235 98 L195 108 L202 85 L165 80 L185 58 Z" 
          fill="#FEF2F2" stroke="#EF4444" stroke-width="3"/>
    <text x="250" y="42" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" font-weight="900" fill="#DC2626" text-anchor="middle">Á Á Á ! ĐAU QUÁ !</text>
    <text x="250" y="65" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#991B1B" text-anchor="middle">"NÓ ĐÒI RA RỒI BÁC SĨ ƠI!"</text>
  </g>

  <!-- Speech Bubble: Doctor -->
  <g filter="url(#shadowH2)">
    <path d="M370 20 Q370 2 440 2 L590 2 Q630 2 630 28 Q630 58 550 58 L480 58 L465 80 L465 58 L420 58 Q370 58 370 20 Z" fill="#F0F9FF" stroke="#0284C7" stroke-width="2.5"/>
    <text x="500" y="24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#0369A1" text-anchor="middle">"BÁO ĐỘNG ĐỎ! VỠ ỐI RỒI!"</text>
    <text x="500" y="44" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">"Chuyển ngay vào phòng đẻ khẩn cấp!"</text>
  </g>

  <!-- Panel Header Banner -->
  <rect x="20" y="16" width="230" height="32" rx="8" fill="#1E293B"/>
  <text x="135" y="37" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#EF4444" text-anchor="middle">★ CẢNH 2: CƠN ĐAU ĐỘT NGỘT</text>

  <!-- Caption at bottom -->
  <rect x="25" y="402" width="600" height="34" rx="8" fill="#0F172A" opacity="0.85"/>
  <text x="325" y="424" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#F8FAFC" text-anchor="middle">Đang lúc khám thì mẹ ôm chặt bụng hét toáng lên, cả kíp trực lập tức chuyển vào phòng sinh!</text>
</svg>
