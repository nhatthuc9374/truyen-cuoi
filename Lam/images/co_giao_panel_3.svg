<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cWall3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="60%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <filter id="cShadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Panel Border & Delivery Room Background -->
  <rect x="5" y="5" width="640" height="440" rx="16" fill="url(#cWall3)" stroke="#1E293B" stroke-width="4"/>

  <!-- Overhead Surgical Lamp -->
  <path d="M320 15 L320 65 L270 85" fill="none" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="260" cy="90" rx="45" ry="18" fill="#F8FAFC" stroke="#475569" stroke-width="3"/>
  <circle cx="240" cy="90" r="8" fill="#FEF08A"/>
  <circle cx="260" cy="90" r="9" fill="#FDE047"/>
  <circle cx="280" cy="90" r="8" fill="#FEF08A"/>
  <polygon points="220,100 110,360 410,360 300,100" fill="#FEF08A" opacity="0.25"/>

  <!-- Soundwave Vibration Lines -->
  <path d="M180 110 Q145 150 180 190" fill="none" stroke="#EF4444" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <path d="M155 90 Q115 150 155 210" fill="none" stroke="#EF4444" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

  <!-- Delivery Bed -->
  <rect x="110" y="240" width="340" height="35" rx="6" fill="#0284C7" stroke="#0369A1" stroke-width="3"/>
  <rect x="130" y="275" width="12" height="90" fill="#64748B"/>
  <rect x="420" y="275" width="12" height="90" fill="#64748B"/>

  <!-- Teacher in Delivery Bed (Holding pregnant belly and screaming with all her might!) -->
  <g id="teacher-delivery" transform="translate(130, 120)">
    <!-- Pillow -->
    <ellipse cx="60" cy="85" rx="40" ry="25" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Body & Blanket -->
    <path d="M80 80 Q150 70 230 120 L240 150 L50 150 Z" fill="#E2E8F0"/>
    <!-- Huge Belly under blanket -->
    <ellipse cx="175" cy="115" rx="60" ry="42" fill="#FDA4AF" stroke="#E11D48" stroke-width="2.5"/>

    <!-- Hands: Both Hands Cradling and Holding the Pregnant Belly firmly! -->
    <path d="M75 75 Q110 85 135 110" fill="none" stroke="#FDA4AF" stroke-width="14" stroke-linecap="round"/>
    <circle cx="135" cy="110" r="10" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
    <path d="M90 70 Q145 80 180 110" fill="none" stroke="#FDA4AF" stroke-width="14" stroke-linecap="round"/>
    <circle cx="180" cy="110" r="10" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>

    <!-- Head on Pillow, Chin Up, Screaming Very Loudly! -->
    <circle cx="65" cy="45" r="26" fill="#FFEDD5" stroke="#1E293B" stroke-width="2.5"/>
    <path d="M40 45 C35 15 95 15 92 45 Z" fill="#3B2005"/>
    <ellipse cx="65" cy="45" r="24" fill="#FCA5A5" opacity="0.4"/>

    <!-- Screaming Eyes -->
    <path d="M50 38 L60 42 L50 46" fill="none" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M80 38 L70 42 L80 46" fill="none" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Big Wide Open Screaming Mouth -->
    <ellipse cx="65" cy="56" rx="14" ry="16" fill="#7F1D1D" stroke="#1E293B" stroke-width="2"/>
    <ellipse cx="65" cy="62" rx="8" ry="7" fill="#EF4444"/>
    <rect x="56" y="42" width="18" height="5" fill="#FFFFFF"/>

    <!-- Sweat & Effort Marks -->
    <path d="M30 30 Q24 22 30 15 Q36 22 30 30 Z" fill="#38BDF8"/>
    <path d="M100 30 Q106 22 102 15 Q96 22 100 30 Z" fill="#38BDF8"/>
  </g>

  <!-- Doctor & Nurse in Green Scrubs (Right Side) -->
  <g id="delivery-team" transform="translate(430, 150)">
    <ellipse cx="70" cy="195" rx="60" ry="12" fill="#000000" opacity="0.2"/>

    <!-- Doctor -->
    <path d="M25 80 Q45 70 65 80 L75 185 L15 185 Z" fill="#10B981" stroke="#047857" stroke-width="2.5"/>
    <ellipse cx="45" cy="35" rx="22" ry="16" fill="#10B981"/>
    <circle cx="45" cy="45" r="18" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
    <rect x="32" y="44" width="26" height="18" rx="4" fill="#FFFFFF"/>
    <circle cx="38" cy="40" r="2.5" fill="#1E293B"/><circle cx="52" cy="40" r="2.5" fill="#1E293B"/>

    <!-- Nurse Cheering On -->
    <path d="M85 85 Q105 75 125 85 L130 185 L80 185 Z" fill="#38BDF8" stroke="#0284C7" stroke-width="2"/>
    <circle cx="105" cy="48" r="18" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
    <rect x="95" y="48" width="22" height="16" rx="3" fill="#FFFFFF"/>
    <circle cx="100" cy="44" r="2" fill="#1E293B"/><circle cx="112" cy="44" r="2" fill="#1E293B"/>
  </g>

  <!-- Giant Comic Scream Text -->
  <g filter="url(#cShadow3)">
    <path d="M100 25 L140 5 L160 20 L200 0 L230 22 L270 5 L290 25 L340 8 L330 40 L370 55 L330 75 L365 105 L325 98 L300 120 L275 95 L240 115 L225 92 L180 105 L185 78 L140 75 L160 50 Z" fill="#FEF2F2" stroke="#EF4444" stroke-width="3"/>
    <text x="240" y="45" font-family="'Impact', Arial Black, sans-serif" font-size="28" font-weight="900" fill="#DC2626" text-anchor="middle" letter-spacing="1">Á Á Á ! HÉT RẤT TO !</text>
    <text x="240" y="70" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#991B1B" text-anchor="middle">"ÔM CHẶT BỤNG BẦU RẶN HẾT SỨC!"</text>
  </g>

  <!-- Speech Bubble: Doctor Encouraging -->
  <g filter="url(#cShadow3)">
    <path d="M380 30 Q380 10 450 10 L590 10 Q630 10 630 35 Q630 65 560 65 L500 65 L485 85 L485 65 L420 65 Q380 65 380 30 Z" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
    <text x="505" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#047857" text-anchor="middle">"HÍT SÂU... CỐ LÊN CÔ ƠI!"</text>
    <text x="505" y="52" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#065F46" text-anchor="middle">"Rặn mạnh một hơi nữa là thấy bé rồi!"</text>
  </g>

  <!-- Panel Header Banner -->
  <rect x="20" y="16" width="280" height="32" rx="8" fill="#1E293B"/>
  <text x="160" y="37" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#F87171" text-anchor="middle">★ CẢNH 3: TIẾNG HÉT VƯỢT CẠN</text>

  <!-- Caption at bottom -->
  <rect x="25" y="402" width="600" height="34" rx="8" fill="#0F172A" opacity="0.85"/>
  <text x="325" y="424" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#F8FAFC" text-anchor="middle">Trong phòng sinh, cô giáo ôm chặt bụng bầu dồn hết sức hét thật to để đưa các con chào đời!</text>
</svg>
