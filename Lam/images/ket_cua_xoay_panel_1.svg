<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgP1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="60%" stop-color="#FEF3C7"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="bellyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="shadowP1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Nền nhà hàng lẩu -->
  <rect x="5" y="5" width="640" height="440" rx="16" fill="url(#bgP1)" stroke="#B45309" stroke-width="4"/>

  <!-- Tiêu đề Cảnh 1 -->
  <rect x="25" y="18" width="400" height="36" rx="10" fill="#D97706" filter="url(#shadowP1)"/>
  <text x="225" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">🍲 CẢNH 1: BỮA LẨU XA CÁCH NỬA MÉT &amp; BỤNG 135CM 📏</text>

  <!-- Bàn ăn lẩu bằng gỗ -->
  <rect x="420" y="220" width="220" height="150" rx="10" fill="#78350F" stroke="#451A03" stroke-width="3"/>
  <rect x="400" y="210" width="240" height="24" rx="6" fill="#92400E" stroke="#451A03" stroke-width="2"/>

  <!-- Nồi lẩu 2 ngăn bốc khói nghi ngút -->
  <ellipse cx="510" cy="210" rx="45" ry="18" fill="#E2E8F0" stroke="#475569" stroke-width="2"/>
  <path d="M 465 210 Q 510 240 555 210 Z" fill="#CBD5E1" stroke="#475569" stroke-width="2"/>
  <ellipse cx="490" cy="209" rx="18" ry="8" fill="#DC2626" opacity="0.8"/>
  <ellipse cx="530" cy="209" rx="18" ry="8" fill="#FDE047" opacity="0.8"/>
  <path d="M 495 195 Q 490 175 500 160 Q 505 145 500 130" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 525 195 Q 535 175 525 160 Q 520 145 530 130" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Ghế tựa mẹ ngồi -->
  <path d="M 50 330 L 50 200 Q 50 180 80 180 L 100 180" stroke="#9A3412" stroke-width="6" fill="none"/>
  <rect x="60" y="270" width="70" height="70" rx="8" fill="#EA580C" opacity="0.8"/>

  <!-- MẸ BẦU THÁNG CUỐI (TỰA LƯNG THƯ THÁI) -->
  <circle cx="110" cy="180" r="30" fill="#FFE4E6" stroke="#1E293B" stroke-width="2.5"/>
  <path d="M 85 180 C 85 145 135 145 135 180 Z" fill="#78350F"/>
  <rect x="100" y="145" width="20" height="10" rx="4" fill="#E11D48"/>
  <path d="M 105 178 Q 112 173 118 178" stroke="#1E293B" stroke-width="2" fill="none"/>
  <ellipse cx="102" cy="188" rx="5" ry="3" fill="#FB7185"/>
  <circle cx="115" cy="186" r="6" fill="#E11D48"/>

  <path d="M 95 210 L 80 300" stroke="#F43F5E" stroke-width="30" stroke-linecap="round"/>

  <!-- CHIẾC BỤNG BẦU SIÊU TO KHỔNG LỒ 135CM (TRÒN CĂNG NHƯ QUẢ CẦU) -->
  <ellipse cx="250" cy="270" rx="135" ry="110" fill="url(#bellyGrad1)" stroke="#881337" stroke-width="5" filter="url(#shadowP1)"/>
  
  <path d="M 385 270 L 400 270" stroke="#DC2626" stroke-width="4" stroke-dasharray="4,4"/>
  <text x="390" y="260" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#DC2626" text-anchor="middle">CẤN BÀN!</text>

  <!-- Thước dây vàng quấn quanh bụng ghi 135cm -->
  <path d="M 125 275 Q 250 340 375 275" stroke="#FACC15" stroke-width="8" fill="none"/>
  <rect x="220" y="305" width="60" height="18" rx="4" fill="#CA8A04"/>
  <text x="250" y="318" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">135 CM</text>

  <!-- Đĩa dưa hấu tráng miệng kê ngay trên đỉnh bụng bầu -->
  <ellipse cx="250" cy="158" rx="35" ry="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <path d="M 230 156 Q 250 142 270 156 Z" fill="#EF4444" stroke="#16A34A" stroke-width="3"/>
  <circle cx="245" cy="151" r="1.5" fill="#000000"/>
  <circle cx="255" cy="152" r="1.5" fill="#000000"/>

  <!-- ÔNG BỐ CẦM ĐŨA SIÊU DÀI ĐÚT CHO VỢ -->
  <circle cx="560" cy="140" r="28" fill="#FFEDD5" stroke="#1E293B" stroke-width="2.5"/>
  <path d="M 535 135 C 535 110 585 110 585 135 Z" fill="#1E293B"/>
  <ellipse cx="550" cy="142" rx="3" ry="4" fill="#1E293B"/>
  <ellipse cx="566" cy="142" rx="3" ry="4" fill="#1E293B"/>
  <path d="M 552 153 Q 560 160 568 153" stroke="#DC2626" stroke-width="2.5" fill="none"/>
  <path d="M 560 168 L 575 250" stroke="#0284C7" stroke-width="26" stroke-linecap="round"/>
  <path d="M 550 185 L 430 180 L 135 186" stroke="#B45309" stroke-width="4" stroke-linecap="round"/>
  <circle cx="128" cy="186" r="8" fill="#F87171" stroke="#DC2626" stroke-width="1.5"/>

  <!-- Hộp thoại của Bố -->
  <rect x="370" y="70" width="220" height="48" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" filter="url(#shadowP1)"/>
  <path d="M 520 118 L 535 128 L 515 125 Z" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
  <text x="480" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0369A1" text-anchor="middle">“Há miệng nào hoàng hậu ơi! Bụng to</text>
  <text x="480" y="106" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0369A1" text-anchor="middle">quá anh phải dùng đũa dài 1 mét nè!”</text>

  <!-- Hộp thoại của Mẹ -->
  <rect x="70" y="75" width="230" height="48" rx="10" fill="#FFFFFF" stroke="#E11D48" stroke-width="2" filter="url(#shadowP1)"/>
  <path d="M 120 123 L 115 145 L 135 125 Z" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
  <text x="185" y="94" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#BE123C" text-anchor="middle">“Ammm! Bụng to kê luôn đĩa dưa hấu,</text>
  <text x="185" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#BE123C" text-anchor="middle">tiện lợi 5 sao không lo đói anh ơi! 🍉😋”</text>
</svg>
