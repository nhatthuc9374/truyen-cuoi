<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <defs>
    <linearGradient id="medWallBg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="65%" stop-color="#BAE6FD"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="blanketGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7F3"/>
      <stop offset="100%" stop-color="#FBCFE8"/>
    </linearGradient>
    <filter id="medShadow1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Panel Border & Background -->
  <rect x="5" y="5" width="640" height="440" rx="16" fill="url(#medWallBg1)" stroke="#0284C7" stroke-width="4"/>

  <!-- Window with green view & sunlight -->
  <rect x="35" y="55" width="90" height="110" rx="6" fill="#F0FDFA" stroke="#0D9488" stroke-width="2.5"/>
  <line x1="80" y1="55" x2="80" y2="165" stroke="#0D9488" stroke-width="2"/>
  <line x1="35" y1="110" x2="125" y2="110" stroke="#0D9488" stroke-width="2"/>
  <circle cx="58" cy="78" r="12" fill="#FBBF24"/>
  <ellipse cx="95" cy="95" rx="16" ry="8" fill="#FFFFFF" opacity="0.85"/>
  <path d="M40 160 Q60 140 85 160 Q105 145 120 160 Z" fill="#86EFAC"/>

  <!-- Medicine Cabinet (Red Cross) on Wall -->
  <rect x="155" y="55" width="95" height="100" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <rect x="195" y="70" width="15" height="45" fill="#EF4444" rx="2"/>
  <rect x="180" y="85" width="45" height="15" fill="#EF4444" rx="2"/>
  <line x1="155" y1="125" x2="250" y2="125" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="165" y="132" width="14" height="18" fill="#38BDF8" rx="2"/>
  <rect x="185" y="130" width="16" height="20" fill="#F59E0B" rx="2"/>
  <rect x="207" y="133" width="12" height="17" fill="#10B981" rx="2"/>

  <!-- Medical Curtain Rail & Green Curtain -->
  <line x1="280" y1="45" x2="630" y2="45" stroke="#64748B" stroke-width="3"/>
  <path d="M600 45 C605 90 595 140 605 220 L635 220 L635 45 Z" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5" opacity="0.8"/>
  <line x1="608" y1="45" x2="612" y2="220" stroke="#5EEAD4" stroke-width="1.5"/>

  <!-- Floor separator line -->
  <line x1="5" y1="292" x2="645" y2="292" stroke="#94A3B8" stroke-width="2"/>

  <!-- Medical Bed with Rails -->
  <g id="medical-bed" transform="translate(130, 200)">
    <!-- Bed shadow -->
    <ellipse cx="230" cy="140" rx="220" ry="16" fill="#000000" opacity="0.18"/>

    <!-- Bed Legs & Wheels -->
    <rect x="25" y="80" width="12" height="55" fill="#64748B" rx="2"/>
    <circle cx="31" cy="138" r="8" fill="#334155"/>
    <circle cx="31" cy="138" r="4" fill="#CBD5E1"/>

    <rect x="420" y="80" width="12" height="55" fill="#64748B" rx="2"/>
    <circle cx="426" cy="138" r="8" fill="#334155"/>
    <circle cx="426" cy="138" r="4" fill="#CBD5E1"/>

    <!-- Bed Frame Bottom -->
    <rect x="15" y="70" width="430" height="16" rx="4" fill="#475569"/>

    <!-- Mattress (White/Blue) -->
    <rect x="18" y="42" width="424" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Headboard (Left) & Footboard (Right) -->
    <rect x="10" y="-15" width="16" height="95" rx="4" fill="#38BDF8" stroke="#0284C7" stroke-width="2"/>
    <circle cx="18" cy="-18" r="6" fill="#0284C7"/>
    <rect x="432" y="10" width="14" height="70" rx="4" fill="#38BDF8" stroke="#0284C7" stroke-width="2"/>

    <!-- Big Soft Pillow -->
    <ellipse cx="80" cy="40" rx="42" ry="18" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  </g>

  <!-- Pregnant Teacher Lying on Bed with HUGE BELLY -->
  <g id="pregnant-teacher" transform="translate(140, 160)">
    <!-- Legs under blanket -->
    <path d="M290 85 Q360 85 410 88 L410 105 L290 105 Z" fill="#F472B6"/>
    
    <!-- Giant Belly protruding high -->
    <ellipse cx="255" cy="55" rx="72" ry="58" fill="#FB7185" stroke="#E11D48" stroke-width="3"/>
    <!-- Cute highlight on round belly -->
    <path d="M220 32 Q255 12 285 30" stroke="#FFE4E6" stroke-width="6" fill="none" opacity="0.75" stroke-linecap="round"/>
    <circle cx="270" cy="55" r="4" fill="#E11D48" opacity="0.6"/>

    <!-- Upper Body & Pink Maternity Dress -->
    <path d="M120 75 Q180 65 210 68 L210 100 L120 100 Z" fill="#FDA4AF"/>

    <!-- Teacher Head resting on pillow -->
    <circle cx="70" cy="55" r="26" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
    <!-- Hair & Bun -->
    <path d="M42 55 C40 30 95 30 95 55 Z" fill="#3B2005"/>
    <circle cx="45" cy="40" r="12" fill="#3B2005"/>
    <circle cx="55" cy="35" r="5" fill="#F43F5E"/>

    <!-- Glasses & Serene / Relaxed Face -->
    <rect x="62" y="50" width="10" height="8" rx="2" fill="none" stroke="#DC2626" stroke-width="1.6"/>
    <rect x="76" y="50" width="10" height="8" rx="2" fill="none" stroke="#DC2626" stroke-width="1.6"/>
    <line x1="72" y1="54" x2="76" y2="54" stroke="#DC2626" stroke-width="1.6"/>
    <path d="M64 54 Q67 51 70 54" fill="none" stroke="#1E293B" stroke-width="2"/>
    <path d="M78 54 Q81 51 84 54" fill="none" stroke="#1E293B" stroke-width="2"/>
    <circle cx="60" cy="62" r="4" fill="#FCA5A5"/>
    <circle cx="88" cy="62" r="4" fill="#FCA5A5"/>
    <path d="M70 65 Q75 70 80 65" fill="none" stroke="#E11D48" stroke-width="2"/>

    <!-- Hand tenderly caressing giant belly -->
    <path d="M110 75 Q160 85 205 60" fill="none" stroke="#FDA4AF" stroke-width="12" stroke-linecap="round"/>
    <circle cx="205" cy="60" r="9" fill="#FFEDD5" stroke="#1E293B" stroke-width="1.8"/>

    <text x="245" y="10" font-size="16">✨</text>
    <text x="285" y="18" font-size="14">❤️</text>
  </g>

  <!-- Front Bed Safety Rails (Thanh chắn giường) -->
  <g id="bed-safety-rails" transform="translate(130, 200)">
    <!-- Top Horizontal Rail Bar -->
    <rect x="70" y="5" width="320" height="8" rx="3" fill="#94A3B8" stroke="#475569" stroke-width="1.5"/>
    <!-- Bottom Horizontal Rail Bar -->
    <rect x="70" y="48" width="320" height="6" rx="2" fill="#94A3B8" stroke="#475569" stroke-width="1.5"/>
    <!-- Vertical Slats / Bars -->
    <rect x="85" y="12" width="6" height="38" fill="#CBD5E1" stroke="#64748B" stroke-width="1"/>
    <rect x="135" y="12" width="6" height="38" fill="#CBD5E1" stroke="#64748B" stroke-width="1"/>
    <rect x="185" y="12" width="6" height="38" fill="#CBD5E1" stroke="#64748B" stroke-width="1"/>
    <rect x="235" y="12" width="6" height="38" fill="#CBD5E1" stroke="#64748B" stroke-width="1"/>
    <rect x="285" y="12" width="6" height="38" fill="#CBD5E1" stroke="#64748B" stroke-width="1"/>
    <rect x="335" y="12" width="6" height="38" fill="#CBD5E1" stroke="#64748B" stroke-width="1"/>
    <rect x="375" y="12" width="6" height="38" fill="#CBD5E1" stroke="#64748B" stroke-width="1"/>
    <!-- Release Lock Handle -->
    <rect x="65" y="2" width="10" height="14" rx="2" fill="#EF4444" stroke="#B91C1C" stroke-width="1"/>
  </g>

  <!-- Speech Bubble: Teacher -->
  <g filter="url(#medShadow1)">
    <path d="M260 25 Q260 8 360 8 L590 8 Q615 8 615 32 Q615 62 500 62 L430 62 L400 90 L410 62 L330 62 Q260 62 260 25 Z" fill="#FFF1F2" stroke="#F43F5E" stroke-width="2.5"/>
    <text x="440" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#9F1239" text-anchor="middle">"Nằm nghỉ một xíu cho đỡ mỏi lưng..."</text>
    <text x="440" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#9F1239" text-anchor="middle">"Bụng tháng cuối to quá, bé con đạp hoài à! ❤️"</text>
  </g>

  <!-- Panel Header Banner -->
  <rect x="20" y="16" width="360" height="32" rx="8" fill="#0284C7"/>
  <text x="200" y="37" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">★ CẢNH 1: CÔ NẰM NGHỈ Ở PHÒNG Y TẾ</text>

  <!-- Caption at bottom -->
  <rect x="25" y="402" width="600" height="34" rx="8" fill="#0F172A" opacity="0.85"/>
  <text x="325" y="424" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#F8FAFC" text-anchor="middle">Cô đang mang thai bụng rất to, mệt mỏi nên vào phòng y tế nằm nghỉ trên giường bệnh...</text>
</svg>
