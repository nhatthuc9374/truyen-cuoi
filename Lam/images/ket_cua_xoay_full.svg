<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 980" width="100%" height="100%">
  <defs>
    <linearGradient id="mainBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="40%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="fullBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadowFull" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Nền tổng thể -->
  <rect width="1330" height="980" fill="url(#fullBg)"/>

  <!-- BANNER TIÊU ĐỀ TRỌN BỘ TRUYỆN TRANH -->
  <rect x="20" y="12" width="1290" height="60" rx="14" fill="url(#mainBanner)" filter="url(#shadowFull)"/>
  <text x="665" y="49" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    🍃 TRUYỆN TRANH: CHIẾC BỤNG BẦU NGOẠI CỠ 135CM &amp; SỰ CỐ KẸT CỬA XOAY BÃO TÁP 🌀👶👶👶
  </text>

  <!-- KHUNG 4 TRANH (2 HÀNG x 2 CỘT) -->

  <!-- ==================== CẢNH 1 (GÓC TRÊN TRÁI) ==================== -->
  <g transform="translate(15, 82)">
    <rect width="640" height="430" rx="14" fill="#FFFBEB" stroke="#B45309" stroke-width="3"/>
    <rect x="15" y="12" width="370" height="30" rx="8" fill="#D97706"/>
    <text x="200" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">🍲 CẢNH 1: BỮA LẨU XA CÁCH NỬA MÉT &amp; BỤNG 135CM</text>
    
    <!-- Bàn lẩu -->
    <rect x="420" y="210" width="200" height="150" rx="10" fill="#78350F"/>
    <rect x="400" y="200" width="220" height="20" rx="5" fill="#92400E"/>
    <ellipse cx="490" cy="200" rx="40" ry="15" fill="#CBD5E1" stroke="#475569" stroke-width="2"/>
    <ellipse cx="475" cy="199" rx="15" ry="6" fill="#DC2626" opacity="0.8"/>
    <ellipse cx="505" cy="199" rx="15" ry="6" fill="#FDE047" opacity="0.8"/>
    <path d="M 480 185 Q 475 170 485 155" stroke="#94A3B8" stroke-width="2" fill="none"/>
    <path d="M 505 185 Q 515 170 505 155" stroke="#94A3B8" stroke-width="2" fill="none"/>

    <!-- Mẹ bầu ngồi ghế -->
    <path d="M 40 320 L 40 190 Q 40 170 70 170" stroke="#9A3412" stroke-width="5" fill="none"/>
    <circle cx="100" cy="170" r="26" fill="#FFE4E6" stroke="#1E293B" stroke-width="2"/>
    <path d="M 78 170 C 78 140 122 140 122 170 Z" fill="#78350F"/>
    <circle cx="105" cy="176" r="5" fill="#E11D48"/>

    <!-- Bụng bầu siêu to 135cm -->
    <ellipse cx="230" cy="260" rx="130" ry="105" fill="#FB7185" stroke="#BE123C" stroke-width="4"/>
    <path d="M 110 265 Q 230 330 350 265" stroke="#FACC15" stroke-width="7" fill="none"/>
    <rect x="200" y="295" width="60" height="18" rx="4" fill="#CA8A04"/>
    <text x="230" y="308" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">135 CM</text>
    <!-- Đĩa dưa hấu -->
    <ellipse cx="230" cy="155" rx="30" ry="6" fill="#F8FAFC" stroke="#64748B"/>
    <path d="M 215 153 Q 230 140 245 153 Z" fill="#EF4444" stroke="#16A34A" stroke-width="2"/>

    <!-- Bố cầm đũa 1 mét -->
    <circle cx="550" cy="130" r="24" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
    <path d="M 530 125 C 530 105 570 105 570 125 Z" fill="#1E293B"/>
    <path d="M 550 154 L 565 240" stroke="#0284C7" stroke-width="22" stroke-linecap="round"/>
    <path d="M 540 170 L 420 170 L 125 176" stroke="#B45309" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="118" cy="176" r="7" fill="#F87171" stroke="#DC2626"/>

    <!-- Lời thoại Cảnh 1 -->
    <rect x="360" y="55" width="200" height="42" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
    <text x="460" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#0369A1" text-anchor="middle">“Há miệng nào vợ ơi! Bụng to quá</text>
    <text x="460" y="87" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#0369A1" text-anchor="middle">anh phải dùng đũa dài 1 mét nè!”</text>
  </g>

  <!-- ==================== CẢNH 2 (GÓC TRÊN PHẢI) ==================== -->
  <g transform="translate(675, 82)">
    <rect width="640" height="430" rx="14" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="3"/>
    <rect x="15" y="12" width="370" height="30" rx="8" fill="#2563EB"/>
    <text x="200" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">🚨 CẢNH 2: PHA KẸT CỬA XOAY RÚNG ĐỘNG TTTM! 🌀</text>

    <!-- Khung cửa xoay kính -->
    <ellipse cx="320" cy="100" rx="160" ry="30" fill="#334155"/>
    <rect x="312" y="100" width="16" height="260" fill="#64748B"/>
    <!-- Cánh cửa kính cấn 2 bên -->
    <polygon points="320,110 200,140 200,340 320,340" fill="#93C5FD" fill-opacity="0.4" stroke="#0284C7" stroke-width="2"/>
    <polygon points="320,110 420,110 420,340 320,340" fill="#93C5FD" fill-opacity="0.4" stroke="#0284C7" stroke-width="2"/>

    <!-- Đèn báo động -->
    <circle cx="320" cy="75" r="12" fill="#EF4444"/>
    <text x="320" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#EF4444" text-anchor="middle">🚨 TÍT TÍT! KẸT BỤNG RỒI!</text>

    <!-- Mẹ kẹt giữa cửa -->
    <circle cx="270" cy="180" r="26" fill="#FFE4E6" stroke="#1E293B" stroke-width="2"/>
    <path d="M 248 180 C 248 150 292 150 292 180 Z" fill="#78350F"/>
    <circle cx="263" cy="178" r="4" fill="#1E293B"/>
    <circle cx="277" cy="178" r="4" fill="#1E293B"/>
    <ellipse cx="270" cy="192" rx="6" ry="4" fill="#E11D48"/>

    <!-- Bụng bầu 135cm cấn chặt 2 cánh cửa -->
    <ellipse cx="340" cy="255" rx="110" ry="90" fill="#F43F5E" stroke="#881337" stroke-width="4"/>
    <polygon points="250,270 238,260 246,278 232,286 254,282" fill="#FACC15"/>
    <polygon points="390,230 404,220 395,238 410,246 388,242" fill="#FACC15"/>
    <text x="425" y="230" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#DC2626">CẤN CỬA!</text>

    <!-- Bảo vệ cầm bộ đàm -->
    <circle cx="90" cy="240" r="22" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/>
    <rect x="75" y="220" width="30" height="10" rx="3" fill="#1E3A8A"/>
    <path d="M 90 262 L 90 340" stroke="#1E3A8A" stroke-width="20" stroke-linecap="round"/>
    <rect x="58" y="255" width="12" height="20" rx="2" fill="#334155"/>

    <!-- Lời thoại bảo vệ & mẹ -->
    <rect x="20" y="135" width="165" height="42" rx="8" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="1.5"/>
    <text x="102" y="152" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#1E3A8A" text-anchor="middle">“A lô! Cứu hộ khẩn cấp!</text>
    <text x="102" y="167" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#DC2626" text-anchor="middle">Mẹ bầu VIP bụng to kẹt cửa!”</text>

    <rect x="230" y="365" width="260" height="42" rx="8" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5"/>
    <text x="360" y="382" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#BE123C" text-anchor="middle">“Bụng to cấn luôn 2 cánh cửa rồi!</text>
    <text x="360" y="397" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#BE123C" text-anchor="middle">Biến thành vòng quay ngựa gỗ luôn! 🎠🤣”</text>
  </g>

  <!-- ==================== CẢNH 3 (GÓC DƯỚI TRÁI) ==================== -->
  <g transform="translate(15, 525)">
    <rect width="640" height="430" rx="14" fill="#FEFCE8" stroke="#CA8A04" stroke-width="3"/>
    <rect x="15" y="12" width="380" height="30" rx="8" fill="#EAB308"/>
    <text x="205" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#78350F" text-anchor="middle">⚡ CẢNH 3: CÚ ĐẠP GIẢI CỨU CỦA 3 SIÊU QUẬY! 💥</text>

    <!-- Cửa xoay bung toang, vệt gió vù vù -->
    <path d="M 80 200 Q 180 150 280 180" stroke="#0284C7" stroke-width="4" stroke-dasharray="6,6" fill="none"/>
    <path d="M 60 270 Q 160 220 260 250" stroke="#0284C7" stroke-width="4" stroke-dasharray="6,6" fill="none"/>
    <line x1="120" y1="120" x2="60" y2="330" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>

    <!-- Mẹ bầu phóng vọt ra ngoài sảnh -->
    <circle cx="360" cy="170" r="26" fill="#FFE4E6" stroke="#1E293B" stroke-width="2"/>
    <path d="M 338 170 C 338 140 382 140 382 170 Z" fill="#78350F"/>
    <path d="M 352 168 Q 358 163 364 168" stroke="#1E293B" stroke-width="2" fill="none"/>
    <ellipse cx="360" cy="182" rx="6" ry="4" fill="#E11D48"/>

    <!-- Bụng bầu phát ra hào quang & 3 vết đạp BỤP BỤP BỤP -->
    <ellipse cx="310" cy="255" rx="125" ry="100" fill="#EC4899" stroke="#831843" stroke-width="4"/>
    <!-- 3 vết chân bé xíu -->
    <ellipse cx="250" cy="230" rx="12" ry="15" fill="#FBCFE8" stroke="#DB2777" stroke-width="1.5"/>
    <circle cx="248" cy="210" r="2.5" fill="#DB2777"/>
    <circle cx="254" cy="209" r="3" fill="#DB2777"/>
    <text x="235" y="198" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#BE185D">BỤP 1!</text>

    <ellipse cx="300" cy="270" rx="13" ry="16" fill="#FBCFE8" stroke="#DB2777" stroke-width="1.5"/>
    <circle cx="298" cy="250" r="3" fill="#DB2777"/>
    <circle cx="305" cy="249" r="3" fill="#DB2777"/>
    <text x="300" y="308" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#BE185D">BỤP 2!</text>

    <ellipse cx="360" cy="225" rx="12" ry="15" fill="#FBCFE8" stroke="#DB2777" stroke-width="1.5"/>
    <circle cx="358" cy="205" r="2.5" fill="#DB2777"/>
    <circle cx="364" cy="204" r="3" fill="#DB2777"/>
    <text x="375" y="198" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#BE185D">BỤP 3!</text>

    <!-- Bố dang tay đón vợ -->
    <circle cx="540" cy="210" r="24" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
    <path d="M 520 205 C 520 185 560 185 560 205 Z" fill="#1E293B"/>
    <path d="M 535 210 Q 540 205 545 210" stroke="#1E293B" stroke-width="2" fill="none"/>
    <path d="M 520 235 L 440 240" stroke="#0284C7" stroke-width="10" stroke-linecap="round"/>
    <path d="M 540 234 L 550 330" stroke="#0284C7" stroke-width="22" stroke-linecap="round"/>

    <!-- Lời thoại Cảnh 3 -->
    <rect x="410" y="80" width="200" height="42" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
    <text x="510" y="97" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#0369A1" text-anchor="middle">“HOAN HÔ! Ba siêu nhân nhí</text>
    <text x="510" y="112" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#0369A1" text-anchor="middle">đạp bung cửa giải cứu mẹ rồi! 👏”</text>

    <rect x="170" y="365" width="270" height="42" rx="8" fill="#FFFFFF" stroke="#BE185D" stroke-width="1.5"/>
    <text x="305" y="382" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#9D174D" text-anchor="middle">“Ối anh ơi! Ba đứa đạp vỡ ối rồi...</text>
    <text x="305" y="397" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#BE123C" text-anchor="middle">VÀO VIỆN ĐẺ NGAY THÔI! 🚑💨”</text>
  </g>

  <!-- ==================== CẢNH 4 (GÓC DƯỚI PHẢI) ==================== -->
  <g transform="translate(675, 525)">
    <rect width="640" height="430" rx="14" fill="#FDF2F8" stroke="#BE185D" stroke-width="3"/>
    <rect x="15" y="12" width="400" height="30" rx="8" fill="#DB2777"/>
    <text x="215" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">🎉 CẢNH 4: CHÀO ĐÓN 3 "CỦ CẢI BÉO" MỈM MỈN 9.6KG! 👶</text>

    <!-- Giường sinh & Mẹ nằm -->
    <rect x="25" y="230" width="340" height="120" rx="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
    <circle cx="85" cy="180" r="24" fill="#FFE4E6" stroke="#1E293B" stroke-width="2"/>
    <path d="M 65 180 C 65 150 105 150 105 180 Z" fill="#78350F"/>
    <path d="M 80 178 Q 85 174 90 178" stroke="#1E293B" stroke-width="2" fill="none"/>
    <path d="M 82 190 Q 87 196 92 190" stroke="#E11D48" stroke-width="2" fill="none"/>
    <path d="M 110 240 L 350 255 L 350 320 L 110 320 Z" fill="#FBCFE8"/>

    <!-- Nôi 3 em bé mỉm mỉn -->
    <rect x="210" y="150" width="225" height="90" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.5"/>

    <!-- Bé 1 (Xanh - 3.2kg) -->
    <circle cx="245" cy="190" r="16" fill="#FFEDD5" stroke="#EA580C"/>
    <ellipse cx="240" cy="194" rx="3" ry="2" fill="#FB7185"/>
    <ellipse cx="250" cy="194" rx="3" ry="2" fill="#FB7185"/>
    <path d="M 232 185 C 232 170 258 170 258 185 Z" fill="#38BDF8"/>
    <text x="245" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" fill="#0369A1" text-anchor="middle">3.2 kg</text>

    <!-- Bé 2 (Hồng - 3.1kg) -->
    <circle cx="310" cy="185" r="18" fill="#FFE4E6" stroke="#E11D48"/>
    <ellipse cx="304" cy="190" rx="4" ry="3" fill="#F43F5E"/>
    <ellipse cx="316" cy="190" rx="4" ry="3" fill="#F43F5E"/>
    <circle cx="310" cy="168" r="3" fill="#F43F5E"/>
    <text x="310" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" fill="#BE123C" text-anchor="middle">3.1 kg</text>

    <!-- Bé 3 (Vàng - 3.3kg) -->
    <circle cx="375" cy="190" r="17" fill="#FFEDD5" stroke="#CA8A04"/>
    <ellipse cx="370" cy="194" rx="4" ry="2" fill="#FB7185"/>
    <ellipse cx="380" cy="194" rx="4" ry="2" fill="#FB7185"/>
    <path d="M 362 185 C 362 170 388 170 388 185 Z" fill="#FDE047"/>
    <text x="375" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" fill="#A16207" text-anchor="middle">3.3 kg</text>

    <!-- Bác sĩ trao cúp -->
    <circle cx="540" cy="160" r="24" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/>
    <rect x="530" y="157" width="20" height="10" rx="2" fill="#38BDF8"/>
    <path d="M 540 184 L 545 280" stroke="#0284C7" stroke-width="22" stroke-linecap="round"/>
    <!-- Cúp vàng -->
    <path d="M 475 160 L 505 160 L 500 190 Q 490 200 480 190 Z" fill="#EAB308" stroke="#A16207" stroke-width="2"/>
    <text x="490" y="178" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#78350F" text-anchor="middle">#1</text>

    <!-- Bố bái phục -->
    <circle cx="150" cy="320" r="20" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
    <ellipse cx="155" cy="322" rx="3" ry="2" fill="#38BDF8"/>
    <path d="M 143 330 Q 150 335 157 330" stroke="#DC2626" stroke-width="2" fill="none"/>

    <!-- Lời thoại Cảnh 4 -->
    <rect x="25" y="365" width="240" height="42" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
    <text x="145" y="382" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#0369A1" text-anchor="middle">“Vợ ơi em là siêu nhân vũ trụ!</text>
    <text x="145" y="397" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#0369A1" text-anchor="middle">3 củ cải gần 10 cân! Anh bái phục! 🙇‍♂️❤️”</text>

    <rect x="420" y="80" width="190" height="42" rx="8" fill="#FFFFFF" stroke="#CA8A04" stroke-width="1.5"/>
    <text x="515" y="97" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#854D0E" text-anchor="middle">“Cúp Vàng cho Mẹ Bầu 135cm!</text>
    <text x="515" y="112" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#854D0E" text-anchor="middle">Ba bé má phúng phính cưng xỉu! 🏆”</text>
  </g>
</svg>
