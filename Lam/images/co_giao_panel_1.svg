<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cWall1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="65%" stop-color="#FDE68A"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="cBoard1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <filter id="shadowC1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Panel Border & Classroom Background -->
  <rect x="5" y="5" width="640" height="440" rx="16" fill="url(#cWall1)" stroke="#1E293B" stroke-width="4"/>

  <!-- Classroom Window -->
  <rect x="30" y="55" width="85" height="105" rx="6" fill="#BAE6FD" stroke="#64748B" stroke-width="2.5"/>
  <line x1="72" y1="55" x2="72" y2="160" stroke="#64748B" stroke-width="2"/>
  <line x1="30" y1="107" x2="115" y2="107" stroke="#64748B" stroke-width="2"/>

  <!-- Blackboard with Lesson -->
  <rect x="135" y="45" width="350" height="135" rx="8" fill="url(#cBoard1)" stroke="#78350F" stroke-width="5"/>
  <text x="310" y="76" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#FEF08A" text-anchor="middle">★ TIẾT HỌC NGỮ VĂN ★</text>
  <text x="180" y="110" font-family="'Segoe UI', cursive, sans-serif" font-size="16" fill="#FFFFFF">"Công cha như núi Thái Sơn..."</text>
  <text x="180" y="140" font-family="'Segoe UI', cursive, sans-serif" font-size="16" fill="#86EFAC">"Nghĩa mẹ như nước trong nguồn..."</text>

  <!-- Clock on Wall -->
  <circle cx="550" cy="85" r="24" fill="#FFFFFF" stroke="#334155" stroke-width="2.5"/>
  <line x1="550" y1="85" x2="550" y2="68" stroke="#1E293B" stroke-width="2"/>
  <line x1="550" y1="85" x2="562" y2="85" stroke="#EF4444" stroke-width="1.5"/>

  <!-- Teacher with GIANT PREGNANT BELLY (Center-Left) -->
  <g id="pregnant-teacher" transform="translate(180, 110)">
    <!-- Shadow -->
    <ellipse cx="90" cy="205" rx="75" ry="14" fill="#000000" opacity="0.2"/>

    <!-- Áo Dài / Floral Maternity Dress -->
    <path d="M50 75 Q75 60 100 75 L150 200 L25 200 Z" fill="#FDA4AF" stroke="#E11D48" stroke-width="2.5"/>

    <!-- HUGE BABY BUMP -->
    <ellipse cx="115" cy="140" rx="68" ry="58" fill="#FB7185" stroke="#E11D48" stroke-width="3"/>
    <path d="M80 110 Q120 90 155 120" stroke="#FFE4E6" stroke-width="5" fill="none" opacity="0.6"/>

    <!-- Teacher Hands (One holding chalk pointing to board, one gently resting on big belly) -->
    <path d="M45 80 Q20 110 35 130" fill="none" stroke="#FDA4AF" stroke-width="14" stroke-linecap="round"/>
    <circle cx="35" cy="130" r="9" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
    <line x1="30" y1="125" x2="10" y2="105" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Hand resting on belly -->
    <path d="M85 85 Q115 110 105 135" fill="none" stroke="#FDA4AF" stroke-width="14" stroke-linecap="round"/>
    <circle cx="105" cy="135" r="10" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>

    <!-- Teacher Head & Friendly Face -->
    <circle cx="75" cy="42" r="26" fill="#FFEDD5" stroke="#1E293B" stroke-width="2.5"/>
    <circle cx="75" cy="18" r="12" fill="#3B2005"/> <!-- Hair bun -->
    <path d="M48 42 C45 15 105 15 102 42 Z" fill="#3B2005"/>
    <!-- Glasses -->
    <rect x="62" y="38" width="11" height="8" rx="1.5" fill="none" stroke="#DC2626" stroke-width="1.8"/>
    <rect x="78" y="38" width="11" height="8" rx="1.5" fill="none" stroke="#DC2626" stroke-width="1.8"/>
    <line x1="73" y1="42" x2="78" y2="42" stroke="#DC2626" stroke-width="1.8"/>
    <!-- Kind smiling eyes & warm smile -->
    <circle cx="67" cy="42" r="2" fill="#1E293B"/><circle cx="83" cy="42" r="2" fill="#1E293B"/>
    <circle cx="58" cy="48" r="4" fill="#FCA5A5"/><circle cx="92" cy="48" r="4" fill="#FCA5A5"/>
    <path d="M70 50 Q75 56 80 50" fill="none" stroke="#E11D48" stroke-width="2"/>
  </g>

  <!-- Students Studying at Desks (Right Side) -->
  <g id="students-row" transform="translate(380, 210)">
    <!-- Desk 1 (Front) -->
    <ellipse cx="60" cy="130" rx="55" ry="10" fill="#000000" opacity="0.2"/>
    <rect x="0" y="60" width="140" height="18" rx="3" fill="#D97706" stroke="#92400E" stroke-width="2"/>
    <rect x="15" y="78" width="6" height="50" fill="#475569"/><rect x="120" y="78" width="6" height="50" fill="#475569"/>

    <!-- Student 1 (Writing & Looking up) -->
    <ellipse cx="50" cy="55" rx="18" ry="22" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
    <circle cx="50" cy="25" r="16" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
    <path d="M35 20 C32 5 65 5 65 20 Z" fill="#292524"/>
    <circle cx="45" cy="24" r="2" fill="#1E293B"/><circle cx="55" cy="24" r="2" fill="#1E293B"/>
    <path d="M46 32 Q50 36 54 32" fill="none" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Student 2 (Beside) -->
    <ellipse cx="100" cy="55" rx="18" ry="22" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
    <circle cx="100" cy="25" r="16" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
    <path d="M85 20 C82 5 115 5 115 20 Z" fill="#3B2005"/>
    <!-- Cute Ponytail -->
    <circle cx="118" cy="20" r="5" fill="#EC4899"/>
    <circle cx="95" cy="24" r="2" fill="#1E293B"/><circle cx="105" cy="24" r="2" fill="#1E293B"/>
  </g>

  <!-- Speech Bubble: Teacher -->
  <g filter="url(#shadowC1)">
    <path d="M120 20 Q120 0 190 0 L400 0 Q440 0 440 25 Q440 52 380 52 L300 52 L280 75 L285 52 L170 52 Q120 52 120 20 Z" fill="#FFF1F2" stroke="#F43F5E" stroke-width="2.5"/>
    <text x="280" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#9F1239" text-anchor="middle">"Các em chép bài cẩn thận nhé..."</text>
    <text x="280" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#9F1239" text-anchor="middle">"Hôm nay mấy em bé trong bụng cô quẫy mạnh ghê! ❤️"</text>
  </g>

  <!-- Speech Bubble: Students -->
  <g filter="url(#shadowC1)">
    <path d="M420 120 Q420 95 480 95 L590 95 Q630 95 630 120 Q630 148 570 148 L530 148 L515 172 L520 148 L460 148 Q420 148 420 120 Z" fill="#F0F9FF" stroke="#0284C7" stroke-width="2.5"/>
    <text x="525" y="118" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0369A1" text-anchor="middle">"Bụng cô to tròn quá chừng!"</text>
    <text x="525" y="136" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0369A1" text-anchor="middle">"Chắc sắp được đón em bé rồi ạ!"</text>
  </g>

  <!-- Panel Header Banner -->
  <rect x="20" y="16" width="280" height="32" rx="8" fill="#1E293B"/>
  <text x="160" y="37" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#38BDF8" text-anchor="middle">★ CẢNH 1: BỤNG BẦU SIÊU TO</text>

  <!-- Caption at bottom -->
  <rect x="25" y="402" width="600" height="34" rx="8" fill="#0F172A" opacity="0.85"/>
  <text x="325" y="424" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#F8FAFC" text-anchor="middle">Cả lớp đang chăm chú học bài, cô giáo với chiếc bụng bầu siêu to vẫn say sưa giảng dạy...</text>
</svg>
