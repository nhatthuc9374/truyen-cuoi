<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 650 450 width=100% height=100%>
  <defs>
    <linearGradient id=p3HallWall x1=0% y1=0% x2=0% y2=100%>
      <stop offset=0% stop-color=#FCE7F3/>
      <stop offset=65% stop-color=#FBCFE8/>
      <stop offset=65% stop-color=#FED7AA/>
      <stop offset=100% stop-color=#F97316/>
    </linearGradient>
    <filter id=p3Shadow x=-5% y=-5% width=110% height=110%>
      <feDropShadow dx=2 dy=3 stdDeviation=2 flood-opacity=0.25/>
    </filter>
  </defs>

  <rect x=5 y=5 width=640 height=440 rx=16 fill=url(#p3HallWall) stroke=#E11D48 stroke-width=4/>

  <rect x=15 y=15 width=620 height=40 rx=8 fill=#FFFFFF stroke=#E11D48 stroke-width=2/>
  <text x=325 y=42 font-family='Segoe UI', Roboto, sans-serif font-size=18 font-weight=900 fill=#BE123C text-anchor=middle letter-spacing=1>
    🚨 CẢNH 3: CUỘC GỌI CỨU VIỆN THẦN TỐC – GỌI CỨU VIỆN 115
  </text>

  <!-- Open Front Door showing Night Outside -->
  <g id=doorway transform=translate(40, 70)>
    <!-- Door frame -->
    <rect x=0 y=0 width=240 height=350 fill=#0F172A stroke=#78350F stroke-width=6/>
    <!-- Open wooden door pushed left -->
    <polygon points=0,0 -40,30 -40,340 0,350 fill=#B45309 stroke=#78350F stroke-width=3/>
    <circle cx=-25 cy=180 r=6 fill=#FDE047/>
    <!-- Night sky with stars & Ambulance lights -->
    <circle cx=50 cy=40 r=2 fill=#FEF08A/>
    <circle cx=120 cy=65 r=1.5 fill=#FEF08A/>
    <circle cx=180 cy=30 r=2 fill=#FEF08A/>
    <!-- Red & Blue emergency flashing lights outside -->
    <ellipse cx=70 cy=300 rx=40 ry=15 fill=#EF4444 opacity=0.6 filter=url(#p3Shadow)/>
    <ellipse cx=160 cy=300 rx=40 ry=15 fill=#3B82F6 opacity=0.6 filter=url(#p3Shadow)/>
    <!-- Ambulance silhouette in distance -->
    <rect x=80 y=270 width=70 height=40 rx=6 fill=#FFFFFF/>
    <rect x=105 y=280 width=20 height=20 rx=2 fill=#EF4444/>
    <circle cx=95 cy=310 r=8 fill=#1E293B/>
    <circle cx=135 cy=310 r=8 fill=#1E293B/>
  </g>

  <!-- Hallway Floor -->
  <line x1=5 y1=360 x2=645 y2=360 stroke=#C2410C stroke-width=3/>

  <!-- Daughter Standing with Phone & Maternity Bag -->
  <g id=daughter3 transform=translate(320, 95) filter=url(#p3Shadow)>
    <!-- Pigtails -->
    <ellipse cx=20 cy=70 rx=16 ry=30 fill=#F472B6 stroke=#DB2777 stroke-width=1.5/>
    <ellipse cx=110 cy=70 rx=16 ry=30 fill=#F472B6 stroke=#DB2777 stroke-width=1.5/>
    <circle cx=28 cy=48 r=6 fill=#F43F5E/>
    <circle cx=102 cy=48 r=6 fill=#F43F5E/>

    <!-- Head & Face -->
    <circle cx=65 cy=70 r=32 fill=#FFEDD5 stroke=#9A3412 stroke-width=2/>
    <path d=M38 58 Q65 42 92 58 fill=none stroke=#F472B6 stroke-width=8/>
    <!-- Determined expressive anime eyes -->
    <ellipse cx=50 cy=68 rx=6.5 ry=9 fill=#1E3A8A/>
    <circle cx=48 cy=65 r=3 fill=#FFFFFF/>
    <ellipse cx=78 cy=68 rx=6.5 ry=9 fill=#1E3A8A/>
    <circle cx=76 cy=65 r=3 fill=#FFFFFF/>
    <!-- Confident mouth talking on phone -->
    <path d=M58 84 Q65 90 72 84 fill=none stroke=#BE123C stroke-width=2.5/>

    <!-- Smartphone to Ear -->
    <rect x=25 y=60 width=14 height=28 rx=3 fill=#1E293B stroke=#64748B stroke-width=1/>
    <!-- Right Arm holding phone -->
    <path d=M42 115 Q30 100 35 75 fill=none stroke=#FCE7F3 stroke-width=12 stroke-linecap=round/>
    <circle cx=35 cy=72 r=6 fill=#FFEDD5/>

    <!-- Hoodie with Bunny Logo -->
    <path d=M38 102 Q65 96 92 102 L98 185 L32 185 Z fill=#FCE7F3 stroke=#DB2777 stroke-width=2.5/>
    <ellipse cx=65 cy=140 rx=10 ry=9 fill=#FFFFFF stroke=#DB2777 stroke-width=1/>
    <ellipse cx=60 cy=126 rx=3 ry=8 fill=#FFFFFF stroke=#DB2777 stroke-width=1/>
    <ellipse cx=70 cy=126 rx=3 ry=8 fill=#FFFFFF stroke=#DB2777 stroke-width=1/>

    <!-- Left Arm holding Maternity Bag -->
    <path d=M90 115 Q115 135 125 170 fill=none stroke=#FCE7F3 stroke-width=12 stroke-linecap=round/>
    <circle cx=125 cy=172 r=6 fill=#FFEDD5/>

    <!-- Maternity Bag (Túi Đồ Đi Sinh) -->
    <g id=maternity-bag transform=translate(105, 165)>
      <path d=M20 0 Q30 -15 40 0 fill=none stroke=#1E3A8A stroke-width=4/>
      <rect x=5 y=0 width=70 height=60 rx=12 fill=#38BDF8 stroke=#0284C7 stroke-width=2.5/>
      <rect x=15 y=20 width=50 height=30 rx=6 fill=#BAE6FD stroke=#0284C7 stroke-width=1.5/>
      <text x=40 y=78 font-family='Segoe UI', Roboto, sans-serif font-size=12 font-weight=bold fill=#0369A1 text-anchor=middle>túi đồ đi sinh ↙</text>
    </g>

    <!-- Jeans & Sneakers -->
    <rect x=40 y=185 width=22 height=65 rx=5 fill=#93C5FD stroke=#2563EB stroke-width=2/>
    <rect x=68 y=185 width=22 height=65 rx=5 fill=#93C5FD stroke=#2563EB stroke-width=2/>
    <ellipse cx=50 cy=254 rx=14 ry=8 fill=#FFFFFF stroke=#64748B stroke-width=2/>
    <ellipse cx=80 cy=254 rx=14 ry=8 fill=#FFFFFF stroke=#64748B stroke-width=2/>
  </g>

  <!-- Big Speech Bubble (Calling 115) -->
  <g id=bubble3 transform=translate(30, 80)>
    <rect x=0 y=0 width=230 height=90 rx=20 fill=#FFFFFF stroke=#1E1B4B stroke-width=2.5 filter=url(#p3Shadow)/>
    <path d=M230 45 L260 55 L230 65 Z fill=#FFFFFF stroke=#1E1B4B stroke-width=2.5/>
    <path d=M228 47 L256 55 L228 63 Z fill=#FFFFFF/>
    <text x=115 y=30 font-family='Segoe UI', Roboto, sans-serif font-size=15 font-weight=bold fill=#1E1B4B text-anchor=middle>Dạ, mẹ em chuyển dạ!</text>
    <text x=115 y=54 font-family='Segoe UI', Roboto, sans-serif font-size=15 font-weight=bold fill=#BE123C text-anchor=middle>Con gọi cấp cứu</text>
    <text x=115 y=76 font-family='Segoe UI', Roboto, sans-serif font-size=16 font-weight=900 fill=#DC2626 text-anchor=middle>115 ĐÂY Ạ! 🚑</text>
  </g>
</svg>