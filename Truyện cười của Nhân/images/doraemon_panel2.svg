<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="60%" stop-color="#C8E6C9"/>
      <stop offset="100%" stop-color="#A5D6A7"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A1887F"/>
      <stop offset="50%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#5D4037"/>
    </linearGradient>
    <radialGradient id="iqGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF59D" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FFEE58" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="doraemonBlue2" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#29B6F6"/>
      <stop offset="70%" stop-color="#0288D1"/>
      <stop offset="100%" stop-color="#01579B"/>
    </radialGradient>
    <radialGradient id="bellGold2" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFEE58"/>
      <stop offset="60%" stop-color="#FDD835"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="comicShadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="6" stdDeviation="4" flood-color="#1B5E20" flood-opacity="0.2"/>
    </filter>
    <filter id="bubbleShadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- BACKGROUND: PHÒNG HỌC BAN NGÀY TƯƠI SÁNG -->
  <rect x="15" y="15" width="1170" height="770" rx="24" fill="url(#bgGrad2)" stroke="#263238" stroke-width="8"/>

  <!-- Tường và hoa văn manga -->
  <line x1="20" y1="520" x2="1180" y2="520" stroke="#388E3C" stroke-width="6"/>
  <!-- Sàn gỗ phòng học -->
  <rect x="20" y="520" width="1160" height="260" fill="#FFE0B2"/>
  <line x1="20" y1="585" x2="1180" y2="585" stroke="#D7CCC8" stroke-width="3"/>
  <line x1="20" y1="655" x2="1180" y2="655" stroke="#D7CCC8" stroke-width="3"/>
  <line x1="20" y1="725" x2="1180" y2="725" stroke="#D7CCC8" stroke-width="3"/>

  <!-- HÀO QUANG TRI THỨC VÀ Ý TƯỞNG TỎA SÁNG QUANH NOBITA -->
  <circle cx="580" cy="360" r="320" fill="url(#iqGlow)"/>

  <!-- TIÊU ĐỀ KHUNG TRUYỆN -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="410" height="42" rx="10" fill="#2E7D32" stroke="#1B5E20" stroke-width="3" filter="url(#comicShadow2)"/>
    <text x="205" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="900" fill="#FFF" text-anchor="middle" letter-spacing="1">KHUNG 2: ĂN ĐẾN ĐÂU NHỚ ĐẾN ĐÓ!</text>
  </g>

  <!-- BÀN HỌC BẰNG GỖ -->
  <g id="desk" transform="translate(240, 480)" filter="url(#comicShadow2)">
    <rect x="0" y="0" width="680" height="50" rx="6" fill="url(#deskGrad)" stroke="#3E2723" stroke-width="5"/>
    <!-- Chân bàn -->
    <rect x="30" y="50" width="30" height="200" fill="#5D4037" stroke="#3E2723" stroke-width="4"/>
    <rect x="620" y="50" width="30" height="200" fill="#5D4037" stroke="#3E2723" stroke-width="4"/>

    <!-- Quyển sách Toán đang mở trên bàn với trang sách bị in lõm hình lát bánh mì -->
    <g transform="translate(80, -35)">
      <!-- Trang sách trái -->
      <path d="M 0 35 Q 80 25 140 35 L 140 5 L 0 5 Z" fill="#FFFDE7" stroke="#3E2723" stroke-width="3"/>
      <!-- Trang sách phải (vết lõm in bánh mì) -->
      <path d="M 140 35 Q 200 25 280 35 L 280 5 L 140 5 Z" fill="#FFFDE7" stroke="#3E2723" stroke-width="3"/>
      <line x1="140" y1="5" x2="140" y2="35" stroke="#3E2723" stroke-width="4"/>
      <!-- Dòng chữ trong sách -->
      <line x1="15" y1="12" x2="125" y2="12" stroke="#9E9E9E" stroke-width="2"/>
      <line x1="15" y1="18" x2="125" y2="18" stroke="#9E9E9E" stroke-width="2"/>
      <line x1="15" y1="24" x2="105" y2="24" stroke="#9E9E9E" stroke-width="2"/>
      <!-- Trang bên phải có viền bánh mì ịn vào -->
      <rect x="160" y="8" width="90" height="22" rx="4" fill="#FFF9C4" stroke="#FFB300" stroke-width="2" stroke-dasharray="4,2"/>
      <text x="205" y="24" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#E65100" text-anchor="middle">ĐÃ IN LÊN BÁNH!</text>
    </g>
  </g>

  <!-- ==================== DORAEMON BÊN PHẢI CẦM ĐĨA BÁNH ==================== -->
  <g id="doraemonHappy" transform="translate(860, 320)" filter="url(#comicShadow2)">
    <!-- Chân -->
    <ellipse cx="60" cy="380" rx="45" ry="25" fill="#FFF" stroke="#263238" stroke-width="4"/>
    <ellipse cx="160" cy="380" rx="45" ry="25" fill="#FFF" stroke="#263238" stroke-width="4"/>
    <!-- Thân tròn -->
    <circle cx="110" cy="260" r="110" fill="url(#doraemonBlue2)" stroke="#263238" stroke-width="5"/>
    <circle cx="110" cy="275" r="75" fill="#FFF" stroke="#263238" stroke-width="4"/>
    <path d="M 55 275 C 55 330, 165 330, 165 275 Z" fill="#FFF" stroke="#263238" stroke-width="4"/>
    <line x1="55" y1="275" x2="165" y2="275" stroke="#263238" stroke-width="4"/>

    <!-- Tay trái giơ ngón tay cái 'Like' / Thumbs-up -->
    <path d="M 210 240 Q 250 200 240 170" fill="none" stroke="#0288D1" stroke-width="32" stroke-linecap="round"/>
    <path d="M 210 240 Q 250 200 240 170" fill="none" stroke="#263238" stroke-width="4" stroke-linecap="round"/>
    <circle cx="240" cy="165" r="22" fill="#FFF" stroke="#263238" stroke-width="4"/>

    <!-- Tay phải cầm đĩa đựng cả chồng bánh mì trí nhớ -->
    <path d="M 20 250 Q -30 240 -30 200" fill="none" stroke="#0288D1" stroke-width="32" stroke-linecap="round"/>
    <path d="M 20 250 Q -30 240 -30 200" fill="none" stroke="#263238" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-30" cy="195" r="22" fill="#FFF" stroke="#263238" stroke-width="4"/>

    <!-- ĐĨA BÁNH MÌ TRÊN TAY -->
    <g transform="translate(-100, 160)">
      <ellipse cx="60" cy="40" rx="55" ry="15" fill="#E0E0E0" stroke="#757575" stroke-width="3"/>
      <!-- Chồng 3 lát bánh mì -->
      <rect x="25" y="15" width="70" height="15" rx="3" fill="#D7CCC8" stroke="#5D4037" stroke-width="2"/>
      <rect x="25" y="0" width="70" height="15" rx="3" fill="#FFE082" stroke="#5D4037" stroke-width="2"/>
      <rect x="25" y="-15" width="70" height="15" rx="3" fill="#FFF9C4" stroke="#5D4037" stroke-width="2"/>
      <text x="60" y="-3" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" fill="#795548" text-anchor="middle">LỊCH SỬ</text>
    </g>

    <!-- Đầu Doraemon -->
    <circle cx="110" cy="110" r="105" fill="url(#doraemonBlue2)" stroke="#263238" stroke-width="5"/>
    <path d="M 25 135 C 25 65, 195 65, 195 135 C 195 205, 25 205, 25 135 Z" fill="#FFF" stroke="#263238" stroke-width="4"/>

    <!-- Mắt nháy 1 bên vui vẻ: Mắt trái cong tít nhắm vui, mắt phải mở to -->
    <path d="M 80 75 Q 92 60 102 75" fill="none" stroke="#263238" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="130" cy="70" rx="16" ry="24" fill="#FFF" stroke="#263238" stroke-width="4"/>
    <ellipse cx="127" cy="73" rx="7" ry="10" fill="#212121"/>
    <circle cx="125" cy="70" r="3" fill="#FFF"/>

    <!-- Mũi đỏ -->
    <circle cx="110" cy="95" r="14" fill="#E53935" stroke="#B71C1C" stroke-width="3"/>
    <circle cx="106" cy="91" r="4" fill="#FFF"/>

    <!-- Đường nhân trung và ria mép -->
    <line x1="110" y1="109" x2="110" y2="145" stroke="#263238" stroke-width="4"/>
    <line x1="40" y1="105" x2="90" y2="112" stroke="#263238" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="125" x2="88" y2="125" stroke="#263238" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="145" x2="92" y2="138" stroke="#263238" stroke-width="3" stroke-linecap="round"/>

    <line x1="180" y1="105" x2="130" y2="112" stroke="#263238" stroke-width="3" stroke-linecap="round"/>
    <line x1="185" y1="125" x2="132" y2="125" stroke="#263238" stroke-width="3" stroke-linecap="round"/>
    <line x1="178" y1="145" x2="128" y2="138" stroke="#263238" stroke-width="3" stroke-linecap="round"/>

    <!-- Miệng cười toe toét -->
    <path d="M 65 145 Q 110 200 155 145 Z" fill="#D32F2F" stroke="#263238" stroke-width="4"/>
    <ellipse cx="110" cy="170" rx="18" ry="10" fill="#FF8A80"/>

    <!-- Vòng cổ & chuông -->
    <rect x="50" y="190" width="120" height="18" rx="8" fill="#D32F2F" stroke="#263238" stroke-width="4"/>
    <circle cx="110" cy="212" r="18" fill="url(#bellGold2)" stroke="#263238" stroke-width="3"/>
    <circle cx="110" cy="214" r="4" fill="#3E2723"/>
  </g>

  <!-- ==================== NOBITA ĂN BÁNH MÌ CỰC SUNG SƯỚNG ==================== -->
  <g id="nobitaEating" transform="translate(430, 210)" filter="url(#comicShadow2)">
    <!-- BÓNG ĐÈN PHÁT SÁNG TRÊN ĐẦU (Ý TƯỞNG & KIẾN THỨC) -->
    <g transform="translate(100, -90)">
      <!-- Vệt hào quang bóng đèn -->
      <line x1="50" y1="0" x2="50" y2="-25" stroke="#FBC02D" stroke-width="5" stroke-linecap="round"/>
      <line x1="15" y1="15" x2="-5" y2="0" stroke="#FBC02D" stroke-width="5" stroke-linecap="round"/>
      <line x1="85" y1="15" x2="105" y2="0" stroke="#FBC02D" stroke-width="5" stroke-linecap="round"/>
      <!-- Quả bóng đèn -->
      <path d="M 30 45 C 10 25, 20 -10, 50 -10 C 80 -10, 90 25, 70 45 L 65 60 L 35 60 Z" fill="#FFEE58" stroke="#F57F17" stroke-width="4"/>
      <rect x="37" y="60" width="26" height="12" fill="#CFD8DC" stroke="#78909C" stroke-width="2"/>
      <text x="50" y="32" font-family="'Arial Black', sans-serif" font-size="26" font-weight="bold" fill="#E65100" text-anchor="middle">💡</text>
    </g>

    <!-- Thân người Nobita ngồi tựa vào bàn -->
    <path d="M 40 230 Q 120 180 200 230 L 210 370 L 30 370 Z" fill="#FBC02D" stroke="#263238" stroke-width="5"/>
    <polygon points="100,210 120,240 140,210" fill="#FFF" stroke="#263238" stroke-width="3"/>

    <!-- Hai tay Nobita cầm lát bánh mì đưa lên miệng cắn -->
    <!-- Tay trái -->
    <path d="M 30 250 Q 50 300 100 280" fill="none" stroke="#FBC02D" stroke-width="28" stroke-linecap="round"/>
    <circle cx="100" cy="275" r="18" fill="#FFE0B2" stroke="#263238" stroke-width="4"/>
    <!-- Tay phải -->
    <path d="M 210 250 Q 190 300 150 280" fill="none" stroke="#FBC02D" stroke-width="28" stroke-linecap="round"/>
    <circle cx="150" cy="275" r="18" fill="#FFE0B2" stroke="#263238" stroke-width="4"/>

    <!-- LÁT BÁNH MÌ ĐANG BỊ CẮN MỘT MIẾNG TO -->
    <g transform="translate(65, 200)">
      <!-- Vỏ bánh -->
      <path d="M 0 15 C 0 -15, 35 -20, 60 -20 C 85 -20, 120 -15, 120 15 L 115 95 C 115 105, 105 110, 95 110 L 25 110 C 15 110, 0 105, 0 95 Z" fill="#8D6E63" stroke="#3E2723" stroke-width="4"/>
      <!-- Ruột bánh -->
      <path d="M 8 18 C 8 -5, 38 -10, 60 -10 C 82 -10, 112 -5, 112 18 L 107 88 C 107 98, 98 102, 90 102 L 30 102 C 22 102, 8 98, 8 88 Z" fill="#FFF9C4" stroke="#FFA000" stroke-width="2"/>
      <!-- Vết cắn khuyết răng trên đỉnh lát bánh -->
      <path d="M 35 -12 C 45 10, 75 10, 85 -12 Z" fill="#FFE0B2"/>

      <!-- CÔNG THỨC TOÁN IN TRÊN BÁNH MÌ -->
      <text x="60" y="25" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#1565C0" text-anchor="middle">a² + b² = c²</text>
      <text x="60" y="48" font-family="'Courier New', monospace" font-size="13" font-weight="900" fill="#2E7D32" text-anchor="middle">E = mc²</text>
      <text x="60" y="70" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#C62828" text-anchor="middle">x = -b/2a</text>
      <text x="60" y="92" font-family="'Courier New', monospace" font-size="15" font-weight="900" fill="#6A1B9A" text-anchor="middle">100 ĐIỂM!</text>
    </g>

    <!-- ĐẦU NOBITA -->
    <circle cx="120" cy="140" r="70" fill="#FFE0B2" stroke="#263238" stroke-width="5"/>
    <!-- Má hồng hưng phấn -->
    <ellipse cx="65" cy="160" rx="14" ry="9" fill="#FF8A80" opacity="0.8"/>
    <ellipse cx="175" cy="160" rx="14" ry="9" fill="#FF8A80" opacity="0.8"/>

    <!-- Tóc đen Nobita -->
    <path d="M 50 130 C 40 40, 190 40, 190 130 C 165 100, 140 100, 120 115 C 100 100, 75 105, 50 130 Z" fill="#212121" stroke="#263238" stroke-width="4"/>

    <!-- KÍNH TRÒN VÀ MẮT HÌNH NGÔI SAO LẤP LÁNH (VÌ THẦN KỲ) -->
    <circle cx="90" cy="135" r="26" fill="#FFF" fill-opacity="0.9" stroke="#263238" stroke-width="4"/>
    <circle cx="150" cy="135" r="26" fill="#FFF" fill-opacity="0.9" stroke="#263238" stroke-width="4"/>
    <line x1="116" y1="135" x2="124" y2="135" stroke="#263238" stroke-width="4"/>

    <!-- Ngôi sao vàng trong mắt -->
    <!-- Mắt trái -->
    <polygon points="90,118 94,128 104,130 96,138 99,148 90,142 81,148 84,138 76,130 86,128" fill="#FBC02D" stroke="#F57F17" stroke-width="1.5"/>
    <!-- Mắt phải -->
    <polygon points="150,118 154,128 164,130 156,138 159,148 150,142 141,148 144,138 136,130 146,128" fill="#FBC02D" stroke="#F57F17" stroke-width="1.5"/>

    <!-- Miệng đang nhai phồng má ngoàm ngoàm -->
    <path d="M 95 180 Q 120 205 145 180" fill="none" stroke="#263238" stroke-width="4" stroke-linecap="round"/>
    <circle cx="92" cy="178" r="3" fill="#D84315"/> <!-- vụn bánh -->
    <circle cx="148" cy="182" r="2.5" fill="#D84315"/>
  </g>

  <!-- BIỂU TƯỢNG TRI THỨC BAY VÀO NÃO -->
  <g transform="translate(300, 150)">
    <text x="0" y="0" font-family="'Impact', Arial" font-size="26" fill="#1565C0" opacity="0.8">π = 3.14</text>
    <text x="50" y="50" font-family="'Impact', Arial" font-size="28" fill="#2E7D32" opacity="0.8">√16 = 4</text>
    <text x="-40" y="100" font-family="'Impact', Arial" font-size="30" fill="#E65100" opacity="0.8">A+ GRADE!</text>
  </g>

  <!-- ==================== BONG BÓNG THOẠI ==================== -->
  <!-- Bong bóng Nobita -->
  <g transform="translate(180, 80)" filter="url(#bubbleShadow2)">
    <path d="M 0 0 L 320 0 C 335 0, 345 10, 345 25 L 345 95 C 345 110, 335 120, 320 120 L 250 120 L 260 160 L 210 120 L 25 120 C 10 120, 0 110, 0 95 Z" fill="#FFFDE7" stroke="#FBC02D" stroke-width="4"/>
    <text x="172" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="900" fill="#E65100" text-anchor="middle">NGOÀM! NGOÀM! NGON QUÁ!</text>
    <text x="172" y="62" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle">Oa! Định lý Pytago với công thức</text>
    <text x="172" y="85" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle">tự động chui tọt vào não tớ rồi!</text>
    <text x="172" y="108" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="900" fill="#1565C0" text-anchor="middle">Kỳ này 100 điểm là cái chắc! 🤩</text>
  </g>

  <!-- Bong bóng Doraemon -->
  <g transform="translate(760, 110)" filter="url(#bubbleShadow2)">
    <path d="M 0 0 L 330 0 C 345 0, 355 10, 355 25 L 355 85 C 355 100, 345 110, 330 110 L 200 110 L 170 145 L 180 110 L 25 110 C 10 110, 0 100, 0 85 Z" fill="#E1F5FE" stroke="#0288D1" stroke-width="4"/>
    <text x="177" y="35" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="900" fill="#01579B" text-anchor="middle">Thấy bảo bối của tớ đỉnh chưa!</text>
    <text x="177" y="65" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#37474F" text-anchor="middle">Cứ ăn hết đống bánh mì này là bao đậu,</text>
    <text x="177" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32" text-anchor="middle">khỏi lo bị mẹ mắng nữa nhé!</text>
  </g>

  <!-- SFX -->
  <text x="350" y="440" font-family="'Impact', Arial, sans-serif" font-size="40" font-style="italic" fill="#FF5722" stroke="#FFF" stroke-width="2" transform="rotate(-12, 350, 440)">NGOÀM NGOÀM! 🥪</text>
  <text x="690" y="460" font-family="'Impact', Arial, sans-serif" font-size="34" font-style="italic" fill="#FBC02D" stroke="#E65100" stroke-width="1.5">TÍCH TẮC! 💡</text>
</svg>
