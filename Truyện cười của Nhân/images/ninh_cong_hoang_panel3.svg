<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Horror Lighting & Realistic Anatomy Gradients -->
    <radialGradient id="terrorRedBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="45%" stop-color="#450A0A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Shocked Human Face Skin Gradients -->
    <linearGradient id="skinShocked" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#FCD34D"/>
      <stop offset="65%" stop-color="#F59E0B"/>
      <stop offset="90%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Flying Cockroach Wing Gradient -->
    <linearGradient id="membranousWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#D97706" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#78350F" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#2D0606" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="horrorShadowReal" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- BACKGROUND: ĐỎ RỰC KINH HOÀNG -->
  <rect x="0" y="0" width="1200" height="800" fill="url(#terrorRedBg)"/>

  <!-- TIA TỐC ĐỘ GÓC RỘNG LAO THẲNG MẮT -->
  <g stroke="#EF4444" stroke-width="2" opacity="0.45">
    <line x1="450" y1="350" x2="0" y2="0"/>
    <line x1="450" y1="350" x2="250" y2="0"/>
    <line x1="450" y1="350" x2="600" y2="0"/>
    <line x1="450" y1="350" x2="1200" y2="0"/>
    <line x1="450" y1="350" x2="1200" y2="350"/>
    <line x1="450" y1="350" x2="1200" y2="800"/>
    <line x1="450" y1="350" x2="0" y2="800"/>
    <line x1="450" y1="350" x2="0" y2="350"/>
  </g>

  <!-- TIÊU ĐỀ KHUNG TRUYỆN -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="580" height="46" rx="10" fill="#DC2626" stroke="#FCA5A5" stroke-width="3" filter="url(#horrorShadowReal)"/>
    <text x="290" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="900" fill="#FFF" text-anchor="middle" letter-spacing="1">KHUNG 3: ÁC MỘNG CON GIÁN BIẾT BAY!</text>
  </g>

  <!-- ==================== NINH CÔNG HOÀNG NGÃ NGỬA HOẢNG LOẠN (ANATOMY THẬT) ==================== -->
  <g id="ninhShockedReal" transform="translate(620, 150)" filter="url(#horrorShadowReal)">
    
    <!-- CƠ THỂ BẬT NGỬA VÌ PHẢN XẠ PHÒNG VỆ -->
    <path d="M 60 380 L 100 250 Q 230 220 340 270 L 330 420 L 370 650 L 30 650 Z" fill="#1E293B" stroke="#0F172A" stroke-width="3" transform="rotate(22, 200, 420)"/>

    <!-- TAY TRÁI GIƠ LÊN CHẮN TRƯỚC MẶT VỚI BÀN TAY XÒE NGÓN TỰ NHIÊN -->
    <g transform="translate(40, 160)">
      <!-- Cẳng tay căng cứng cơ bắp -->
      <path d="M 50 140 Q 15 80 -10 10" fill="none" stroke="#D97706" stroke-width="32" stroke-linecap="round"/>
      <!-- Lòng bàn tay người thật -->
      <path d="M -30 10 Q -5 25 15 5 Q 20 -20 -15 -15 Z" fill="#FCD34D" stroke="#92400E" stroke-width="2"/>
      <!-- 5 ngón tay xòe hoảng hốt có khớp đốt và móng tay -->
      <!-- Ngón cái -->
      <path d="M -20 -5 L -45 -18 Q -50 -10 -40 2 L -20 5 Z" fill="#FCD34D" stroke="#92400E" stroke-width="1.5"/>
      <!-- Ngón trỏ -->
      <path d="M -15 -15 L -25 -55 Q -15 -60 -5 -50 L -2 -15 Z" fill="#FCD34D" stroke="#92400E" stroke-width="1.5"/>
      <circle cx="-15" cy="-52" r="2.5" fill="#FEF3C7"/>
      <!-- Ngón giữa -->
      <path d="M -2 -15 L 12 -60 Q 22 -62 25 -50 L 10 -15 Z" fill="#FCD34D" stroke="#92400E" stroke-width="1.5"/>
      <circle cx="18" cy="-56" r="2.5" fill="#FEF3C7"/>
      <!-- Ngón áp út -->
      <path d="M 10 -10 L 32 -48 Q 42 -48 40 -38 L 18 -8 Z" fill="#FCD34D" stroke="#92400E" stroke-width="1.5"/>
      <!-- Ngón út -->
      <path d="M 18 -5 L 45 -30 Q 52 -28 48 -18 L 22 -2 Z" fill="#FCD34D" stroke="#92400E" stroke-width="1.5"/>
    </g>

    <!-- TAY PHẢI VUNG MẠNH ĐÁNH RƠI CÂY DÉP -->
    <g transform="translate(320, 210)">
      <path d="M 10 100 Q 60 40 100 -20" fill="none" stroke="#D97706" stroke-width="32" stroke-linecap="round"/>
      <!-- Bàn tay buông lỏng ngón tay đang mở tung -->
      <ellipse cx="105" cy="-25" rx="16" ry="12" fill="#FCD34D" stroke="#92400E" stroke-width="2"/>
    </g>

    <!-- CÂY DÉP TỔ ONG VĂNG XOAY TÍT TRÊN KHÔNG TRUNG -->
    <g transform="translate(230, -50) rotate(-55)" filter="url(#horrorShadowReal)">
      <path d="M 10 0 C 0 -35, 60 -35, 50 0 L 60 150 C 60 175, 10 175, 10 150 Z" fill="#FDE047" stroke="#854D0E" stroke-width="3"/>
      <rect x="5" y="30" width="50" height="60" rx="6" fill="#FEF08A" stroke="#CA8A04" stroke-width="2"/>
      <text x="30" y="130" font-family="'Impact', Arial" font-size="12" fill="#78350F" text-anchor="middle">VĂNG DÉP!</text>
    </g>

    <!-- ==================== GƯƠNG MẶT SỢ HÃI TỘT ĐỘ (CHÂN THỰC TỪNG CHI TIẾT) ==================== -->
    <g transform="translate(130, 70)">
      <!-- Khuôn mặt ngửa ra sau -->
      <path d="M 35 110 C 35 30, 205 30, 205 110 C 205 180, 175 235, 120 245 C 65 235, 35 180, 35 110 Z" fill="url(#skinShocked)" stroke="#7C4124" stroke-width="3"/>

      <!-- Tóc bay ngược về sau vì gió và chuyển động ngã -->
      <path d="M 30 95 C 15 -10, 215 -10, 210 95 C 180 50, 150 55, 120 70 C 90 50, 60 55, 30 95 Z" fill="#0F172A" stroke="#020617" stroke-width="3"/>

      <!-- MẮT TRỢN TRỪNG LÒNG TRẮNG DÃ KINH HOÀNG -->
      <!-- Mắt trái -->
      <g transform="translate(60, 95)">
        <ellipse cx="20" cy="15" rx="20" ry="18" fill="#FFF" stroke="#000" stroke-width="2"/>
        <circle cx="20" cy="15" r="5" fill="#170B04"/> <!-- Đồng tử co rúm bé tí vì shock -->
        <circle cx="19" cy="14" r="1.5" fill="#FFF"/>
        <!-- Lông mày nhếch ngược lên trán -->
        <path d="M -5 -8 L 35 5" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>
      </g>

      <!-- Mắt phải -->
      <g transform="translate(125, 95)">
        <ellipse cx="20" cy="15" rx="20" ry="18" fill="#FFF" stroke="#000" stroke-width="2"/>
        <circle cx="20" cy="15" r="5" fill="#170B04"/>
        <circle cx="19" cy="14" r="1.5" fill="#FFF"/>
        <path d="M 45 -8 L 5 5" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>
      </g>

      <!-- Sống mũi hếch lên theo góc đầu -->
      <path d="M 120 100 L 115 140 L 126 142" fill="none" stroke="#7C4124" stroke-width="3" stroke-linecap="round"/>

      <!-- ==================== KHẨU HÌNH HÉT TOÁNG (CÓ RĂNG, LƯỠI & VÒM HỌNG) ==================== -->
      <g transform="translate(85, 150)">
        <!-- Miệng mở to ngoác hình bầu dục -->
        <ellipse cx="35" cy="35" rx="36" ry="42" fill="#450A0A" stroke="#000" stroke-width="3"/>
        <!-- Vòm họng sâu tối -->
        <ellipse cx="35" cy="40" rx="28" ry="30" fill="#170303"/>
        <!-- Hàm răng trên chân thực -->
        <path d="M 12 18 Q 35 12 58 18 L 54 26 Q 35 22 16 26 Z" fill="#FFF" stroke="#E2E8F0" stroke-width="1"/>
        <!-- Hàm răng dưới -->
        <path d="M 15 54 Q 35 60 55 54 L 52 48 Q 35 52 18 48 Z" fill="#FFF" stroke="#E2E8F0" stroke-width="1"/>
        <!-- Lưỡi co rút vì hét -->
        <path d="M 22 52 Q 35 38 48 52 Z" fill="#F43F5E"/>
      </g>

      <!-- NƯỚC MẮT & MỒ HÔI BẮN RA HAI BÊN -->
      <path d="M 50 105 Q 10 95 -15 110" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
      <path d="M 175 105 Q 215 95 240 110" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-18" cy="110" r="6" fill="#0284C7"/>
      <circle cx="242" cy="110" r="6" fill="#0284C7"/>
    </g>
  </g>

  <!-- ==================== CON GIÁN KHỔNG LỒ XÒE CÁNH BAY CỰC THỰC ==================== -->
  <g id="flyingRoachRealistic" transform="translate(180, 200)" filter="url(#horrorShadowReal)">
    
    <!-- ĐÔI CÁNH CỨNG (ELYTRA) MỞ RA HÌNH CHỮ V -->
    <!-- Cánh cứng bên trái -->
    <path d="M 115 110 C 60 0, -20 40, 10 130 Z" fill="#450A0A" stroke="#170303" stroke-width="3"/>
    <!-- Cánh cứng bên phải -->
    <path d="M 145 110 C 200 0, 280 40, 250 130 Z" fill="#450A0A" stroke="#170303" stroke-width="3"/>

    <!-- ĐÔI CÁNH MÀNG BAY (HINDWINGS) TRONG SUỐT ĐẬP TÍT MÙ -->
    <path d="M 120 120 C 50 -60, -70 20, 20 160 Z" fill="url(#membranousWing)" stroke="#78350F" stroke-width="2"/>
    <path d="M 140 120 C 210 -60, 330 20, 240 160 Z" fill="url(#membranousWing)" stroke="#78350F" stroke-width="2"/>
    <!-- Đường gân cánh tự nhiên của loài gián -->
    <path d="M 120 120 Q 30 40 -10 30" fill="none" stroke="#78350F" stroke-width="1.5" opacity="0.7"/>
    <path d="M 140 120 Q 230 40 270 30" fill="none" stroke="#78350F" stroke-width="1.5" opacity="0.7"/>

    <!-- THÂN GIÁN CẬN CẢNH PHÓNG ĐẠI CHÂN THỰC -->
    <ellipse cx="130" cy="130" rx="42" ry="75" fill="#2D0606" stroke="#0F0202" stroke-width="4"/>
    <!-- Các đốt bụng gián (Tergites) -->
    <line x1="95" y1="120" x2="165" y2="120" stroke="#7F1D1D" stroke-width="2.5"/>
    <line x1="98" y1="140" x2="162" y2="140" stroke="#7F1D1D" stroke-width="2.5"/>
    <line x1="102" y1="160" x2="158" y2="160" stroke="#7F1D1D" stroke-width="2.5"/>

    <!-- Đầu gián và mắt kép đỏ sắc lạnh -->
    <ellipse cx="130" cy="45" rx="24" ry="18" fill="#170303"/>
    <circle cx="118" cy="42" r="6.5" fill="#EF4444"/>
    <circle cx="142" cy="42" r="6.5" fill="#EF4444"/>

    <!-- Râu gián dài ngoằn quất mạnh trong gió -->
    <path d="M 118 35 Q 50 -50 -30 -30" fill="none" stroke="#7F1D1D" stroke-width="4" stroke-linecap="round"/>
    <path d="M 142 35 Q 210 -50 290 -30" fill="none" stroke="#7F1D1D" stroke-width="4" stroke-linecap="round"/>

    <!-- 6 Chân gai nhọn hoắt buông thõng giữa không trung -->
    <path d="M 95 90 L 40 70 L 10 110" fill="none" stroke="#170303" stroke-width="5" stroke-linecap="round"/>
    <path d="M 165 90 L 220 70 L 250 110" fill="none" stroke="#170303" stroke-width="5" stroke-linecap="round"/>
    <path d="M 100 150 L 50 180 L 20 230" fill="none" stroke="#170303" stroke-width="5" stroke-linecap="round"/>
    <path d="M 160 150 L 210 180 L 240 230" fill="none" stroke="#170303" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- ==================== BONG BÓNG GÀO THÉT KINH HOÀNG ==================== -->
  <g transform="translate(380, 560)" filter="url(#horrorShadowReal)">
    <path d="M 0 0 L 760 0 C 775 0, 785 10, 785 25 L 785 145 C 785 160, 775 170, 760 170 L 450 170 L 420 205 L 430 170 L 25 170 C 10 170, 0 160, 0 145 Z" fill="#450A0A" stroke="#EF4444" stroke-width="5"/>
    <text x="392" y="44" font-family="'Impact', Arial Black, sans-serif" font-size="28" font-weight="900" fill="#FCA5A5" text-anchor="middle">Á Á Á Á Á! NÓ BIẾT BAYYYYYYY! 😱🪳💨</text>
    <text x="392" y="82" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFF" text-anchor="middle">"MỌI GIÁO TRÌNH HỦY BỎ! TẤT CẢ LÝ THUYẾT LÀ CÚ LỪA!"</text>
    <text x="392" y="112" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#FDE047" text-anchor="middle">Ối mẹ ơi nó nhắm thẳng mặt con mà phóng kìa!!</text>
    <text x="392" y="144" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="900" fill="#EF4444" text-anchor="middle">CHẠY NGAY ĐI TRƯỚC KHI QUÁ MUỘN!! 🏃‍♂️💨💥</text>
  </g>

  <!-- SFX -->
  <text x="60" y="470" font-family="'Impact', Arial" font-size="52" font-style="italic" fill="#FBBF24" stroke="#7F1D1D" stroke-width="2" transform="rotate(-15, 60, 470)">ÈN ÈNNNNN! 🪳💥</text>
  <text x="860" y="120" font-family="'Impact', Arial" font-size="44" font-style="italic" fill="#EF4444" stroke="#FFF" stroke-width="2">TOANG RỒI! 💀</text>
</svg>
