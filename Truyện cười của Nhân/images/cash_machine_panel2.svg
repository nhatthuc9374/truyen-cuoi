<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Desert Coast Surreal Lighting -->
    <linearGradient id="desertCoast" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="40%" stop-color="#EA580C"/>
      <stop offset="80%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <!-- The Yellow Blob Suit Material -->
    <linearGradient id="yellowBlobMat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#FACC15"/>
      <stop offset="70%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>

    <!-- Water in Bucket Pants -->
    <radialGradient id="sloshingWater" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.9"/>
    </radialGradient>

    <filter id="chaseShadow2" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="6" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- BACKGROUND: BỜ BIỂN CÁT VÀNG SIÊU THỰC -->
  <rect x="0" y="0" width="1200" height="520" fill="url(#desertCoast)"/>
  <rect x="0" y="500" width="1200" height="300" fill="#78350F"/>
  <line x1="0" y1="500" x2="1200" y2="500" stroke="#451A03" stroke-width="6"/>

  <!-- TIÊU ĐỀ KHUNG TRUYỆN -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="620" height="46" rx="10" fill="#EAB308" stroke="#FEF08A" stroke-width="3" filter="url(#chaseShadow2)"/>
    <text x="310" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="900" fill="#000" text-anchor="middle" letter-spacing="1">KHUNG 2: QUÁI NHÂN VÀNG & CHIẾC QUẦN NƯỚC!</text>
  </g>

  <!-- ==================== QUÁI NHÂN ÁO VÀNG METATECH PHÌNH TO BỌT KHÍ ĐANG ĐUỔI THEO ==================== -->
  <g id="yellowBlob" transform="translate(140, 160)" filter="url(#chaseShadow2)">
    <!-- Thân hình khổng lồ phồng to như quả bóng bơm đầy xốp bong bóng (Bubble Wrap) -->
    <path d="M 60 420 Q 0 260 90 140 Q 240 60 360 140 Q 440 260 380 420 Z" fill="url(#yellowBlobMat)" stroke="#854D0E" stroke-width="5"/>
    
    <!-- Các múi bọc xốp phồng rộp kỳ quái -->
    <circle cx="160" cy="200" r="45" fill="#FEF08A" opacity="0.6"/>
    <circle cx="280" cy="220" r="50" fill="#FEF08A" opacity="0.6"/>
    <circle cx="210" cy="310" r="60" fill="#FEF08A" opacity="0.6"/>
    
    <!-- Đầu quái nhân trùm kín mặt bằng vải vàng bí ẩn -->
    <circle cx="220" cy="110" r="55" fill="url(#yellowBlobMat)" stroke="#78350F" stroke-width="3"/>
    <!-- Logo bí ẩn Metatech trên trán -->
    <circle cx="220" cy="80" r="14" fill="#000"/>
    <text x="220" y="86" font-family="'Impact', Arial" font-size="16" fill="#FACC15" text-anchor="middle">M</text>

    <!-- Hai cánh tay vàng khổng lồ vươn ra chụp bắt -->
    <path d="M 340 220 Q 450 180 520 220" fill="none" stroke="url(#yellowBlobMat)" stroke-width="38" stroke-linecap="round"/>
    <path d="M 80 220 Q -20 260 20 340" fill="none" stroke="url(#yellowBlobMat)" stroke-width="38" stroke-linecap="round"/>

    <!-- Đôi chân ngắn cũn chạy huỳnh huỵch -->
    <rect x="140" y="420" width="45" height="120" rx="20" fill="#CA8A04" stroke="#78350F" stroke-width="3"/>
    <rect x="260" y="420" width="45" height="120" rx="20" fill="#CA8A04" stroke="#78350F" stroke-width="3"/>
    <text x="220" y="480" font-family="'Impact', Arial" font-size="18" fill="#FFF" text-anchor="middle">METATECH AGENT ⚠️</text>
  </g>

  <!-- ==================== OLIVER TREE MẶC CHIẾC QUẦN KHỔNG LỒ CHỨA ĐẦY NƯỚC CHẠY TRỐN ==================== -->
  <g id="oliverWaterPants" transform="translate(620, 120)" filter="url(#chaseShadow2)">
    
    <!-- Áo khoác gió retro 90s quen thuộc -->
    <path d="M 60 320 L 90 190 Q 180 170 270 190 L 290 320 Z" fill="#2DD4BF" stroke="#0F172A" stroke-width="3"/>
    <polygon points="130,190 180,280 230,190" fill="#EC4899"/>

    <!-- ==================== CHIẾC QUẦN BÒ KHỔNG LỒ PHÌNH TO CHỨA NƯỚC (BUCKET PANTS) ==================== -->
    <g transform="translate(20, 290)">
      <!-- Ống quần jean xanh phình to như hai cái xô nước khổng lồ -->
      <path d="M 40 30 C -60 120, -40 260, 40 310 L 140 310 C 180 240, 160 120, 130 30 Z" fill="#1D4ED8" stroke="#1E3A8A" stroke-width="4"/>
      <path d="M 170 30 C 140 120, 160 240, 200 310 L 300 310 C 380 260, 400 120, 260 30 Z" fill="#1D4ED8" stroke="#1E3A8A" stroke-width="4"/>
      
      <!-- NƯỚC XANH TRONG SUỐT BÊN TRONG ỐNG QUẦN ĐANG SÓNG SÁNH TRÀO RA NGOÀI -->
      <ellipse cx="60" cy="180" rx="60" ry="80" fill="url(#sloshingWater)" opacity="0.8"/>
      <ellipse cx="280" cy="180" rx="60" ry="80" fill="url(#sloshingWater)" opacity="0.8"/>
      
      <!-- Bọt nước và tia nước bắn tung tóe khi chạy -->
      <path d="M -20 180 Q -60 150 -80 190" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
      <circle cx="-85" cy="190" r="8" fill="#0284C7"/>
      <path d="M 360 180 Q 400 150 420 190" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
      <circle cx="425" cy="190" r="8" fill="#0284C7"/>

      <!-- Đôi giày đỏ của Oliver thò ra dưới đáy ống quần -->
      <ellipse cx="90" cy="320" rx="35" ry="16" fill="#DC2626" stroke="#991B1B" stroke-width="2"/>
      <ellipse cx="250" cy="320" rx="35" ry="16" fill="#DC2626" stroke="#991B1B" stroke-width="2"/>
    </g>

    <!-- HAI TAY QUỜ QUẠNG KHI CHẠY TRỐN -->
    <path d="M 70 220 Q 0 160 -30 140" fill="none" stroke="#FED7AA" stroke-width="22" stroke-linecap="round"/>
    <path d="M 280 220 Q 360 180 400 150" fill="none" stroke="#FED7AA" stroke-width="22" stroke-linecap="round"/>

    <!-- ĐẦU BÁT ÚP VÀ KÍNH RÂM ĐỎ HỐT HOẢNG -->
    <circle cx="180" cy="95" r="48" fill="#FED7AA" stroke="#9A3412" stroke-width="2"/>
    <!-- Tóc bát úp đen cắt bằng tưng -->
    <path d="M 130 90 C 120 0, 240 0, 230 90 Z" fill="#0A0A0A"/>
    <line x1="130" y1="90" x2="230" y2="90" stroke="#000" stroke-width="4"/>

    <!-- Kính râm đỏ mắt ruồi -->
    <ellipse cx="160" cy="95" rx="18" ry="12" fill="#DC2626" stroke="#000" stroke-width="2"/>
    <ellipse cx="200" cy="95" rx="18" ry="12" fill="#DC2626" stroke="#000" stroke-width="2"/>

    <!-- Miệng há to ngoác la hét thất thanh khi chiếc quần nặng trĩu nước -->
    <ellipse cx="180" cy="125" rx="20" ry="16" fill="#7F1D1D" stroke="#000" stroke-width="2"/>
    <path d="M 165 120 Q 180 115 195 120" fill="#FFF"/>
  </g>

  <!-- ==================== LỜI THOẠI HỖN LOẠN SIÊU THỰC ==================== -->
  <g transform="translate(180, 580)" filter="url(#chaseShadow2)">
    <path d="M 0 0 L 820 0 C 835 0, 845 10, 845 25 L 845 145 C 845 160, 835 170, 820 170 L 640 170 L 610 205 L 620 170 L 25 170 C 10 170, 0 160, 0 145 Z" fill="#0F172A" stroke="#EAB308" stroke-width="3"/>
    <text x="422" y="38" font-family="'Impact', Arial, sans-serif" font-size="22" font-weight="900" fill="#FDE047" text-anchor="middle">👖 OLIVER TREE (CHẠY TRỐN TRONG CHIẾC QUẦN NƯỚC):</text>
    <text x="422" y="72" font-family="'Segoe UI', Arial, sans-serif" font-size="16.5" font-weight="900" fill="#38BDF8" text-anchor="middle">"CÁI QUÁI GÌ THẾ NÀY?! SAO CHIẾC QUẦN JEANS CỦA TÔI LẠI ĐẦY NƯỚC THẾ NÀY?!" 🌊</text>
    <text x="422" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#F1F5F9" text-anchor="middle">Quái nhân áo vàng Metatech phình to bọt khí đang đuổi sát nút phía sau!</text>
    <text x="422" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="900" fill="#EF4444" text-anchor="middle">Mỗi bước chạy là nước bắn tung tóe bõm bõm: 'Đừng hòng cướp chiếc máy in tiền của ta!' 🏃‍♂️💨</text>
  </g>

  <!-- SFX -->
  <text x="860" y="380" font-family="'Impact', Arial" font-size="44" font-style="italic" fill="#38BDF8" stroke="#0F172A" stroke-width="2">BÕM BÕM! 🌊</text>
</svg>
