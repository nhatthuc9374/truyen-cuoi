<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Golden Money Aura & ATM Glow -->
    <radialGradient id="cashGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#86EFAC" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#0F172A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Metallic ATM Machine Gradient -->
    <linearGradient id="atmMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Cash Bill Green -->
    <linearGradient id="dollarBill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BBF7D0"/>
      <stop offset="50%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>

    <filter id="cashShadow4" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="6" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- BACKGROUND: KHÔNG GIAN BỪNG SÁNG CƠN MƯA TIỀN VÔ TẬN -->
  <rect x="0" y="0" width="1200" height="800" fill="url(#cashGlow)"/>

  <!-- ==================== CÂY MÁY RÚT TIỀN ATM KHỔNG LỒ PHUN TIỀN XỐI XẢ ==================== -->
  <g transform="translate(680, 80)" filter="url(#cashShadow4)">
    <!-- Thân máy ATM khổng lồ -->
    <rect x="0" y="0" width="420" height="580" rx="14" fill="url(#atmMetal)" stroke="#94A3B8" stroke-width="5"/>
    
    <!-- Màn hình điện tử phát sáng xanh neon -->
    <rect x="40" y="40" width="340" height="180" rx="8" fill="#022C22" stroke="#10B981" stroke-width="4"/>
    <text x="210" y="95" font-family="'Courier New', monospace" font-size="24" font-weight="900" fill="#34D399" text-anchor="middle">METATECH ATM $ $ $</text>
    <text x="210" y="140" font-family="'Impact', Arial" font-size="34" fill="#FEF08A" text-anchor="middle">CASH DISPENSED!</text>
    <text x="210" y="180" font-family="'Courier New', monospace" font-size="20" fill="#F87171" text-anchor="middle">BALANCE: $99,999,999</text>

    <!-- KHE PHUN TIỀN ĐANG BẮN TIỀN NHƯ NÚI LỬA PHUN TRÀO -->
    <rect x="80" y="260" width="260" height="35" rx="6" fill="#000" stroke="#EF4444" stroke-width="3"/>
    
    <!-- CƠN LỐC TIỀN ĐÔ LA BAY NGẬP TRỜI -->
    <g transform="translate(80, 260)">
      <rect x="-40" y="-80" width="65" height="36" rx="3" fill="url(#dollarBill)" stroke="#15803D" stroke-width="1.5" transform="rotate(-30)"/>
      <rect x="60" y="-110" width="65" height="36" rx="3" fill="url(#dollarBill)" stroke="#15803D" stroke-width="1.5" transform="rotate(15)"/>
      <rect x="160" y="-70" width="65" height="36" rx="3" fill="url(#dollarBill)" stroke="#15803D" stroke-width="1.5" transform="rotate(45)"/>
      <rect x="230" y="-120" width="65" height="36" rx="3" fill="url(#dollarBill)" stroke="#15803D" stroke-width="1.5" transform="rotate(-15)"/>
      <rect x="0" y="60" width="70" height="38" rx="3" fill="url(#dollarBill)" stroke="#15803D" stroke-width="1.5" transform="rotate(25)"/>
      <rect x="120" y="50" width="70" height="38" rx="3" fill="url(#dollarBill)" stroke="#15803D" stroke-width="1.5" transform="rotate(-20)"/>
    </g>
  </g>

  <!-- ==================== CHIẾC XE SCOOTER ĐỎ NẰM GÃY BÊN CẠNH ==================== -->
  <g transform="translate(100, 480)" filter="url(#cashShadow4)">
    <!-- Cần xe scooter đỏ nằm nghiêng -->
    <line x1="0" y1="40" x2="160" y2="10" stroke="#DC2626" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="10" x2="0" y2="70" stroke="#000" stroke-width="8" stroke-linecap="round"/>
    <!-- Bánh xe nhỏ -->
    <circle cx="160" cy="10" r="14" fill="#1C1917" stroke="#71717A" stroke-width="3"/>
    <circle cx="20" cy="40" r="14" fill="#1C1917" stroke="#71717A" stroke-width="3"/>
    <text x="70" y="-10" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#FEF08A">CÚ NGÃ SCOOTER 🛴💥</text>
  </g>

  <!-- TIÊU ĐỀ KHUNG TRUYỆN -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="640" height="46" rx="10" fill="#15803D" stroke="#4ADE80" stroke-width="3" filter="url(#cashShadow4)"/>
    <text x="320" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="900" fill="#FFF" text-anchor="middle" letter-spacing="1">KHUNG 4: CÂY ATM TIỀN & CÚ CHỐT NGẠO NGHỄ!</text>
  </g>

  <!-- ==================== OLIVER TREE NẰM NGỬA TRÊN ĐỐNG TIỀN CƯỜI NGẠO NGHỄ ==================== -->
  <g id="oliverOnCashPile" transform="translate(240, 220)" filter="url(#cashShadow4)">
    
    <!-- ĐỐNG TIỀN ĐÔ LA CHẤT ĐẦY CAO NHƯ NÚI DƯỚI LƯNG -->
    <ellipse cx="220" cy="360" rx="260" ry="80" fill="#22C55E" stroke="#15803D" stroke-width="4"/>
    <ellipse cx="220" cy="350" rx="240" ry="70" fill="#86EFAC"/>
    
    <!-- Thân người nằm nghiêng thư thái trên đống tiền -->
    <path d="M 60 280 L 140 180 Q 240 160 320 220 L 360 320 Z" fill="#2DD4BF" stroke="#0F172A" stroke-width="3"/>
    <polygon points="170,180 230,260 280,180" fill="#EC4899"/>

    <!-- TAY PHẢI CẦM XẤP TIỀN ĐÔ LA TUNG LÊN TRỜI -->
    <g transform="translate(280, 150)">
      <path d="M 20 60 Q 60 10 90 -20" fill="none" stroke="#FED7AA" stroke-width="22" stroke-linecap="round"/>
      <circle cx="90" cy="-20" r="12" fill="#FDBA74" stroke="#9A3412" stroke-width="1.5"/>
      <!-- Xấp tiền vung lên -->
      <rect x="70" y="-45" width="45" height="25" rx="3" fill="#4ADE80" stroke="#15803D" stroke-width="2" transform="rotate(-15)"/>
    </g>

    <!-- TAY TRÁI GỐI ĐẦU NẰM THẢNH THƠI -->
    <path d="M 120 200 Q 80 140 120 100" fill="none" stroke="#FED7AA" stroke-width="20" stroke-linecap="round"/>

    <!-- GƯƠNG MẶT THƯƠNG HIỆU: ĐẦU BÁT ÚP, KÍNH RÂM LỆCH, NỤ CƯỜI CHÂM BIẾM -->
    <circle cx="170" cy="110" r="48" fill="#FED7AA" stroke="#9A3412" stroke-width="2"/>
    <path d="M 125 105 C 115 15, 230 15, 220 105 Z" fill="#0A0A0A"/>
    <line x1="125" y1="105" x2="220" y2="105" stroke="#000" stroke-width="4"/>

    <!-- Kính râm đỏ hơi xếch lên khoe ánh mắt sắc sảo -->
    <g transform="translate(135, 95) rotate(-8)">
      <ellipse cx="20" cy="15" rx="18" ry="12" fill="#DC2626" stroke="#000" stroke-width="2"/>
      <ellipse cx="55" cy="15" rx="18" ry="12" fill="#DC2626" stroke="#000" stroke-width="2"/>
      <line x1="38" y1="15" x2="43" y2="15" stroke="#000" stroke-width="2"/>
      <circle cx="16" cy="14" r="3" fill="#FFF"/> <!-- ánh mắt nhìn người xem -->
    </g>

    <!-- Nụ cười nhăn nhở quen thuộc châm biếm sâu sắc -->
    <g transform="translate(150, 135)">
      <ellipse cx="25" cy="12" rx="22" ry="12" fill="#7F1D1D" stroke="#000" stroke-width="1.5"/>
      <path d="M 10 8 Q 25 5 40 8" stroke="#FFF" stroke-width="3"/>
    </g>
  </g>

  <!-- ==================== LỜI KẾT SÂU SẮC CỦA "CASH MACHINE" ==================== -->
  <g transform="translate(180, 580)" filter="url(#cashShadow4)">
    <path d="M 0 0 L 820 0 C 835 0, 845 10, 845 25 L 845 145 C 845 160, 835 170, 820 170 L 480 170 L 450 205 L 460 170 L 25 170 C 10 170, 0 160, 0 145 Z" fill="#0F172A" stroke="#22C55E" stroke-width="3"/>
    <text x="422" y="38" font-family="'Impact', Arial, sans-serif" font-size="22" font-weight="900" fill="#4ADE80" text-anchor="middle">🏧 THÔNG ĐIỆP BẤT HỦ CỦA BÀI HÁT "CASH MACHINE":</text>
    <text x="422" y="72" font-family="'Segoe UI', Arial, sans-serif" font-size="16.5" font-weight="900" fill="#FEF08A" text-anchor="middle">"YOU'RE SPENDING LIKE A CASH MACHINE, CAN'T FILL THAT HOLE INSIDE!" 💵💔</text>
    <text x="422" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#F1F5F9" text-anchor="middle">Cây ATM có thể in ra hàng núi tiền, xe limousine hồng có thể bóng bẩy lộng lẫy...</text>
    <text x="422" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="900" fill="#38BDF8" text-anchor="middle">Nhưng vật chất không bao giờ lấp đầy được sự cô đơn hay mua được linh hồn tự do! 😎✨</text>
  </g>

  <!-- SFX -->
  <text x="780" y="420" font-family="'Impact', Arial" font-size="44" font-style="italic" fill="#FEF08A" stroke="#15803D" stroke-width="2">MƯA TIỀN ĐÔ LA! 💸✨</text>
</svg>
