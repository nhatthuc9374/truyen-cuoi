    <!-- Header & Footer -->
    <rect x="15" y="12" width="310" height="28" rx="6" fill="#1E293B"/>
    <text x="170" y="31" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#EF4444" text-anchor="middle">★ CẢNH 4: HẠ SINH HAI BÉ MỈM MỈN</text>
    <rect x="20" y="390" width="600" height="26" rx="6" fill="#0F172A" opacity="0.9"/>
    <text x="320" y="408" font-family="'Segoe UI', sans-serif" font-size="12" fill="#F8FAFC" text-anchor="middle">Sau bao đau đớn gồng mình rặn, hạnh phúc vỡ òa khi dì hạ sinh hai thiên thần sinh đôi tròn trịa mỉm mỉn...</text>
