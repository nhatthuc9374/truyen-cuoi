        <ellipse cx="16" cy="34" rx="4.5" ry="3" fill="#FDA4AF"/><ellipse cx="40" cy="34" rx="4.5" ry="3" fill="#FDA4AF"/>
        <path d="M20 28 Q24 24 28 28" stroke="#1E293B" stroke-width="2" fill="none"/>
        <path d="M30 28 Q34 24 38 28" stroke="#1E293B" stroke-width="2" fill="none"/>
        <text x="28" y="75" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="900" fill="#0369A1" text-anchor="middle">BÉ AN (MỈM MỈN)</text>
