      <text x="475" y="34" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="900" fill="#D97706" text-anchor="middle">🎉 CHÁU REO HÒ MỪNG RỠ:</text>
      <text x="475" y="52" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#DC2626" text-anchor="middle">"OA OA! HAI BÉ MỈM MỈN LUÔN!"</text>
      <text x="475" y="66" font-family="'Segoe UI', sans-serif" font-size="10" fill="#15803D" text-anchor="middle">Má phúng phính trắng hồng cưng xỉu dì ơi! 👶👶</text>
