  </g>

  <!-- ==================== PANEL 2: KHÁM THÌ DÌ SẮP ĐẺ ==================== -->
  <g transform="translate(680, 75) scale(0.97)">
    <rect width="640" height="425" rx="12" fill="url(#p2AlertBgFull)" stroke="#1E293B" stroke-width="3"/>

