      <rect x="46" y="36" width="10" height="8" rx="1.5" fill="none" stroke="#0284C7" stroke-width="1.5"/>
      <rect x="64" y="36" width="10" height="8" rx="1.5" fill="none" stroke="#0284C7" stroke-width="1.5"/>
      <ellipse cx="60" cy="52" rx="7" ry="8" fill="#B91C1C"/>
    </g>

