      <path d="M30 90 Q30 65 100 65 L220 65 Q250 65 250 90 Q250 118 200 118 L160 118 L145 145 L145 118 L70 118 Q30 118 30 90 Z" fill="#F0F9FF" stroke="#0284C7" stroke-width="2.5"/>
      <text x="140" y="86" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#0369A1" text-anchor="middle">"Dì ơi cẩn thận nha!</text>
