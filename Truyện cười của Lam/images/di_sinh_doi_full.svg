      <text x="290" y="58" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#991B1B" text-anchor="middle">"ĐAU QUÁ TRỜI ƠI! RẶN ĐỨT CẢ RUỘT NÈ...!"</text>
    </g>

    <!-- Header & Footer -->
    <rect x="15" y="12" width="310" height="28" rx="6" fill="#1E293B"/>
    <text x="170" y="31" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#FDE047" text-anchor="middle">★ CẢNH 3: BÉ CHƯA CHỊU RA, DÌ RẶN ĐAU</text>
