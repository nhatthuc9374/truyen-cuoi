        <circle cx="28" cy="30" r="18" fill="#FFEDD5" stroke="#1E293B" stroke-width="1.8"/>
        <ellipse cx="16" cy="34" rx="4.5" ry="3" fill="#FDA4AF"/><ellipse cx="40" cy="34" rx="4.5" ry="3" fill="#FDA4AF"/>
        <circle cx="22" cy="28" r="2" fill="#1E293B"/><circle cx="34" cy="28" r="2" fill="#1E293B"/>
