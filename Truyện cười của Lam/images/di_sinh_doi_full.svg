      <text x="280" y="44" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#991B1B" text-anchor="middle">"ĐAU QUÁ! HÌNH NHƯ TÔI SẮP ĐẺ RỒI! 💥"</text>
