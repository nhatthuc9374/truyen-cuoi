      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#FB7185"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="p1HospBgFull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/><stop offset="65%" stop-color="#BAE6FD"/><stop offset="65%" stop-color="#E2E8F0"/><stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="p2AlertBgFull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2"/><stop offset="65%" stop-color="#FEE2E2"/><stop offset="65%" stop-color="#CBD5E1"/><stop offset="100%" stop-color="#94A3B8"/>
