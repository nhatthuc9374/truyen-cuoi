  <!-- ==================== PANEL 3: BÉ CHƯA CHỊU RA, DÌ RẶN ĐAU ==================== -->
  <g transform="translate(25, 520) scale(0.97)">
    <rect width="640" height="425" rx="12" fill="url(#p3ScreamBgFull)" stroke="#1E293B" stroke-width="3"/>

    <!-- Sóng âm thanh -->
