    <text x="320" y="408" font-family="'Segoe UI', sans-serif" font-size="12" fill="#F8FAFC" text-anchor="middle">Em bé bướng bỉnh trong bụng không chịu chui ra, dì phải dùng hết sức rặn đau hét vang khắp bệnh viện...</text>
