    <text x="170" y="31" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38BDF8" text-anchor="middle">★ CẢNH 1: DÌ CÓ BẦU RẤT TO VÀO VIỆN</text>
