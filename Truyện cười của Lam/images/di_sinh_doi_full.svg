    <linearGradient id="p3ScreamBgFull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#450A0A"/><stop offset="40%" stop-color="#991B1B"/><stop offset="80%" stop-color="#DC2626"/><stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <linearGradient id="p4HappyBgFull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3"/><stop offset="50%" stop-color="#FFF1F2"/><stop offset="100%" stop-color="#E0F2FE"/>
