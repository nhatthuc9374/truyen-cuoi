    <path d="M555 55 h20 v35 h-20 z" fill="#EF4444"/>
    <path d="M547 63 h36 v19 h-36 z" fill="#EF4444"/>
    <rect x="30" y="50" width="180" height="35" rx="6" fill="#0284C7"/>
    <text x="120" y="73" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🏥 KHOA KHÁM THAI</text>
