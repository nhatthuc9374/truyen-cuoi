      <path d="M5 -5 L13 2 L5 8" stroke="#7F1D1D" stroke-width="3.5" fill="none"/>
      <path d="M35 -5 L27 2 L35 8" stroke="#7F1D1D" stroke-width="3.5" fill="none"/>
      <ellipse cx="20" cy="15" rx="15" ry="16" fill="#7F1D1D"/>
      <circle cx="-15" cy="-8" r="4" fill="#38BDF8"/><circle cx="45" cy="-12" r="3.5" fill="#38BDF8"/>
