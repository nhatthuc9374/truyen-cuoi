    <rect x="15" y="12" width="310" height="28" rx="6" fill="#1E293B"/>
    <text x="170" y="31" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38BDF8" text-anchor="middle">★ CẢNH 2: VỪA VÀO KHÁM THÌ DÌ SẮP ĐẺ</text>
