  <text x="665" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="900" fill="url(#fullTitleTwin)" text-anchor="middle" letter-spacing="2">
    🏥👶 TRUYỆN TRANH: TÔI VÀ DÌ ĐI ĐẺ - CA SINH ĐÔI HAI BÉ MỈM MỈN 🎉🍼
  </text>

  <!-- ==================== PANEL 1: DÌ CÓ BẦU RẤT TO VÀO VIỆN ==================== -->
  <g transform="translate(25, 75) scale(0.97)">
    <rect width="640" height="425" rx="12" fill="url(#p1HospBgFull)" stroke="#1E293B" stroke-width="3"/>

