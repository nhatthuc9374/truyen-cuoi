      <ellipse cx="150" cy="135" rx="76" ry="66" fill="#FB7185" stroke="#E11D48" stroke-width="3.5"/>
      <path d="M125 100 Q160 85 195 105" stroke="#FFF1F2" stroke-width="6" fill="none" opacity="0.6" stroke-linecap="round"/>
      <circle cx="95" cy="45" r="27" fill="#FFEDD5" stroke="#1E293B" stroke-width="2.5"/>
      <path d="M68 45 C65 12 125 12 122 45 Z" fill="#78350F"/>
      <ellipse cx="85" cy="45" rx="3.5" ry="4.5" fill="#1E293B"/><ellipse cx="105" cy="45" rx="3.5" ry="4.5" fill="#1E293B"/>
      <path d="M90 54 Q95 60 100 54" fill="none" stroke="#E11D48" stroke-width="2"/>
      <path d="M80 80 Q105 120 135 145" fill="none" stroke="#FDA4AF" stroke-width="12" stroke-linecap="round"/>
