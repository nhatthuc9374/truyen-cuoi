      <path d="M22 65 Q40 55 58 65 L65 130 L15 130 Z" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
      <circle cx="40" cy="36" r="18" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
      <circle cx="34" cy="35" r="2" fill="#1E293B"/><circle cx="46" cy="35" r="2" fill="#1E293B"/>
