<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sb4TriumphBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="50%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="sb4Shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="5" y="5" width="640" height="440" rx="16" fill="url(#sb4TriumphBg)" stroke="#1E293B" stroke-width="4"/>

  <!-- Hiệu ứng ngôi sao & trái tim ăn mừng -->
  <text x="60" y="70" font-size="20">🎉</text>
  <text x="180" y="55" font-size="18">✨</text>
  <text x="460" y="60" font-size="22">🏆</text>
  <text x="580" y="80" font-size="20">💖</text>

  <!-- Mẹ nằm thư thái trên sofa, bụng xẹp nhẹ nhõm mỉm cười -->
  <g id="me-hanh-phuc" transform="translate(40, 150)">
    <rect x="0" y="80" width="220" height="25" rx="5" fill="#C2410C"/>
    <path d="M30 50 L100 40 L210 80 L210 100 L10 100 Z" fill="#FDA4AF"/>
    
    <!-- Đầu mẹ mỉm cười mãn nguyện -->
    <circle cx="45" cy="15" r="26" fill="#FFEDD5" stroke="#1E293B" stroke-width="2.5"/>
    <path d="M18 15 C18 -15 72 -15 72 15 Z" fill="#451A03"/>
    <path d="M34 12 Q40 6 46 12" stroke="#1E293B" stroke-width="2.5" fill="none"/>
    <path d="M54 12 Q60 6 66 12" stroke="#1E293B" stroke-width="2.5" fill="none"/>
    <ellipse cx="32" cy="18" rx="4" ry="2.5" fill="#FDA4AF"/>
    <ellipse cx="68" cy="18" rx="4" ry="2.5" fill="#FDA4AF"/>
    <path d="M42 22 Q50 28 58 22" stroke="#DC2626" stroke-width="2.5" fill="none"/>
    <text x="45" y="-12" font-size="12">❤️</text>
  </g>

  <!-- BỘ TỨ SIÊU ĐẲNG: 4 BÉ MỈM MỈN NẰM XẾP HÀNG TRÊN NÔI -->
  <g id="noi-bon-be" transform="translate(240, 175)">
    <!-- Nôi dài 4 ngăn ấm cúng -->
    <rect x="0" y="30" width="250" height="75" rx="12" fill="#FEF08A" stroke="#EAB308" stroke-width="3"/>
    <text x="125" y="22" font-family="'Impact', sans-serif" font-size="13" fill="#D97706" text-anchor="middle">👑 BỘ TỨ SINH 4 SIÊU ĐẲNG (MỈM MỈN) 👑</text>

    <!-- Bé 1 (Sinh tại viện) -->
    <g transform="translate(15, 0)">
      <circle cx="25" cy="45" r="16" fill="#FFEDD5" stroke="#1E293B" stroke-width="1.5"/>
      <path d="M11 42 C11 28 39 28 39 42 Z" fill="#38BDF8"/>
      <ellipse cx="16" cy="48" rx="3.5" ry="2" fill="#FDA4AF"/><ellipse cx="34" cy="48" rx="3.5" ry="2" fill="#FDA4AF"/>
      <path d="M18 43 Q22 40 26 43" stroke="#1E293B" stroke-width="1.5" fill="none"/>
      <ellipse cx="25" cy="75" rx="18" ry="16" fill="#BAE6FD" stroke="#0284C7" stroke-width="1.5"/>
      <text x="25" y="96" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="900" fill="#0369A1" text-anchor="middle">Bé 1 (Viện)</text>
    </g>

    <!-- Bé 2 (Sinh tại viện) -->
    <g transform="translate(75, 0)">
      <circle cx="25" cy="45" r="16" fill="#FFEDD5" stroke="#1E293B" stroke-width="1.5"/>
      <path d="M11 42 C11 28 39 28 39 42 Z" fill="#F472B6"/>
      <ellipse cx="16" cy="48" rx="3.5" ry="2" fill="#FDA4AF"/><ellipse cx="34" cy="48" rx="3.5" ry="2" fill="#FDA4AF"/>
      <circle cx="20" cy="44" r="1.8" fill="#1E293B"/><circle cx="30" cy="44" r="1.8" fill="#1E293B"/>
      <ellipse cx="25" cy="75" rx="18" ry="16" fill="#FCE7F3" stroke="#EC4899" stroke-width="1.5"/>
      <text x="25" y="96" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="900" fill="#BE123C" text-anchor="middle">Bé 2 (Viện)</text>
    </g>

    <!-- Bé 3 (Con đỡ tại nhà) -->
    <g transform="translate(135, 0)">
      <circle cx="25" cy="45" r="16" fill="#FFEDD5" stroke="#1E293B" stroke-width="1.5"/>
      <path d="M11 42 C11 28 39 28 39 42 Z" fill="#FBBF24"/>
      <ellipse cx="16" cy="48" rx="3.5" ry="2" fill="#FDA4AF"/><ellipse cx="34" cy="48" rx="3.5" ry="2" fill="#FDA4AF"/>
      <path d="M18 43 Q22 40 26 43" stroke="#1E293B" stroke-width="1.5" fill="none"/>
      <ellipse cx="25" cy="75" rx="18" ry="16" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
      <text x="25" y="96" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="900" fill="#B45309" text-anchor="middle">Bé 3 (Nhà)⭐</text>
    </g>

    <!-- Bé 4 (Con đỡ tại nhà) -->
    <g transform="translate(195, 0)">
      <circle cx="25" cy="45" r="16" fill="#FFEDD5" stroke="#1E293B" stroke-width="1.5"/>
      <path d="M11 42 C11 28 39 28 39 42 Z" fill="#34D399"/>
      <ellipse cx="16" cy="48" rx="3.5" ry="2" fill="#FDA4AF"/><ellipse cx="34" cy="48" rx="3.5" ry="2" fill="#FDA4AF"/>
      <circle cx="20" cy="44" r="1.8" fill="#1E293B"/><circle cx="30" cy="44" r="1.8" fill="#1E293B"/>
      <ellipse cx="25" cy="75" rx="18" ry="16" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
      <text x="25" y="96" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="900" fill="#047857" text-anchor="middle">Bé 4 (Nhà)⭐</text>
    </g>
  </g>

  <!-- Đứa con giơ tay chữ V chiến thắng hiên ngang -->
  <g id="con-chien-thang" transform="translate(520, 180)">
    <ellipse cx="40" cy="115" rx="28" ry="8" fill="#000000" opacity="0.2"/>
    <ellipse cx="40" cy="65" rx="20" ry="25" fill="#38BDF8" stroke="#0284C7" stroke-width="2"/>
    
    <!-- Đầu tròn mắt sao cười toét miệng -->
    <circle cx="40" cy="25" r="22" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
    <path d="M22 20 C20 0 60 0 58 20 Z" fill="#292524"/>
    <text x="28" y="26" font-size="12">★</text><text x="44" y="26" font-size="12">★</text>
    <ellipse cx="40" cy="36" rx="8" ry="6" fill="#DC2626"/>

    <!-- Tay giơ chữ V chiến thắng -->
    <path d="M20 55 L-5 25" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-5" cy="25" r="6" fill="#FFEDD5"/>
    <path d="M60 55 L85 25" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
    <text x="82" y="20" font-family="'Segoe UI', sans-serif" font-size="16">✌️</text>
  </g>

  <!-- Speech Mẹ & Con -->
  <g filter="url(#sb4Shadow)">
    <path d="M30 40 Q30 15 100 15 L280 15 Q310 15 310 45 Q310 78 260 78 L200 78 L170 105 L180 78 L70 78 Q30 78 30 40 Z" fill="#FFF1F2" stroke="#F43F5E" stroke-width="2.5"/>
    <text x="170" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#BE123C" text-anchor="middle">🥰 MẸ THỞ PHÀO CẢM ƠN CON:</text>
    <text x="170" y="56" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#DC2626" text-anchor="middle">"May nhờ có con đỡ đẻ giỏi quá!"</text>
    <text x="170" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#78350F" text-anchor="middle">Đủ bộ 4 thiên thần mỉm mỉn rồi! ❤️</text>
  </g>

  <g filter="url(#sb4Shadow)">
    <path d="M360 40 Q360 15 430 15 L600 15 Q630 15 630 45 Q630 80 580 80 L520 80 L490 105 L500 80 L400 80 Q360 80 360 40 Z" fill="#FEFCE8" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="495" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="900" fill="#D97706" text-anchor="middle">🏆 CON REO HÒ TỰ HÀO:</text>
    <text x="495" y="56" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#DC2626" text-anchor="middle">"CA ĐỠ ĐẺ ĐÃ THÀNH CÔNG!"</text>
    <text x="495" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#15803D" text-anchor="middle">Bác sĩ bất đắc dĩ xuất sắc quá trời! ✌️🎉</text>
  </g>

  <!-- Tiêu đề phân cảnh -->
  <rect x="15" y="12" width="370" height="26" rx="6" fill="#1E293B"/>
  <text x="200" y="29" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#38BDF8" text-anchor="middle">CẢNH 4: CA ĐỠ ĐẺ THÀNH CÔNG - ĐỦ BỘ 4 BÉ</text>

  <!-- Footer chú thích dẫn chuyện -->
  <rect x="15" y="385" width="620" height="30" rx="6" fill="#0F172A" opacity="0.9"/>
  <text x="325" y="405" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#F8FAFC" text-anchor="middle">Ca đỡ đẻ tại gia đại thành công, gia đình hạnh phúc đón trọn vẹn bộ tứ sinh 4 mỉm mỉn siêu đáng yêu...</text>
</svg>
