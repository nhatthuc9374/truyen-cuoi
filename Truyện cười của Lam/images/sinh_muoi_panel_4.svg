<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <defs>
    <linearGradient id="partyBg10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="50%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="shadowParty10" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Panel Border & Background -->
  <rect x="5" y="5" width="640" height="440" rx="16" fill="url(#partyBg10)" stroke="#1E293B" stroke-width="4"/>

  <!-- Bunting / Flags -->
  <path d="M20 45 Q160 70 300 50 T630 45" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="50,50 70,80 90,53" fill="#EF4444"/>
  <polygon points="110,56 130,85 150,59" fill="#F59E0B"/>
  <polygon points="170,60 190,90 210,61" fill="#10B981"/>
  <polygon points="230,60 250,90 270,58" fill="#3B82F6"/>
  <polygon points="290,54 310,84 330,52" fill="#EC4899"/>
  <polygon points="350,50 370,80 390,49" fill="#8B5CF6"/>
  <polygon points="410,48 430,78 450,47" fill="#F59E0B"/>
  <polygon points="470,46 490,75 510,45" fill="#10B981"/>
  <polygon points="530,45 550,74 570,45" fill="#EF4444"/>

  <!-- Floating Confetti & Hearts -->
  <text x="70" y="95" font-size="18">🎉</text>
  <text x="210" y="90" font-size="16">💖</text>
  <text x="440" y="85" font-size="18">✨</text>
  <text x="590" y="90" font-size="20">👏</text>

  <!-- Mom in Bed (Left) Smiling Radiantly -->
  <g id="mom-champion" transform="translate(25, 150)">
    <ellipse cx="55" cy="80" rx="35" ry="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="15" y="95" width="145" height="90" rx="6" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M35 100 Q90 85 155 105 L165 185 L25 185 Z" fill="#FDA4AF"/>

    <!-- Head & Joyful Smile -->
    <circle cx="65" cy="48" r="24" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
    <path d="M40 44 C35 15 90 15 90 44 Z" fill="#3B2005"/>
    <ellipse cx="65" cy="20" rx="10" ry="5" fill="#F43F5E"/> <!-- Cute Bow -->
    <!-- Sweet Smiling Eyes -->
    <path d="M54 48 Q60 42 66 48" fill="none" stroke="#1E293B" stroke-width="2"/>
    <path d="M72 48 Q78 42 84 48" fill="none" stroke="#1E293B" stroke-width="2"/>
    <circle cx="52" cy="54" r="4" fill="#FCA5A5"/><circle cx="80" cy="54" r="4" fill="#FCA5A5"/>
    <path d="M62 56 Q66 62 70 56" fill="none" stroke="#E11D48" stroke-width="2"/>
  </g>

  <!-- Giant 2-Tier Crib with 10 BABIES: 5 BOYS (TOP) & 5 GIRLS (BOTTOM)! -->
  <g id="decuplets-crib" transform="translate(170, 140)">
    <!-- Crib Frame -->
    <rect x="0" y="30" width="310" height="180" rx="14" fill="#FEF08A" stroke="#F59E0B" stroke-width="3"/>
    <rect x="6" y="36" width="298" height="168" rx="10" fill="#FFFBEB"/>

    <!-- ================= ROW 1: 5 BABY BOYS (Blue Swaddles) ================= -->
    <text x="155" y="52" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#0284C7" text-anchor="middle">👦 5 BÉ TRAI KHÁU KHỈNH 👦</text>
    
    <!-- Boy 1 -->
    <g transform="translate(15, 60)">
      <ellipse cx="18" cy="35" rx="14" ry="18" fill="#60A5FA"/>
      <circle cx="18" cy="18" r="12" fill="#FFEDD5"/>
      <ellipse cx="18" cy="10" rx="10" ry="6" fill="#38BDF8"/>
      <circle cx="14" cy="18" r="1.5" fill="#1E293B"/><circle cx="22" cy="18" r="1.5" fill="#1E293B"/>
      <path d="M16 23 Q18 26 20 23" fill="none" stroke="#DC2626"/>
    </g>
    <!-- Boy 2 -->
    <g transform="translate(70, 60)">
      <ellipse cx="18" cy="35" rx="14" ry="18" fill="#38BDF8"/>
      <circle cx="18" cy="18" r="12" fill="#FFEDD5"/>
      <circle cx="18" cy="22" r="3.5" fill="#0284C7"/>
      <circle cx="14" cy="16" r="1.5" fill="#1E293B"/><circle cx="22" cy="16" r="1.5" fill="#1E293B"/>
    </g>
    <!-- Boy 3 -->
    <g transform="translate(125, 60)">
      <ellipse cx="18" cy="35" rx="14" ry="18" fill="#60A5FA"/>
      <circle cx="18" cy="18" r="12" fill="#FFEDD5"/>
      <text x="18" y="8" font-size="10" text-anchor="middle">👑</text>
      <circle cx="14" cy="18" r="1.5" fill="#1E293B"/><circle cx="22" cy="18" r="1.5" fill="#1E293B"/>
      <path d="M16 23 Q18 26 20 23" fill="none" stroke="#DC2626"/>
    </g>
    <!-- Boy 4 -->
    <g transform="translate(180, 60)">
      <ellipse cx="18" cy="35" rx="14" ry="18" fill="#38BDF8"/>
      <circle cx="18" cy="18" r="12" fill="#FFEDD5"/>
      <path d="M12 18 Q15 15 18 18" fill="none" stroke="#1E293B"/>
      <path d="M18 18 Q21 15 24 18" fill="none" stroke="#1E293B"/>
    </g>
    <!-- Boy 5 -->
    <g transform="translate(235, 60)">
      <ellipse cx="18" cy="35" rx="14" ry="18" fill="#60A5FA"/>
      <circle cx="18" cy="18" r="12" fill="#FFEDD5"/>
      <ellipse cx="18" cy="10" rx="10" ry="6" fill="#0284C7"/>
      <circle cx="14" cy="18" r="1.5" fill="#1E293B"/><circle cx="22" cy="18" r="1.5" fill="#1E293B"/>
    </g>

    <!-- Divider Line -->
    <line x1="20" y1="120" x2="290" y2="120" stroke="#FDE047" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- ================= ROW 2: 5 BABY GIRLS (Pink Swaddles) ================= -->
    <text x="155" y="134" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#E11D48" text-anchor="middle">👧 5 BÉ GÁI XINH XẮN 👧</text>

    <!-- Girl 1 -->
    <g transform="translate(15, 140)">
      <ellipse cx="18" cy="35" rx="14" ry="18" fill="#F472B6"/>
      <circle cx="18" cy="18" r="12" fill="#FFEDD5"/>
      <circle cx="18" cy="8" r="2.5" fill="#EC4899"/>
      <circle cx="14" cy="18" r="1.5" fill="#1E293B"/><circle cx="22" cy="18" r="1.5" fill="#1E293B"/>
      <path d="M16 23 Q18 26 20 23" fill="none" stroke="#DC2626"/>
    </g>
    <!-- Girl 2 -->
    <g transform="translate(70, 140)">
      <ellipse cx="18" cy="35" rx="14" ry="18" fill="#FB7185"/>
      <circle cx="18" cy="18" r="12" fill="#FFEDD5"/>
      <circle cx="18" cy="22" r="3" fill="#F43F5E"/>
      <path d="M12 18 Q15 15 18 18" fill="none" stroke="#1E293B"/>
      <path d="M18 18 Q21 15 24 18" fill="none" stroke="#1E293B"/>
    </g>
    <!-- Girl 3 -->
    <g transform="translate(125, 140)">
      <ellipse cx="18" cy="35" rx="14" ry="18" fill="#F472B6"/>
      <circle cx="18" cy="18" r="12" fill="#FFEDD5"/>
      <text x="18" y="8" font-size="10" text-anchor="middle">🎀</text>
      <circle cx="14" cy="18" r="1.5" fill="#1E293B"/><circle cx="22" cy="18" r="1.5" fill="#1E293B"/>
      <path d="M16 23 Q18 26 20 23" fill="none" stroke="#DC2626"/>
    </g>
    <!-- Girl 4 -->
    <g transform="translate(180, 140)">
      <ellipse cx="18" cy="35" rx="14" ry="18" fill="#FB7185"/>
      <circle cx="18" cy="18" r="12" fill="#FFEDD5"/>
      <circle cx="18" cy="8" r="2.5" fill="#EC4899"/>
      <circle cx="14" cy="18" r="1.5" fill="#1E293B"/><circle cx="22" cy="18" r="1.5" fill="#1E293B"/>
    </g>
    <!-- Girl 5 -->
    <g transform="translate(235, 140)">
      <ellipse cx="18" cy="35" rx="14" ry="18" fill="#F472B6"/>
      <circle cx="18" cy="18" r="12" fill="#FFEDD5"/>
      <text x="18" y="8" font-size="10" text-anchor="middle">🌸</text>
      <circle cx="14" cy="18" r="1.5" fill="#1E293B"/><circle cx="22" cy="18" r="1.5" fill="#1E293B"/>
      <path d="M16 23 Q18 26 20 23" fill="none" stroke="#DC2626"/>
    </g>
  </g>

  <!-- Family Clapping & Cheering (Dad & Child on Right) -->
  <g id="family-cheering" transform="translate(490, 140)">
    <!-- Clapping texts -->
    <text x="30" y="30" font-family="'Impact', sans-serif" font-size="14" fill="#EF4444">BỐP!</text>
    <text x="80" y="20" font-family="'Impact', sans-serif" font-size="14" fill="#F59E0B">HOAN HÔ!</text>

    <!-- Dad Clapping -->
    <g transform="translate(10, 45)">
      <ellipse cx="30" cy="115" rx="22" ry="7" fill="#000000" opacity="0.2"/>
      <ellipse cx="30" cy="75" rx="18" ry="24" fill="#3B82F6"/>
      <circle cx="30" cy="35" r="18" fill="#FFEDD5"/>
      <path d="M15 30 C12 12 48 12 45 30 Z" fill="#1E293B"/>
      <circle cx="24" cy="32" r="2" fill="#1E293B"/><circle cx="36" cy="32" r="2" fill="#1E293B"/>
      <path d="M24 40 Q30 46 36 40" fill="none" stroke="#DC2626" stroke-width="2"/>
      <text x="30" y="55" font-size="14" text-anchor="middle">👏</text>
    </g>

    <!-- Child Jumping with Arms Up -->
    <g transform="translate(65, 55)">
      <ellipse cx="25" cy="105" rx="20" ry="6" fill="#000000" opacity="0.2"/>
      <ellipse cx="25" cy="65" rx="15" ry="20" fill="#F43F5E"/>
      <circle cx="25" cy="30" r="15" fill="#FFEDD5"/>
      <path d="M12 26 C10 12 38 12 36 26 Z" fill="#292524"/>
      <text x="25" y="15" font-size="12" text-anchor="middle">⭐</text>
      <!-- Arms raised high -->
      <path d="M15 55 Q5 35 12 25" fill="none" stroke="#F43F5E" stroke-width="6" stroke-linecap="round"/>
      <path d="M35 55 Q45 35 38 25" fill="none" stroke="#F43F5E" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Speech Bubble: Family Cheering -->
  <g filter="url(#shadowParty10)">
    <path d="M380 25 Q380 5 470 5 L600 5 Q630 5 630 32 Q630 60 560 60 L520 60 L505 80 L510 60 L440 60 Q380 60 380 25 Z" fill="#FEFCE8" stroke="#EAB308" stroke-width="2.5"/>
    <text x="505" y="28" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#854D0E" text-anchor="middle">"HOAN HÔ MẸ SIÊU NHÂN! 👏🎉"</text>
    <text x="505" y="48" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#A16207" text-anchor="middle">"Kỷ lục 10 đứa: 5 trai 5 gái cưng xỉu!"</text>
  </g>

  <!-- Speech Bubble: Mom -->
  <g filter="url(#shadowParty10)">
    <path d="M30 25 Q30 5 100 5 L260 5 Q300 5 300 32 Q300 60 230 60 L170 60 L155 80 L160 60 L70 60 Q30 60 30 25 Z" fill="#FFF1F2" stroke="#F43F5E" stroke-width="2.5"/>
    <text x="165" y="28" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#BE123C" text-anchor="middle">"Bõ công mẹ hét rung nhà!"</text>
    <text x="165" y="48" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#9F1239" text-anchor="middle">"10 thiên thần chào cả nhà! 🥰"</text>
  </g>

  <!-- Panel Header Banner -->
  <rect x="20" y="16" width="310" height="32" rx="8" fill="#1E293B"/>
  <text x="175" y="37" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FACC15" text-anchor="middle">★ CẢNH 4: HẠ SINH 10 BÉ (5 TRAI, 5 GÁI)</text>

  <!-- Caption at bottom -->
  <rect x="25" y="402" width="600" height="34" rx="8" fill="#0F172A" opacity="0.85"/>
  <text x="325" y="424" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#F8FAFC" text-anchor="middle">Cả nhà vỡ òa hoan hô chúc mừng mẹ hạ sinh kỷ lục 10 bé gồm 5 trai và 5 gái siêu đáng yêu!</text>
</svg>
