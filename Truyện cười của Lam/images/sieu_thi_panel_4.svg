<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="martBg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="60%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="shadowSM4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Khung viền và nền panel 4 -->
  <rect x="6" y="6" width="788" height="538" rx="20" fill="url(#martBg4)" stroke="#EA580C" stroke-width="5"/>

  <!-- CỬA RA SIÊU THỊ PHÍA TRƯỚC PHÓNG TO -->
  <g transform="translate(600, 90)">
    <!-- Cửa kính tự động mở toang -->
    <rect x="0" y="40" width="22" height="300" fill="#38BDF8" opacity="0.65" stroke="#0284C7" stroke-width="3"/>
    <rect x="160" y="40" width="22" height="300" fill="#38BDF8" opacity="0.65" stroke="#0284C7" stroke-width="3"/>
    <!-- Biển lối ra lớn -->
    <rect x="25" y="10" width="135" height="36" rx="6" fill="#16A34A" stroke="#14532D" stroke-width="2"/>
    <text x="92" y="34" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">🚪 CỬA RA SIÊU THỊ</text>
  </g>

  <!-- Sàn gạch -->
  <line x1="6" y1="410" x2="794" y2="410" stroke="#94A3B8" stroke-width="3"/>

  <!-- TIÊU ĐỀ CẢNH 4 TO RÕ -->
  <rect x="30" y="18" width="670" height="46" rx="12" fill="#EA580C" filter="url(#shadowSM4)"/>
  <text x="365" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">🏃‍♀️💨 CẢNH 4: MÀN THÁO CHẠY HỐI HẢ &amp; CẢ SIÊU THỊ CƯỜI RẤT TO! 🤣</text>

  <!-- ĐƯỜNG VỆT TỐC ĐỘ PHÓNG TO (SPEED LINES) -->
  <line x1="20" y1="240" x2="220" y2="240" stroke="#F97316" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <line x1="50" y1="280" x2="270" y2="280" stroke="#F97316" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <line x1="30" y1="320" x2="210" y2="320" stroke="#F97316" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <line x1="60" y1="360" x2="300" y2="360" stroke="#F97316" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <!-- Đám mây khói bụi sau gót chân -->
  <ellipse cx="180" cy="405" rx="30" ry="16" fill="#E2E8F0" opacity="0.8"/>
  <ellipse cx="215" cy="395" rx="22" ry="14" fill="#E2E8F0" opacity="0.7"/>
  <ellipse cx="150" cy="400" rx="18" ry="12" fill="#E2E8F0" opacity="0.6"/>

  <!-- ==================== CON LỚN ("TÔI") HỐI HẢ CHẠY ĐẰNG TRƯỚC ==================== -->
  <g id="child-running" transform="translate(430, 160)">
    <ellipse cx="50" cy="240" rx="35" ry="10" fill="#000000" opacity="0.25"/>

    <!-- Thân người nghiêng hẳn về phía trước -->
    <path d="M 30 120 Q 75 110 85 155 L 45 180 Z" fill="#38BDF8" stroke="#0284C7" stroke-width="3"/>
    <!-- Chân sải bước chạy marathon -->
    <path d="M 60 170 L 105 225" stroke="#1E3A8A" stroke-width="10" stroke-linecap="round"/>
    <path d="M 45 170 L 15 220" stroke="#1E3A8A" stroke-width="10" stroke-linecap="round"/>

    <!-- Đầu ngước lại hối hả -->
    <circle cx="70" cy="80" r="24" fill="#FFEDD5" stroke="#1E293B" stroke-width="3"/>
    <path d="M 50 78 C 45 50 92 50 90 78 Z" fill="#292524"/>
    <circle cx="62" cy="80" r="3.5" fill="#1E293B"/><circle cx="78" cy="80" r="3.5" fill="#1E293B"/>
    <path d="M 64 90 Q 72 98 80 90" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Tay trước vung ra, tay sau nắm chặt tay mẹ -->
    <path d="M 85 130 L 120 115" stroke="#FFEDD5" stroke-width="8" stroke-linecap="round"/>
    <path d="M 45 130 L -25 150" stroke="#FFEDD5" stroke-width="8" stroke-linecap="round"/>

    <!-- Lời thoại của con lớn -->
    <g transform="translate(40, -65)">
      <path d="M 0 0 L 175 0 Q 185 0 185 12 L 185 45 Q 185 55 175 55 L 50 55 L 30 70 L 38 55 L 0 55 Q -12 55 -12 45 L -12 12 Q -12 0 0 0 Z" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" filter="url(#shadowSM4)"/>
      <text x="87" y="24" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="900" fill="#0369A1" text-anchor="middle">"Chạy lẹ mẹ ơi!"</text>
      <text x="87" y="44" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#DC2626" text-anchor="middle">Đẻ tới nơi rồi kìa! 🏃‍♂️💨</text>
    </g>
  </g>

  <!-- ==================== NHÂN VẬT: MẸ ÔM BỤNG BẦU CHẠY PHI NƯỚC ĐẠI ==================== -->
  <g id="mom-sprinting" transform="translate(240, 110)">
    <ellipse cx="80" cy="295" rx="75" ry="14" fill="#000000" opacity="0.3"/>

    <!-- VÁY & BỤNG BẦU TRÒN CĂNG NHÚC NHÍCH (R = 85px) -->
    <circle cx="110" cy="210" r="85" fill="#FBBF24" stroke="#D97706" stroke-width="5" filter="url(#shadowSM4)"/>
    <!-- Thân váy tung bay về phía sau -->
    <path d="M 35 230 C -10 260 -25 295 -10 310 C 25 310 80 300 115 285 Z" fill="#FDE68A" opacity="0.9"/>

    <!-- Chân mẹ guồng bước chạy thần tốc -->
    <path d="M 65 260 L 20 310" stroke="#FFEDD5" stroke-width="11" stroke-linecap="round"/>
    <path d="M 105 260 L 145 300" stroke="#FFEDD5" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="15" cy="315" rx="11" ry="7" fill="#EF4444"/>
    <ellipse cx="152" cy="305" rx="11" ry="7" fill="#EF4444"/>

    <!-- Thân trên & Đầu mẹ đang thở dốc -->
    <path d="M 55 105 Q 90 90 120 110 L 135 155 L 45 155 Z" fill="#FDE68A" stroke="#D97706" stroke-width="2.5"/>
    <circle cx="85" cy="55" r="30" fill="#FFEDD5" stroke="#1E293B" stroke-width="3"/>
    <path d="M 55 55 C 50 20 120 20 115 55 Z" fill="#451A03"/>
    <!-- Mái tóc búi tuột bay tung tóe -->
    <circle cx="85" cy="20" r="12" fill="#451A03"/>
    <path d="M 50 35 Q 15 28 8 48" stroke="#451A03" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Mặt mẹ vừa chạy vừa thở dốc nhưng cười trừ -->
    <circle cx="75" cy="55" r="4" fill="#1E293B"/><circle cx="98" cy="55" r="4" fill="#1E293B"/>
    <ellipse cx="86" cy="72" rx="8" ry="11" fill="#DC2626"/>
    <ellipse cx="65" cy="65" rx="9" ry="6" fill="#EF4444" opacity="0.7"/>
    <ellipse cx="106" cy="65" rx="9" ry="6" fill="#EF4444" opacity="0.7"/>

    <!-- Giọt mồ hôi bắn ra to tướng -->
    <circle cx="125" cy="40" r="4.5" fill="#38BDF8"/>
    <circle cx="135" cy="55" r="4" fill="#38BDF8"/>

    <!-- Hai tay mẹ ôm ghì lấy bụng bầu con bên trong -->
    <path d="M 50 120 Q 30 170 70 215" stroke="#FFEDD5" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M 115 120 Q 155 170 125 215" stroke="#FFEDD5" stroke-width="11" stroke-linecap="round" fill="none"/>
    <circle cx="75" cy="215" r="9" fill="#FFEDD5"/>
    <circle cx="120" cy="215" r="9" fill="#FFEDD5"/>

    <!-- Lời thoại của mẹ -->
    <g transform="translate(-20, -70)">
      <path d="M 0 0 L 205 0 Q 215 0 215 12 L 215 48 Q 215 60 205 60 L 105 60 L 95 75 L 90 60 L 0 60 Q -12 60 -12 48 L -12 12 Q -12 0 0 0 Z" fill="#FFFFFF" stroke="#EA580C" stroke-width="3" filter="url(#shadowSM4)"/>
      <text x="102" y="25" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="900" fill="#C2410C" text-anchor="middle">"ÔI XẤU HỔ QUÁ TRỜI!"</text>
      <text x="102" y="47" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#DC2626" text-anchor="middle">Chạy nhanh lên con ơi! 🏃‍♀️💨</text>
    </g>
  </g>

  <!-- ==================== CẢ KHU VỰC SIÊU THỊ CƯỜI RẤT TO ==================== -->
  <g id="big-laugh-zone" transform="translate(30, 80)">
    <rect x="0" y="0" width="190" height="125" rx="14" fill="#FEF2F2" stroke="#EF4444" stroke-width="3.5" filter="url(#shadowSM4)"/>
    <text x="95" y="32" font-family="'Segoe UI', Impact, sans-serif" font-size="18" font-weight="900" fill="#DC2626" text-anchor="middle">CẢ KHU SIÊU THỊ</text>
    <text x="95" y="66" font-family="'Segoe UI', Impact, sans-serif" font-size="26" font-weight="900" fill="#EF4444" text-anchor="middle">CƯỜI RẤT TO!</text>
    <text x="95" y="102" font-family="'Segoe UI', sans-serif" font-size="22" text-anchor="middle">🤣 📢 👏 💯</text>
  </g>

  <!-- TIẾNG CƯỜI VANG DỘI KHẮP CÁC QUẦY HÀNG -->
  <text x="90" y="270" font-family="'Segoe UI', Impact, sans-serif" font-size="32" font-weight="900" fill="#F59E0B" opacity="0.85">HA HA HA!</text>
  <text x="110" y="320" font-family="'Segoe UI', Impact, sans-serif" font-size="26" font-weight="900" fill="#EA580C" opacity="0.95">CƯỜI BÒ CÀNG!</text>
  <text x="500" y="480" font-family="'Segoe UI', Impact, sans-serif" font-size="20" font-weight="900" fill="#15803D">"BỤNG BẦU CHẠY MARATHON ĐỈNH CAO!"</text>
</svg>
