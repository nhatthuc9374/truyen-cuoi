<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 650 450 width=100% height=100%>
  <defs>
    <linearGradient id=p2Wall x1=0% y1=0% x2=0% y2=100%>
      <stop offset=0% stop-color=#FFFBEB/>
      <stop offset=60% stop-color=#FEF3C7/>
      <stop offset=60% stop-color=#FDE68A/>
      <stop offset=100% stop-color=#D97706/>
    </linearGradient>
    <filter id=p2Shadow x=-5% y=-5% width=110% height=110%>
      <feDropShadow dx=2 dy=3 stdDeviation=2 flood-opacity=0.25/>
    </filter>
  </defs>

  <rect x=5 y=5 width=640 height=440 rx=16 fill=url(#p2Wall) stroke=#D97706 stroke-width=4/>

  <rect x=15 y=15 width=620 height=40 rx=8 fill=#FFFFFF stroke=#D97706 stroke-width=2/>
  <text x=325 y=42 font-family='Segoe UI', Roboto, sans-serif font-size=18 font-weight=900 fill=#B45309 text-anchor=middle letter-spacing=1>
    💖 CẢNH 2: BẠN NHỎ ÂN CẦN CHĂM SÓC – CON CHĂM MẸ
  </text>

  <!-- Wall Picture Frame -->
  <rect x=260 y=65 width=130 height=85 rx=6 fill=#FEF9C3 stroke=#78350F stroke-width=3/>
  <circle cx=325 cy=100 r=16 fill=#F87171/>
  <path d=M325 108 L325 135 M315 120 L325 125 L335 120 stroke=#16A34A stroke-width=3 fill=none/>

  <line x1=5 y1=290 x2=645 y2=290 stroke=#B45309 stroke-width=3/>

  <!-- Sofa & Cushions -->
  <g id=sofa2 transform=translate(60, 160) filter=url(#p2Shadow)>
    <rect x=30 y=30 width=480 height=100 rx=20 fill=#FFE4E6 stroke=#F43F5E stroke-width=3/>
    <circle cx=80 cy=65 r=7 fill=#FDA4AF opacity=0.6/>
    <circle cx=200 cy=65 r=7 fill=#FDA4AF opacity=0.6/>
    <circle cx=350 cy=65 r=7 fill=#FDA4AF opacity=0.6/>
    <!-- Pillow for Mom's back -->
    <rect x=80 y=55 width=60 height=75 rx=14 fill=#DDD6FE stroke=#7C3AED stroke-width=2/>
    <rect x=40 y=120 width=460 height=45 rx=10 fill=#FFE4E6 stroke=#F43F5E stroke-width=3/>
  </g>

  <!-- Footstool with Cushion (Gác Chân) -->
  <g id=footstool transform=translate(420, 275) filter=url(#p2Shadow)>
    <rect x=10 y=5 width=85 height=35 rx=10 fill=#FEF08A stroke=#CA8A04 stroke-width=2.5/>
    <rect x=18 y=40 width=10 height=25 rx=3 fill=#78350F/>
    <rect x=77 y=40 width=10 height=25 rx=3 fill=#78350F/>
  </g>

  <!-- Mom Reclining Comfortably -->
  <g id=mom2 transform=translate(130, 125)>
    <ellipse cx=60 cy=70 rx=36 ry=42 fill=#713F12/>
    <!-- Body in pink floral pajamas reclining -->
    <path d=M40 95 Q80 85 110 95 L180 200 L40 190 Z fill=#FBCFE8 stroke=#DB2777 stroke-width=2.5/>
    <!-- Round Belly -->
    <ellipse cx=140 cy=155 rx=48 ry=42 fill=#FDF2F8 stroke=#DB2777 stroke-width=3 filter=url(#p2Shadow)/>
    <circle cx=130 cy=145 r=5 fill=#F472B6 opacity=0.7/>
    <circle cx=155 cy=150 r=5 fill=#F472B6 opacity=0.7/>
    <!-- Legs resting on footstool -->
    <path d=M160 175 L280 185 L330 180 fill=none stroke=#FBCFE8 stroke-width=28 stroke-linecap=round/>
    <path d=M160 175 L280 185 L330 180 fill=none stroke=#DB2777 stroke-width=2/>
    <!-- Feet resting on cushion -->
    <ellipse cx=335 cy=180 rx=14 ry=9 fill=#FFEDD5 stroke=#9A3412 stroke-width=1.5/>

    <!-- Head & Grateful Smile -->
    <circle cx=75 cy=65 r=26 fill=#FFEDD5 stroke=#9A3412 stroke-width=2/>
    <path d=M50 55 Q75 40 100 55 fill=none stroke=#713F12 stroke-width=6/>
    <!-- Smiling Eyes (Happy/Relieved) -->
    <path d=M63 65 Q70 60 77 65 fill=none stroke=#713F12 stroke-width=2.5/>
    <path d=M83 65 Q90 60 97 65 fill=none stroke=#713F12 stroke-width=2.5/>
    <path d=M72 75 Q80 82 88 75 fill=none stroke=#BE123C stroke-width=2/>
    <ellipse cx=65 cy=72 rx=4 ry=2.5 fill=#FDA4AF/>
    <ellipse cx=95 cy=72 rx=4 ry=2.5 fill=#FDA4AF/>
  </g>

  <!-- Daughter Giving Water (Bé Gái Đưa Cốc Nước) -->
  <g id=daughter2 transform=translate(420, 145)>
    <ellipse cx=75 cy=45 rx=12 ry=22 fill=#F472B6 stroke=#DB2777 stroke-width=1.5/>
    <ellipse cx=15 cy=45 rx=12 ry=22 fill=#F472B6 stroke=#DB2777 stroke-width=1.5/>
    <circle cx=45 cy=45 r=22 fill=#FFEDD5 stroke=#9A3412 stroke-width=2/>
    <path d=M25 36 Q45 25 65 36 fill=none stroke=#F472B6 stroke-width=6/>
    <!-- Smiling Happy Eyes -->
    <path d=M35 44 Q40 38 45 44 fill=none stroke=#1E3A8A stroke-width=2.5/>
    <path d=M50 44 Q55 38 60 44 fill=none stroke=#1E3A8A stroke-width=2.5/>
    <path d=M42 54 Q48 60 54 54 fill=none stroke=#BE123C stroke-width=2/>
    <!-- Hoodie -->
    <path d=M25 65 Q45 60 65 65 L70 130 L20 130 Z fill=#FCE7F3 stroke=#DB2777 stroke-width=2/>
    <!-- Arms holding water cup -->
    <path d=M25 75 Q5 80 -15 85 fill=none stroke=#FCE7F3 stroke-width=9 stroke-linecap=round/>
    <circle cx=-15 cy=85 r=5 fill=#FFEDD5 stroke=#9A3412 stroke-width=1/>
    <!-- Glass of Warm Water -->
    <rect x=-35 y=70 width=22 height=32 rx=3 fill=#E0F2FE stroke=#0284C7 stroke-width=1.5 opacity=0.95/>
    <rect x=-33 y=78 width=18 height=22 rx=2 fill=#38BDF8 opacity=0.6/>
    <!-- Steam on Water -->
    <path d=M-26 66 Q-28 62 -26 58 fill=none stroke=#94A3B8 stroke-width=1.5/>
    <path d=M-20 65 Q-18 61 -20 57 fill=none stroke=#94A3B8 stroke-width=1.5/>

    <!-- Pants & Shoes -->
    <rect x=25 y=130 width=16 height=45 rx=3 fill=#93C5FD stroke=#2563EB stroke-width=1.5/>
    <rect x=47 y=130 width=16 height=45 rx=3 fill=#93C5FD stroke=#2563EB stroke-width=1.5/>
    <ellipse cx=33 cy=178 rx=9 ry=5 fill=#FFFFFF stroke=#64748B stroke-width=1.5/>
    <ellipse cx=55 cy=178 rx=9 ry=5 fill=#FFFFFF stroke=#64748B stroke-width=1.5/>
  </g>

  <!-- Speech Bubbles -->
  <g id=bubble2-mom transform=translate(50, 75)>
    <rect x=0 y=0 width=150 height=60 rx=16 fill=#FFFFFF stroke=#1E1B4B stroke-width=2 filter=url(#p2Shadow)/>
    <text x=75 y=27 font-family='Segoe UI', Roboto, sans-serif font-size=14 font-weight=bold fill=#1E1B4B text-anchor=middle>Mẹ... cảm ơn</text>
    <text x=75 y=47 font-family='Segoe UI', Roboto, sans-serif font-size=14 font-weight=bold fill=#1E1B4B text-anchor=middle>con nhé! ❤️</text>
  </g>

  <g id=bubble2-daughter transform=translate(425, 65)>
    <rect x=0 y=0 width=200 height=70 rx=16 fill=#FFFFFF stroke=#1E1B4B stroke-width=2 filter=url(#p2Shadow)/>
    <text x=100 y=28 font-family='Segoe UI', Roboto, sans-serif font-size=14 font-weight=bold fill=#1E1B4B text-anchor=middle>Mẹ nghỉ ngơi chút nhé!</text>
    <text x=100 y=50 font-family='Segoe UI', Roboto, sans-serif font-size=14 font-weight=bold fill=#1E1B4B text-anchor=middle>Con lấy nước cho mẹ.</text>
  </g>
</svg>