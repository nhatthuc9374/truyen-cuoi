<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skySunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#BAE6FD"/>
      <stop offset="70%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <linearGradient id="cabinWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="goldTicket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="pilotSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="momSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1EE"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Cabin Background -->
  <rect width="1200" height="800" fill="url(#cabinWall)"/>

  <!-- Airplane Oval Windows showing Sunset Clouds -->
  <g id="airplane-windows">
    <rect x="70" y="80" width="130" height="210" rx="65" fill="#0284C7" stroke="#CBD5E1" stroke-width="10"/>
    <rect x="78" y="88" width="114" height="194" rx="57" fill="url(#skySunset)"/>
    <ellipse cx="110" cy="220" rx="40" ry="22" fill="#FFFFFF" opacity="0.85"/>
    <ellipse cx="150" cy="210" rx="45" ry="26" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="170" cy="115" r="14" fill="#FEF08A" opacity="0.9"/>

    <rect x="250" y="80" width="130" height="210" rx="65" fill="#0284C7" stroke="#CBD5E1" stroke-width="10"/>
    <rect x="258" y="88" width="114" height="194" rx="57" fill="url(#skySunset)"/>
    <ellipse cx="300" cy="225" rx="48" ry="25" fill="#FFFFFF" opacity="0.85"/>
    <ellipse cx="340" cy="215" rx="40" ry="22" fill="#FFFFFF" opacity="0.9"/>

    <path d="M0 60 Q600 40 1200 60 L1200 75 Q600 55 0 75 Z" fill="#94A3B8"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#CBD5E1" stroke-width="3"/>
  </g>

  <!-- Floating Celebration Confetti & Sparkles -->
  <g id="confetti" opacity="0.85">
    <circle cx="210" cy="50" r="7" fill="#F43F5E"/>
    <rect x="380" y="60" width="12" height="12" rx="3" fill="#3B82F6" transform="rotate(25 380 60)"/>
    <polygon points="520,35 528,45 515,48" fill="#F59E0B"/>
    <circle cx="700" cy="70" r="8" fill="#10B981"/>
    <rect x="880" y="45" width="14" height="8" rx="2" fill="#8B5CF6" transform="rotate(-30 880 45)"/>
    <polygon points="1050,60 1060,75 1045,78" fill="#EC4899"/>
    <text x="170" y="340" font-size="26">✨</text>
    <text x="430" y="160" font-size="30">🎉</text>
    <text x="640" y="140" font-size="28">✨</text>
    <text x="1110" y="220" font-size="34">🎊</text>
    <text x="960" y="150" font-size="28">💖</text>
  </g>

  <!-- Top Title Banner -->
  <g id="header-banner" filter="url(#shadow)">
    <rect x="180" y="12" width="840" height="52" rx="26" fill="#16A34A" stroke="#FFFFFF" stroke-width="3"/>
    <text x="600" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="900" fill="#FFFFFF" text-anchor="middle">
      🎉 CẢNH 4: SINH BA TRÊN MÂY &amp; NHẬN THẺ BAY TRỌN ĐỜI! ✈️👶
    </text>
  </g>

  <!-- FIRST CLASS LUXURY BED/SEAT -->
  <g id="first-class-seat" transform="translate(60, 310)" filter="url(#shadow)">
    <rect x="0" y="40" width="140" height="340" rx="30" fill="#1E3A8A" stroke="#3B82F6" stroke-width="4"/>
    <ellipse cx="70" cy="110" rx="55" ry="40" fill="#FFFFFF" stroke="#93C5FD" stroke-width="3"/>
    <rect x="60" y="240" width="460" height="150" rx="30" fill="#2563EB" stroke="#1D4ED8" stroke-width="4"/>
    <path d="M 80 320 Q 250 280 480 300 L 480 410 L 80 410 Z" fill="#F472B6" stroke="#DB2777" stroke-width="3"/>
    <ellipse cx="280" cy="350" rx="190" ry="45" fill="#FBCFE8" opacity="0.7"/>
  </g>

  <!-- MOTHER (SMILING RADIANTLY) -->
  <g id="character-mother" transform="translate(130, 240)" filter="url(#shadow)">
    <path d="M 50 80 Q 20 180 50 230 Q 110 240 160 220 Q 180 160 160 80 Z" fill="#451A03"/>
    <path d="M 55 120 Q 30 240 70 340 L 260 340 Q 280 240 230 120 Z" fill="#FDA4AF"/>
    <circle cx="100" cy="250" r="8" fill="#FDE047" opacity="0.8"/>
    <circle cx="130" cy="300" r="10" fill="#FDE047" opacity="0.8"/>
    <circle cx="210" cy="270" r="9" fill="#FDE047" opacity="0.8"/>

    <circle cx="110" cy="75" r="52" fill="url(#momSkin)"/>
    <path d="M 60 65 Q 110 20 160 60 Q 150 40 110 35 Q 75 40 60 65 Z" fill="#451A03"/>
    <path d="M 58 70 Q 50 110 65 140 Q 75 110 70 75 Z" fill="#451A03"/>
    <path d="M 158 70 Q 170 110 155 140 Q 148 110 152 75 Z" fill="#451A03"/>
    <circle cx="65" cy="50" r="12" fill="#F43F5E"/>
    <circle cx="65" cy="50" r="5" fill="#FEF08A"/>

    <path d="M 75 56 Q 88 50 100 56" stroke="#78350F" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 120 56 Q 132 50 145 56" stroke="#78350F" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 75 70 Q 88 58 100 70" stroke="#1E293B" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M 120 70 Q 133 58 145 70" stroke="#1E293B" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="78" cy="82" rx="10" ry="6" fill="#FB7185" opacity="0.75"/>
    <ellipse cx="142" cy="82" rx="10" ry="6" fill="#FB7185" opacity="0.75"/>
    <path d="M 98 84 Q 110 96 122 84" stroke="#BE123C" stroke-width="3.5" fill="#E11D48" stroke-linecap="round"/>

    <path d="M 60 150 Q 70 250 160 260" stroke="#FED7AA" stroke-width="26" stroke-linecap="round" fill="none"/>
    <path d="M 220 150 Q 230 250 170 260" stroke="#FED7AA" stroke-width="26" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 3 ADORABLE CHUBBY BABIES -->
  <g id="three-babies" transform="translate(230, 420)" filter="url(#shadow)">
    <!-- Baby 1: Bé Mây -->
    <g transform="translate(0, 0)">
      <rect x="0" y="40" width="85" height="130" rx="38" fill="#38BDF8" stroke="#0284C7" stroke-width="3"/>
      <path d="M 5 60 Q 42 90 80 60" stroke="#0284C7" stroke-width="2" fill="none"/>
      <circle cx="42" cy="40" r="34" fill="#FFF1EE" stroke="#FDBA74" stroke-width="2"/>
      <path d="M 12 34 Q 42 0 72 34 Z" fill="#0284C7"/>
      <circle cx="42" cy="5" r="8" fill="#FFFFFF"/>
      <path d="M 24 40 Q 32 46 38 40" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 46 40 Q 52 46 60 40" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="25" cy="48" r="6" fill="#FDA4AF"/>
      <circle cx="60" cy="48" r="6" fill="#FDA4AF"/>
      <ellipse cx="42" cy="52" rx="4" ry="2" fill="#E11D48"/>
      <rect x="12" y="110" width="60" height="24" rx="8" fill="#FFFFFF"/>
      <text x="42" y="127" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#0284C7" text-anchor="middle">MÂY 3.0kg</text>
    </g>

    <!-- Baby 2: Bé Gió -->
    <g transform="translate(80, -15)">
      <rect x="0" y="40" width="85" height="130" rx="38" fill="#F472B6" stroke="#BE185D" stroke-width="3"/>
      <path d="M 5 60 Q 42 90 80 60" stroke="#BE185D" stroke-width="2" fill="none"/>
      <circle cx="42" cy="40" r="34" fill="#FFF1EE" stroke="#FDBA74" stroke-width="2"/>
      <path d="M 12 34 Q 42 0 72 34 Z" fill="#EC4899"/>
      <circle cx="42" cy="5" r="7" fill="#FDE047"/>
      <polygon points="34,2 42,8 34,14" fill="#F43F5E"/>
      <polygon points="50,2 42,8 50,14" fill="#F43F5E"/>
      <path d="M 24 40 Q 32 46 38 40" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 46 40 Q 52 46 60 40" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="25" cy="48" r="6" fill="#FDA4AF"/>
      <circle cx="60" cy="48" r="6" fill="#FDA4AF"/>
      <ellipse cx="42" cy="52" rx="4" ry="2" fill="#E11D48"/>
      <rect x="12" y="110" width="60" height="24" rx="8" fill="#FFFFFF"/>
      <text x="42" y="127" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#BE185D" text-anchor="middle">GIÓ 3.0kg</text>
    </g>

    <!-- Baby 3: Bé Trời -->
    <g transform="translate(160, 0)">
      <rect x="0" y="40" width="85" height="130" rx="38" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
      <path d="M 5 60 Q 42 90 80 60" stroke="#D97706" stroke-width="2" fill="none"/>
      <circle cx="42" cy="40" r="34" fill="#FFF1EE" stroke="#FDBA74" stroke-width="2"/>
      <path d="M 12 34 Q 42 0 72 34 Z" fill="#F59E0B"/>
      <polygon points="34,2 42,10 50,2 46,12 38,12" fill="#FEF08A"/>
      <path d="M 24 40 Q 32 46 38 40" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 46 40 Q 52 46 60 40" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="25" cy="48" r="6" fill="#FDA4AF"/>
      <circle cx="60" cy="48" r="6" fill="#FDA4AF"/>
      <ellipse cx="42" cy="52" rx="4" ry="2" fill="#E11D48"/>
      <rect x="12" y="110" width="60" height="24" rx="8" fill="#FFFFFF"/>
      <text x="42" y="127" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#D97706" text-anchor="middle">TRỜI 3.0kg</text>
    </g>
  </g>

  <!-- DAD (ON HIS KNEES CRYING HAPPY TEARS) -->
  <g id="character-dad" transform="translate(485, 380)" filter="url(#shadow)">
    <path d="M 50 180 Q 20 280 40 340 L 150 340 Q 130 250 110 180 Z" fill="#3B82F6"/>
    <ellipse cx="25" cy="200" rx="16" ry="20" fill="#FED7AA" stroke="#D97706" stroke-width="2"/>
    <ellipse cx="32" cy="195" rx="14" ry="18" fill="#FED7AA" stroke="#D97706" stroke-width="2"/>

    <circle cx="80" cy="115" r="48" fill="url(#momSkin)"/>
    <path d="M 35 110 Q 75 55 125 105 Q 120 75 75 70 Q 40 85 35 110 Z" fill="#1E293B"/>

    <!-- Waterfall Anime Tears -->
    <path d="M 58 115 L 52 195 Q 56 205 60 195 L 66 115 Z" fill="#38BDF8" opacity="0.85"/>
    <path d="M 98 115 L 92 195 Q 96 205 100 195 L 106 115 Z" fill="#38BDF8" opacity="0.85"/>

    <ellipse cx="80" cy="138" rx="20" ry="14" fill="#BE123C"/>
    <ellipse cx="80" cy="144" rx="14" ry="7" fill="#FDA4AF"/>

    <rect x="-15" y="40" width="180" height="34" rx="17" fill="#FEF08A" stroke="#CA8A04" stroke-width="2.5"/>
    <text x="75" y="63" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="900" fill="#854D0E" text-anchor="middle">😭 VỢ LÀ NỮ THẦN! 🙏</text>
  </g>

  <!-- AIRLINE CAPTAIN -->
  <g id="character-captain" transform="translate(680, 150)" filter="url(#shadow)">
    <path d="M 60 150 L 15 360 L 225 360 L 180 150 Z" fill="url(#pilotSuit)"/>
    <polygon points="100,150 120,210 140,150" fill="#FFFFFF"/>
    <polygon points="115,165 125,165 128,260 120,280 112,260" fill="#F59E0B"/>

    <!-- 4 Captain Gold Stripes -->
    <rect x="42" y="152" width="38" height="18" rx="3" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
    <line x1="46" y1="156" x2="76" y2="156" stroke="#FDE047" stroke-width="2"/>
    <line x1="46" y1="160" x2="76" y2="160" stroke="#FDE047" stroke-width="2"/>
    <line x1="46" y1="164" x2="76" y2="164" stroke="#FDE047" stroke-width="2"/>
    <line x1="46" y1="168" x2="76" y2="168" stroke="#FDE047" stroke-width="2"/>

    <rect x="160" y="152" width="38" height="18" rx="3" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
    <line x1="164" y1="156" x2="194" y2="156" stroke="#FDE047" stroke-width="2"/>
    <line x1="164" y1="160" x2="194" y2="160" stroke="#FDE047" stroke-width="2"/>
    <line x1="164" y1="164" x2="194" y2="164" stroke="#FDE047" stroke-width="2"/>
    <line x1="164" y1="168" x2="194" y2="168" stroke="#FDE047" stroke-width="2"/>

    <!-- Captain's Face -->
    <circle cx="120" cy="95" r="46" fill="url(#momSkin)"/>
    <path d="M 90 78 Q 104 70 114 76" stroke="#0F172A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 126 76 Q 136 70 150 78" stroke="#0F172A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="102" cy="92" rx="7" ry="9" fill="#1E293B"/>
    <circle cx="104" cy="89" r="2.5" fill="#FFFFFF"/>
    <ellipse cx="138" cy="92" rx="7" ry="9" fill="#1E293B"/>
    <circle cx="140" cy="89" r="2.5" fill="#FFFFFF"/>
    <path d="M 108 114 Q 120 126 132 114" stroke="#BE123C" stroke-width="3" fill="#E11D48" stroke-linecap="round"/>

    <!-- Pilot Cap -->
    <path d="M 68 65 Q 120 20 172 65 Z" fill="#0F172A"/>
    <path d="M 62 65 Q 120 78 178 65 L 184 75 Q 120 90 56 75 Z" fill="#020617"/>
    <rect x="70" y="62" width="100" height="6" fill="#F59E0B"/>
    <circle cx="120" cy="46" r="10" fill="#FDE047"/>
    <polygon points="100,48 112,44 112,50" fill="#F59E0B"/>
    <polygon points="140,48 128,44 128,50" fill="#F59E0B"/>

    <!-- Captain's Arms -->
    <path d="M 60 170 Q 20 250 80 270" stroke="#0F172A" stroke-width="26" stroke-linecap="round" fill="none"/>
    <circle cx="80" cy="270" r="14" fill="#FED7AA"/>
    <path d="M 180 170 Q 220 250 160 270" stroke="#0F172A" stroke-width="26" stroke-linecap="round" fill="none"/>
    <circle cx="160" cy="270" r="14" fill="#FED7AA"/>
  </g>

  <!-- GIANT GOLDEN LIFETIME AIRLINE PASS -->
  <g id="lifetime-ticket" transform="translate(850, 310)" filter="url(#shadow)">
    <rect x="-8" y="-8" width="316" height="206" rx="20" fill="#FEF08A" opacity="0.6"/>
    <rect x="0" y="0" width="300" height="190" rx="16" fill="url(#goldTicket)" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="10" y="10" width="280" height="170" rx="12" fill="none" stroke="#78350F" stroke-width="2" stroke-dasharray="6,4"/>

    <text x="35" y="44" font-size="28">✈️</text>
    <text x="265" y="44" font-size="24" text-anchor="end">⭐⭐⭐</text>
    <text x="150" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#78350F" text-anchor="middle">
      GLOBAL AIRLINE LIFETIME PASS
    </text>

    <rect x="25" y="55" width="250" height="34" rx="8" fill="#78350F"/>
    <text x="150" y="78" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#FDE047" text-anchor="middle">
      🎫 VÉ BAY TRỌN ĐỜI 🎫
    </text>

    <text x="150" y="112" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#451A03" text-anchor="middle">
      Trao tặng: 3 "CÔNG DÂN BẦU TRỜI"
    </text>
    <text x="150" y="132" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#B45309" text-anchor="middle">
      👶 BÉ MÂY • 👶 BÉ GIÓ • 👶 BÉ TRỜI
    </text>

    <rect x="35" y="148" width="130" height="22" rx="4" fill="#FFFFFF"/>
    <line x1="45" y1="152" x2="45" y2="166" stroke="#000" stroke-width="3"/>
    <line x1="60" y1="152" x2="60" y2="166" stroke="#000" stroke-width="4"/>
    <line x1="72" y1="152" x2="72" y2="166" stroke="#000" stroke-width="2"/>
    <line x1="82" y1="152" x2="82" y2="166" stroke="#000" stroke-width="5"/>
    <line x1="95" y1="152" x2="95" y2="166" stroke="#000" stroke-width="2"/>
    <line x1="120" y1="152" x2="120" y2="166" stroke="#000" stroke-width="4"/>
    <line x1="148" y1="152" x2="148" y2="166" stroke="#000" stroke-width="3"/>

    <circle cx="230" cy="155" r="18" fill="#DC2626" opacity="0.85"/>
    <circle cx="230" cy="155" r="15" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="230" y="159" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">VIP PASS</text>
  </g>

  <!-- BIG SPEECH BUBBLE -->
  <g id="speech-bubble" transform="translate(320, 80)" filter="url(#shadow)">
    <rect x="0" y="0" width="560" height="96" rx="20" fill="#FFFFFF" stroke="#16A34A" stroke-width="4"/>
    <polygon points="460,96 490,125 440,96" fill="#FFFFFF"/>
    <path d="M 440 96 L 490 125 L 460 96" stroke="#16A34A" stroke-width="4"/>
    <line x1="440" y1="96" x2="460" y2="96" stroke="#FFFFFF" stroke-width="6"/>

    <text x="280" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#15803D" text-anchor="middle">
      👨‍✈️ CƠ TRƯỞNG &amp; BAN GIÁM ĐỐC HÃNG HÀNG KHÔNG:
    </text>
    <text x="280" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">
      “Chúc mừng kỳ tích! Chào đón 3 công dân đặc biệt sinh trên chín tầng mây!”
    </text>
    <text x="280" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#DC2626" text-anchor="middle">
      “HÃNG TẶNG VÉ MÁY BAY MIỄN PHÍ TRỌN ĐỜI CHO 3 BÉ TRÊN MỌI ĐƯỜNG BAY! ✈️🎁”
    </text>
  </g>
</svg>
