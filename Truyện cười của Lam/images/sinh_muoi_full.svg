      <rect x="0" y="30" width="315" height="180" rx="14" fill="#FEF08A" stroke="#F59E0B" stroke-width="2.5"/>
      <rect x="6" y="36" width="303" height="168" rx="10" fill="#FFFBEB"/>
      
      <!-- 5 Boys -->
      <text x="157" y="52" font-size="10" font-weight="bold" fill="#0284C7" text-anchor="middle">👦 5 BÉ TRAI KHÁU KHỈNH 👦</text>
      <g transform="translate(15, 60)"><circle cx="18" cy="18" r="11" fill="#FFEDD5"/><ellipse cx="18" cy="33" rx="13" ry="16" fill="#60A5FA"/></g>
      <g transform="translate(72, 60)"><circle cx="18" cy="18" r="11" fill="#FFEDD5"/><ellipse cx="18" cy="33" rx="13" ry="16" fill="#38BDF8"/></g>
      <g transform="translate(129, 60)"><circle cx="18" cy="18" r="11" fill="#FFEDD5"/><ellipse cx="18" cy="33" rx="13" ry="16" fill="#60A5FA"/></g>
      <g transform="translate(186, 60)"><circle cx="18" cy="18" r="11" fill="#FFEDD5"/><ellipse cx="18" cy="33" rx="13" ry="16" fill="#38BDF8"/></g>
      <g transform="translate(243, 60)"><circle cx="18" cy="18" r="11" fill="#FFEDD5"/><ellipse cx="18" cy="33" rx="13" ry="16" fill="#60A5FA"/></g>

      <!-- 5 Girls -->
      <text x="157" y="132" font-size="10" font-weight="bold" fill="#E11D48" text-anchor="middle">👧 5 BÉ GÁI XINH XẮN 👧</text>
      <g transform="translate(15, 140)"><circle cx="18" cy="18" r="11" fill="#FFEDD5"/><ellipse cx="18" cy="33" rx="13" ry="16" fill="#F472B6"/></g>
      <g transform="translate(72, 140)"><circle cx="18" cy="18" r="11" fill="#FFEDD5"/><ellipse cx="18" cy="33" rx="13" ry="16" fill="#FB7185"/></g>
      <g transform="translate(129, 140)"><circle cx="18" cy="18" r="11" fill="#FFEDD5"/><ellipse cx="18" cy="33" rx="13" ry="16" fill="#F472B6"/></g>
      <g transform="translate(186, 140)"><circle cx="18" cy="18" r="11" fill="#FFEDD5"/><ellipse cx="18" cy="33" rx="13" ry="16" fill="#FB7185"/></g>
      <g transform="translate(243, 140)"><circle cx="18" cy="18" r="11" fill="#FFEDD5"/><ellipse cx="18" cy="33" rx="13" ry="16" fill="#F472B6"/></g>
    </g>

    <!-- Family Clapping -->
    <g transform="translate(490, 140)">
      <text x="30" y="30" font-family="'Impact'" font-size="14" fill="#EF4444">BỐP!</text>
      <text x="80" y="20" font-family="'Impact'" font-size="14" fill="#F59E0B">HOAN HÔ!</text>
      <g transform="translate(10, 45)">
        <ellipse cx="30" cy="75" rx="18" ry="24" fill="#3B82F6"/>
        <circle cx="30" cy="35" r="18" fill="#FFEDD5"/>
        <text x="30" y="55" font-size="14" text-anchor="middle">👏</text>
      </g>
      <g transform="translate(65, 55)">
        <ellipse cx="25" cy="65" rx="15" ry="20" fill="#F43F5E"/>
        <circle cx="25" cy="30" r="15" fill="#FFEDD5"/>
      </g>
    </g>

    <!-- Speech 4 -->
    <g filter="url(#mShadow)">
      <path d="M380 25 Q380 5 470 5 L600 5 Q630 5 630 32 Q630 60 560 60 L520 60 L505 80 L510 60 L440 60 Q380 60 380 25 Z" fill="#FEFCE8" stroke="#EAB308" stroke-width="2.5"/>
      <text x="505" y="28" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#854D0E" text-anchor="middle">"HOAN HÔ MẸ SIÊU NHÂN! 👏🎉"</text>
      <text x="505" y="48" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#A16207" text-anchor="middle">"Kỷ lục 10 đứa: 5 trai 5 gái cưng xỉu!"</text>

      <path d="M30 25 Q30 5 100 5 L260 5 Q300 5 300 32 Q300 60 230 60 L170 60 L155 80 L160 60 L70 60 Q30 60 30 25 Z" fill="#FFF1F2" stroke="#F43F5E" stroke-width="2.5"/>
      <text x="165" y="28" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#BE123C" text-anchor="middle">"Bõ công mẹ hét rung nhà!"</text>
      <text x="165" y="48" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#9F1239" text-anchor="middle">"10 thiên thần chào cả nhà! 🥰"</text>
    </g>

    <rect x="15" y="12" width="290" height="26" rx="6" fill="#1E293B"/>
    <text x="160" y="29" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#FACC15" text-anchor="middle">CẢNH 4: HẠ SINH 10 BÉ (5 TRAI, 5 GÁI)</text>
    <rect x="15" y="385" width="610" height="30" rx="6" fill="#0F172A" opacity="0.85"/>
    <text x="320" y="405" font-family="'Segoe UI', sans-serif" font-size="12" fill="#F8FAFC" text-anchor="middle">Cả nhà vỡ òa hoan hô chúc mừng mẹ hạ sinh kỷ lục 10 bé gồm 5 trai và 5 gái siêu đáng yêu!</text>
  </g>
</svg>
