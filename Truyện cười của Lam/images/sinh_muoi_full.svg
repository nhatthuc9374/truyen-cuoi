<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 980" width="100%" height="100%">
  <defs>
    <linearGradient id="fullTitleBirth10" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#FB7185"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="mBg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/><stop offset="60%" stop-color="#1E293B"/><stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="mBg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2"/><stop offset="60%" stop-color="#FEE2E2"/><stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="mBg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/><stop offset="60%" stop-color="#DBEAFE"/><stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="mBg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3"/><stop offset="50%" stop-color="#FFF1F2"/><stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>

    <filter id="mShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1330" height="980" fill="#0F172A" rx="20"/>

  <!-- Comic Title Header -->
  <rect x="25" y="12" width="1280" height="50" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="665" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="url(#fullTitleBirth10)" text-anchor="middle" letter-spacing="2">
    🏥👶 TRUYỆN TRANH HÀI HƯỚC: CA SINH 10 KỶ LỤC CỦA MẸ 🎉
  </text>

  <!-- ==================== PANEL 1: XOA BỤNG BẦU TRONG CHĂN ==================== -->
  <g transform="translate(25, 75) scale(0.97)">
    <rect width="640" height="425" rx="12" fill="url(#mBg1)" stroke="#1E293B" stroke-width="3"/>
    
    <!-- Window with moon -->
    <rect x="35" y="45" width="80" height="95" rx="6" fill="#020617" stroke="#475569" stroke-width="2"/>
    <path d="M55 60 C55 50 63 46 70 48 C60 54 60 66 70 68 C63 70 55 66 55 60 Z" fill="#FDE047"/>

    <!-- Sleeping Mom in bed with huge bump under quilt -->
    <g transform="translate(150, 160)">
      <ellipse cx="65" cy="55" rx="40" ry="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
      <circle cx="70" cy="40" r="24" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
      <path d="M48 38 C42 15 95 15 92 38 Z" fill="#3B2005"/>
      <!-- Giant Bump under blue blanket -->
      <path d="M30 70 Q145 15 270 80 L280 170 L20 170 Z" fill="#38BDF8" stroke="#0284C7" stroke-width="3"/>
      <ellipse cx="160" cy="65" rx="72" ry="55" fill="#0284C7" stroke="#0369A1" stroke-width="2.5"/>
      <text x="85" y="25" font-family="'Comic Sans MS'" font-size="14" fill="#93C5FD">Zzz...</text>
    </g>

    <!-- Child gently rubbing belly -->
    <g transform="translate(350, 180)">
      <ellipse cx="45" cy="115" rx="22" ry="26" fill="#F43F5E"/>
      <circle cx="45" cy="60" r="20" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
      <path d="M30 100 Q5 90 -10 65" fill="none" stroke="#F43F5E" stroke-width="10" stroke-linecap="round"/>
      <circle cx="-10" cy="65" r="8" fill="#FFEDD5"/>
      <text x="-20" y="50" font-size="14">💖</text>
    </g>

    <!-- Speech 1 -->
    <g filter="url(#mShadow)">
      <path d="M220 30 Q220 10 300 10 L480 10 Q530 10 530 35 Q530 65 450 65 L370 65 L350 88 L355 65 L270 65 Q220 65 220 30 Z" fill="#F0F9FF" stroke="#0284C7" stroke-width="2.5"/>
      <text x="375" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#0369A1" text-anchor="middle">"Bụng mẹ to tròn dưới lớp chăn..."</text>
      <text x="375" y="52" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#0369A1" text-anchor="middle">"Con xoa xoa cho mẹ ngủ ngon nhé! ❤️"</text>
    </g>

    <rect x="15" y="12" width="280" height="26" rx="6" fill="#1E293B"/>
    <text x="155" y="29" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38BDF8" text-anchor="middle">CẢNH 1: XOA BỤNG BẦU TRONG CHĂN</text>
    <rect x="15" y="385" width="610" height="30" rx="6" fill="#0F172A" opacity="0.85"/>
    <text x="320" y="405" font-family="'Segoe UI', sans-serif" font-size="12" fill="#F8FAFC" text-anchor="middle">Đêm khuya, tôi ngồi bên giường nhẹ nhàng xoa bụng bầu to nhô cao dưới lớp chăn của mẹ...</text>
  </g>

  <!-- ==================== PANEL 2: BỐ GỌI CẤP CỨU ĐÊM KHUYA ==================== -->
  <g transform="translate(685, 75) scale(0.97)">
    <rect width="640" height="425" rx="12" fill="url(#mBg2)" stroke="#1E293B" stroke-width="3"/>
    
    <!-- Mom shrieking -->
    <g transform="translate(100, 110)">
      <ellipse cx="125" cy="130" rx="72" ry="60" fill="#FB7185" stroke="#DC2626" stroke-width="3.5"/>
      <path d="M65 115 L55 130 L68 135 L58 155" fill="none" stroke="#FBBF24" stroke-width="3.5"/>
      <path d="M195 110 L208 125 L195 130 L208 145" fill="none" stroke="#FBBF24" stroke-width="3.5"/>
      <circle cx="80" cy="40" r="26" fill="#FFEDD5" stroke="#1E293B" stroke-width="2.5"/>
      <ellipse cx="80" cy="54" rx="13" ry="16" fill="#991B1B"/>
    </g>

    <!-- Dad calling 115 -->
    <g transform="translate(420, 110)">
      <ellipse cx="60" cy="130" rx="30" ry="38" fill="#3B82F6"/>
      <circle cx="55" cy="55" r="25" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
      <rect x="75" y="45" width="16" height="30" rx="3" fill="#EF4444"/>
      <text x="83" y="63" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">115</text>
      <circle cx="48" cy="52" r="5" fill="#FFFFFF"/><circle cx="48" cy="52" r="2" fill="#1E293B"/>
      <circle cx="68" cy="52" r="5" fill="#FFFFFF"/><circle cx="68" cy="52" r="2" fill="#1E293B"/>
    </g>

    <!-- Speech 2 -->
    <g filter="url(#mShadow)">
      <path d="M40 25 L80 10 L105 20 L130 2 L160 20 L195 2 L205 25 L250 10 L240 40 L275 60 L245 80 L270 108 L230 105 L215 128 L190 108 L165 122 L155 100 L115 110 L122 88 L85 82 L105 60 Z" fill="#FEF2F2" stroke="#EF4444" stroke-width="3"/>
      <text x="170" y="45" font-family="'Impact', sans-serif" font-size="24" font-weight="900" fill="#DC2626" text-anchor="middle">Á Á Á ! ĐAU QUÁ !</text>
      <text x="170" y="68" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#991B1B" text-anchor="middle">"ÔI TRỜI ƠI... NÓ ĐÒI RA RỒI!"</text>

      <path d="M370 20 Q370 2 440 2 L600 2 Q630 2 630 28 Q630 58 550 58 L480 58 L465 80 L465 58 L420 58 Q370 58 370 20 Z" fill="#F0F9FF" stroke="#0284C7" stroke-width="2.5"/>
      <text x="500" y="24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#0369A1" text-anchor="middle">"A LÔ 115! CẤP CỨU KHẨN CẤP!"</text>
      <text x="500" y="44" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">"Vợ tôi chuyển dạ rồi! Cứu vợ tôi với!"</text>
    </g>

    <rect x="15" y="12" width="280" height="26" rx="6" fill="#1E293B"/>
    <text x="155" y="29" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#EF4444" text-anchor="middle">CẢNH 2: BỐ GỌI CẤP CỨU ĐÊM KHUYA</text>
    <rect x="15" y="385" width="610" height="30" rx="6" fill="#0F172A" opacity="0.85"/>
    <text x="320" y="405" font-family="'Segoe UI', sans-serif" font-size="12" fill="#F8FAFC" text-anchor="middle">Mẹ ôm chặt bụng hét toáng lên, cả nhà bật dậy trong đêm, bố hốt hoảng bấm 115 cấp cứu!</text>
  </g>

  <!-- ==================== PANEL 3: TIẾNG HÉT RUNG PHÒNG SINH ==================== -->
  <g transform="translate(25, 520) scale(0.97)">
    <rect width="640" height="425" rx="12" fill="url(#mBg3)" stroke="#1E293B" stroke-width="3"/>
    
    <!-- Lamp -->
    <ellipse cx="260" cy="80" rx="40" ry="16" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>
    <polygon points="230,90 120,330 380,330 290,90" fill="#FEF08A" opacity="0.25"/>

    <!-- Bed & Mom -->
    <rect x="110" y="230" width="330" height="30" rx="6" fill="#0284C7"/>
    <g transform="translate(130, 120)">
      <circle cx="65" cy="45" r="24" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
      <path d="M40 45 C35 15 95 15 92 45 Z" fill="#3B2005"/>
      <ellipse cx="65" cy="56" rx="13" ry="15" fill="#7F1D1D"/>
      <ellipse cx="175" cy="115" rx="62" ry="44" fill="#FDA4AF" stroke="#E11D48" stroke-width="2.5"/>
    </g>

    <!-- Child watching -->
    <g transform="translate(45, 175)">
      <circle cx="30" cy="40" r="17" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
      <circle cx="25" cy="38" r="3" fill="#1E293B"/><circle cx="35" cy="38" r="3" fill="#1E293B"/>
    </g>

    <!-- Scream 3 -->
    <g filter="url(#mShadow)">
      <path d="M100 25 L140 5 L160 20 L200 0 L230 22 L270 5 L290 25 L340 8 L330 40 L370 55 L330 75 L365 105 L325 98 L300 120 L275 95 L240 115 L225 92 L180 105 L185 78 L140 75 L160 50 Z" fill="#FEF2F2" stroke="#EF4444" stroke-width="3"/>
      <text x="240" y="45" font-family="'Impact', sans-serif" font-size="26" font-weight="900" fill="#DC2626" text-anchor="middle">Á Á Á ! HÉT RẤT TO !</text>
      <text x="240" y="70" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#991B1B" text-anchor="middle">"MẸ DỒN LỰC VƯỢT CẠN THẦN KỲ!"</text>

      <path d="M380 30 Q380 10 450 10 L590 10 Q630 10 630 35 Q630 65 560 65 L500 65 L485 85 L485 65 L420 65 Q380 65 380 30 Z" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
      <text x="505" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#047857" text-anchor="middle">"HÍT SÂU... CỐ LÊN CHỊ!"</text>
      <text x="505" y="52" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#065F46" text-anchor="middle">"Ra rồi... sao nhiều bé thế này!"</text>
    </g>

    <rect x="15" y="12" width="280" height="26" rx="6" fill="#1E293B"/>
    <text x="155" y="29" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#F87171" text-anchor="middle">CẢNH 3: TIẾNG HÉT RUNG PHÒNG SINH</text>
    <rect x="15" y="385" width="610" height="30" rx="6" fill="#0F172A" opacity="0.85"/>
    <text x="320" y="405" font-family="'Segoe UI', sans-serif" font-size="12" fill="#F8FAFC" text-anchor="middle">Trong phòng sinh, tôi thấy mẹ hét rất to, dũng cảm vượt cạn đưa các con chào đời!</text>
  </g>

  <!-- ==================== PANEL 4: HẠ SINH 10 BÉ (5 TRAI, 5 GÁI) ==================== -->
  <g transform="translate(685, 520) scale(0.97)">
    <rect width="640" height="425" rx="12" fill="url(#mBg4)" stroke="#1E293B" stroke-width="3"/>
    
    <!-- Bunting -->
    <path d="M20 45 Q160 70 300 50 T630 45" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <polygon points="50,50 70,80 90,53" fill="#EF4444"/>
    <polygon points="120,58 140,88 160,61" fill="#F59E0B"/>
    <polygon points="190,60 210,90 230,58" fill="#3B82F6"/>
    <polygon points="260,54 280,84 300,52" fill="#EC4899"/>
    <polygon points="330,50 350,80 370,49" fill="#8B5CF6"/>
    <polygon points="400,46 420,75 440,45" fill="#10B981"/>

    <!-- Mom in bed -->
