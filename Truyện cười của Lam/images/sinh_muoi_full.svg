      <circle cx="65" cy="48" r="24" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
      <path d="M40 44 C35 15 90 15 90 44 Z" fill="#3B2005"/>
      <path d="M54 48 Q60 42 66 48" fill="none" stroke="#1E293B" stroke-width="2"/>
      <path d="M72 48 Q78 42 84 48" fill="none" stroke="#1E293B" stroke-width="2"/>
      <path d="M62 56 Q66 62 70 56" fill="none" stroke="#E11D48" stroke-width="2"/>
