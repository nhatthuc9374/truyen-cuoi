<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bd1Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="65%" stop-color="#FFE4E6"/>
      <stop offset="65%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <filter id="shadow1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Khung tranh & Nền phòng khách -->
  <rect x="5" y="5" width="640" height="440" rx="16" fill="url(#bd1Bg)" stroke="#831843" stroke-width="4"/>

  <!-- Tiêu đề phân cảnh -->
  <rect x="25" y="20" width="340" height="36" rx="10" fill="#BE185D" filter="url(#shadow1)"/>
  <text x="195" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">🌟 CẢNH 1: BÀN ĂN DI ĐỘNG BÁ ĐẠO 🍿🧋</text>

  <!-- Sofa êm ái màu tím nhạt -->
  <path d="M 50 310 Q 50 220 120 220 L 480 220 Q 550 220 550 310 Z" fill="#DDD6FE" stroke="#7C3AED" stroke-width="3"/>
  <rect x="40" y="290" width="520" height="60" rx="15" fill="#C4B5FD" stroke="#6D28D9" stroke-width="3"/>

  <!-- Mẹ bầu nằm thư giãn ngửa lưng -->
  <!-- Đầu mẹ -->
  <circle cx="120" cy="210" r="32" fill="#FFE4E6" stroke="#1E293B" stroke-width="2.5"/>
  <!-- Tóc mẹ búi củ tỏi xinh xắn -->
  <circle cx="100" cy="175" r="16" fill="#451A03"/>
  <path d="M 90 205 C 90 170 150 170 150 205 Z" fill="#78350F"/>
  <!-- Mắt mẹ nhắm tít mỉm cười cực mãn nguyện -->
  <path d="M 115 208 Q 125 215 135 208" stroke="#1E293B" stroke-width="2.5" fill="none"/>
  <path d="M 115 200 Q 125 195 135 200" stroke="#1E293B" stroke-width="2" fill="none"/>
  <ellipse cx="112" cy="218" rx="6" ry="4" fill="#FB7185"/>
  <!-- Miệng mẹ đang ngậm ống hút -->
  <path d="M 130 222 Q 138 226 142 220" stroke="#E11D48" stroke-width="3" fill="none"/>

  <!-- CHIẾC BỤNG BẦU SIÊU TO KHỔNG LỒ (TRÒN VO NHƯ QUẢ CẦU) -->
  <ellipse cx="290" cy="245" rx="125" ry="105" fill="url(#bellyGrad)" stroke="#9D174D" stroke-width="4" filter="url(#shadow1)"/>
  
  <!-- Họa tiết váy bầu tim vàng -->
  <circle cx="230" cy="220" r="8" fill="#FDE047" opacity="0.8"/>
  <circle cx="340" cy="230" r="10" fill="#FDE047" opacity="0.8"/>
  <circle cx="280" cy="280" r="9" fill="#FDE047" opacity="0.8"/>
  <circle cx="310" cy="190" r="7" fill="#FDE047" opacity="0.8"/>

  <!-- KHAY THỨC ĂN BÁ ĐẠO TRÊN ĐỈNH BỤNG -->
  <!-- Khay gỗ -->
  <rect x="220" y="135" width="140" height="12" rx="4" fill="#B45309" stroke="#78350F" stroke-width="2"/>
  <!-- Đĩa bắp rang bơ vàng rực -->
  <path d="M 230 135 L 235 110 L 265 110 L 270 135 Z" fill="#FEF08A" stroke="#CA8A04" stroke-width="2"/>
  <circle cx="245" cy="105" r="7" fill="#FACC15"/>
  <circle cx="255" cy="103" r="6" fill="#FDE047"/>
  <circle cx="240" cy="108" r="5" fill="#EAB308"/>
  <circle cx="260" cy="107" r="5" fill="#FACC15"/>
  <text x="250" y="128" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" fill="#854D0E" text-anchor="middle">POPCORN</text>

  <!-- Ly trà sữa trân châu đang nảy lên do em bé đạp! -->
  <g transform="translate(300, 75)">
    <!-- Hiệu ứng nảy lò xo -->
    <path d="M 15 65 Q 20 58 15 52 Q 10 46 15 40" stroke="#F43F5E" stroke-width="3" fill="none"/>
    <text x="35" y="45" font-family="'Impact', sans-serif" font-size="12" fill="#E11D48">BỤP! ✨</text>
    <!-- Thân ly -->
    <polygon points="5,15 25,15 22,50 8,50" fill="#FED7AA" stroke="#EA580C" stroke-width="2"/>
    <!-- Nắp cầu & trân châu -->
    <ellipse cx="15" cy="15" rx="10" ry="4" fill="#FDBA74"/>
    <circle cx="11" cy="45" r="2.5" fill="#451A03"/><circle cx="16" cy="46" r="2.5" fill="#451A03"/><circle cx="18" cy="41" r="2.5" fill="#451A03"/>
    <!-- Ống hút dài nối sang miệng mẹ -->
    <path d="M 15 15 L 12 -5 Q 10 -20 -40 20 Q -90 60 -160 145" stroke="#EC4899" stroke-width="3.5" fill="none"/>
  </g>

  <!-- Đĩa hoa quả dưa hấu, nho trên bụng -->
  <ellipse cx="285" cy="133" rx="14" ry="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <path d="M 276 133 A 9 9 0 0 1 294 133 Z" fill="#EF4444"/>

  <!-- Em bé bên trong đạp lồi bàn chân nhỏ xíu qua lớp áo -->
  <ellipse cx="320" cy="205" rx="14" ry="10" fill="#BE185D" opacity="0.6"/>
  <text x="365" y="195" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#9D174D">Em bé đạp trợ lực! 🦶</text>

  <!-- Bố đứng bên cạnh chắp tay bái phục thán phục -->
  <g transform="translate(460, 160)">
    <!-- Đầu bố -->
    <circle cx="50" cy="40" r="25" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
    <!-- Tóc bố -->
    <path d="M 28 35 Q 50 15 72 35 Z" fill="#1E293B"/>
    <!-- Mắt bố lồi to kinh ngạc -->
    <ellipse cx="42" cy="38" rx="4" ry="6" fill="#1E293B"/>
    <ellipse cx="58" cy="38" rx="4" ry="6" fill="#1E293B"/>
    <!-- Miệng há hốc chữ O -->
    <ellipse cx="50" cy="52" rx="6" ry="8" fill="#7F1D1D"/>
    <!-- Mồ hôi vã ra -->
    <path d="M 72 30 Q 78 25 76 35 Z" fill="#38BDF8"/>
    <!-- Thân áo xanh -->
    <path d="M 30 65 L 70 65 L 75 140 L 25 140 Z" fill="#38BDF8" stroke="#0284C7" stroke-width="2"/>
    <!-- Hai tay chắp lạy thán phục -->
    <path d="M 25 85 L -5 80 L 15 95 Z" fill="#FFEDD5" stroke="#1E293B" stroke-width="1.5"/>
    <text x="50" y="160" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#0369A1" text-anchor="middle">Bố: "Vái lạy vợ iu! 🙏"</text>
  </g>

  <!-- Hộp thoại của mẹ -->
  <rect x="70" y="70" width="220" height="55" rx="12" fill="#FFFFFF" stroke="#E11D48" stroke-width="2" filter="url(#shadow1)"/>
  <polygon points="120,125 130,140 140,125" fill="#FFFFFF"/>
  <text x="180" y="92" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#BE185D" text-anchor="middle">"Bụng to thế này để đồ ăn</text>
  <text x="180" y="112" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#BE185D" text-anchor="middle">vừa tiện vừa êm ru anh ơi! 🥤✨"</text>

  <!-- Chú thích dưới đáy -->
  <rect x="25" y="390" width="600" height="40" rx="8" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.5"/>
  <text x="325" y="415" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#9D174D" text-anchor="middle">Bụng bầu vượt mặt biến thành bàn ăn thông minh kiêm bệ phóng trà sữa 8K!</text>
</svg>
