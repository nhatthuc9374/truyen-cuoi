      <path d="M210 115 L225 130 L212 135 L228 150" fill="none" stroke="#FBBF24" stroke-width="3.5"/>
      <!-- Screaming head -->
      <circle cx="85" cy="48" r="26" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
      <path d="M52 48 C45 10 120 10 118 48 Z" fill="#451A03"/>
      <path d="M68 40 L76 45 L68 50" fill="none" stroke="#1E293B" stroke-width="3"/>
      <path d="M102 40 L94 45 L102 50" fill="none" stroke="#1E293B" stroke-width="3"/>
      <ellipse cx="85" cy="62" rx="12" ry="16" fill="#991B1B"/>
    </g>

    <!-- Child panicking -->
    <g transform="translate(60, 180)">
      <circle cx="40" cy="35" r="20" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
      <circle cx="32" cy="30" r="6" fill="#FFFFFF"/><circle cx="32" cy="30" r="2" fill="#1E293B"/>
      <circle cx="48" cy="30" r="6" fill="#FFFFFF"/><circle cx="48" cy="30" r="2" fill="#1E293B"/>
      <ellipse cx="40" cy="45" rx="5" ry="7" fill="#991B1B"/>
