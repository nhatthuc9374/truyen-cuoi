      <stop offset="0%" stop-color="#E0F2FE"/><stop offset="65%" stop-color="#BAE6FD"/><stop offset="65%" stop-color="#E2E8F0"/><stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="sBg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2"/><stop offset="65%" stop-color="#FEE2E2"/><stop offset="65%" stop-color="#E2E8F0"/><stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="sBg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/><stop offset="60%" stop-color="#DBEAFE"/><stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="sBg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3"/><stop offset="50%" stop-color="#FFF1F2"/><stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>

    <filter id="sShadow" x="-3%" y="-3%" width="106%" height="106%">
