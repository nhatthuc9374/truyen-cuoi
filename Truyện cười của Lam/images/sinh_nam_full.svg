    </g>

    <rect x="15" y="12" width="220" height="26" rx="6" fill="#1E293B"/>
    <text x="125" y="29" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#EF4444" text-anchor="middle">CẢNH 2: CƠN ĐAU ĐỘT NGỘT</text>
    <rect x="15" y="385" width="610" height="30" rx="6" fill="#0F172A" opacity="0.85"/>
    <text x="320" y="405" font-family="'Segoe UI', sans-serif" font-size="12" fill="#F8FAFC" text-anchor="middle">Đang khám thì mẹ bỗng ôm bụng thét lên đau đớn, cả kíp trực lập tức chuyển vào phòng đẻ!</text>
  </g>

  <!-- ==================== PANEL 3: TIẾNG HÉT RUNG TRỜI ==================== -->
