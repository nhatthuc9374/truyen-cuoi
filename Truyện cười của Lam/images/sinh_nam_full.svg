    <!-- Speech 4 -->
    <g filter="url(#sShadow)">
      <path d="M380 25 Q380 8 460 8 L600 8 Q630 8 630 32 Q630 60 560 60 L520 60 L505 82 L510 60 L440 60 Q380 60 380 25 Z" fill="#FEFCE8" stroke="#EAB308" stroke-width="2.5"/>
      <text x="505" y="28" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="900" fill="#854D0E" text-anchor="middle">"OA! CON CÓ TẬN 5 ĐỨA EM!"</text>
      <text x="505" y="46" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#A16207" text-anchor="middle">"Bé nào cũng mỉm mỉn cưng xỉu! 💖"</text>

      <path d="M30 25 Q30 8 100 8 L280 8 Q320 8 320 32 Q320 60 240 60 L180 60 L160 82 L165 60 L80 60 Q30 60 30 25 Z" fill="#FFF1F2" stroke="#F43F5E" stroke-width="2.5"/>
      <text x="175" y="28" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="900" fill="#BE123C" text-anchor="middle">"Bõ công mẹ hét rung cả viện!"</text>
