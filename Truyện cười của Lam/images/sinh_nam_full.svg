        <ellipse cx="20" cy="55" rx="16" ry="22" fill="#FDE047"/>
        <circle cx="20" cy="30" r="14" fill="#FFEDD5"/>
        <circle cx="12" cy="34" r="3" fill="#FDA4AF"/><circle cx="28" cy="34" r="3" fill="#FDA4AF"/>
        <circle cx="20" cy="35" r="4" fill="#38BDF8"/>
      </g>
      <!-- B2 -->
      <g transform="translate(75, 35)">
        <ellipse cx="20" cy="58" rx="16" ry="22" fill="#60A5FA"/>
        <circle cx="20" cy="30" r="14" fill="#FFEDD5"/>
        <circle cx="16" cy="28" r="2" fill="#1E293B"/><circle cx="24" cy="28" r="2" fill="#1E293B"/>
