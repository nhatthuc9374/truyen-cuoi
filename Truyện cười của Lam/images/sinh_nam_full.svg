    <text x="320" y="405" font-family="'Segoe UI', sans-serif" font-size="12" fill="#F8FAFC" text-anchor="middle">Sau tiếng hét bão táp, mẹ hạ sinh thành công 5 thiên thần nhỏ mỉm mỉn siêu đáng yêu!</text>
