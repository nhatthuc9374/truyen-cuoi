      <text x="260" y="70" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#991B1B" text-anchor="middle">"ỐI DỒI ÔI... CỐ LÊN NÀO!"</text>

      <path d="M410 30 Q410 10 470 10 L590 10 Q630 10 630 35 Q630 65 560 65 L500 65 L485 85 L485 65 L440 65 Q410 65 410 30 Z" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
      <text x="520" y="32" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="900" fill="#047857" text-anchor="middle">"HÍT SÂU... RẶN MẠNH!"</text>
      <text x="520" y="50" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#065F46" text-anchor="middle">"Thấy đầu em bé rồi chị ơi!"</text>
    </g>

    <rect x="15" y="12" width="220" height="26" rx="6" fill="#1E293B"/>
    <text x="125" y="29" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#F87171" text-anchor="middle">CẢNH 3: TIẾNG HÉT RUNG TRỜI</text>
    <rect x="15" y="385" width="610" height="30" rx="6" fill="#0F172A" opacity="0.85"/>
    <text x="320" y="405" font-family="'Segoe UI', sans-serif" font-size="12" fill="#F8FAFC" text-anchor="middle">Vào phòng sinh, mẹ dồn hết sức hét ầm trời rung chuyển cả góc hành lang bệnh viện!</text>
  </g>

  <!-- ==================== PANEL 4: HẠ SINH 5 BÉ MỈM MỈN ==================== -->
  <g transform="translate(685, 520) scale(0.97)">
    <rect width="640" height="425" rx="12" fill="url(#sBg4)" stroke="#1E293B" stroke-width="3"/>
    
    <!-- Bunting -->
    <path d="M20 50 Q160 75 300 55 T630 50" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <polygon points="50,55 70,85 90,58" fill="#EF4444"/>
    <polygon points="120,62 140,90 160,65" fill="#F59E0B"/>
    <polygon points="190,66 210,95 230,66" fill="#10B981"/>
    <polygon points="260,65 280,95 300,62" fill="#3B82F6"/>
    <polygon points="330,58 350,88 370,56" fill="#EC4899"/>
    <polygon points="400,54 420,84 440,53" fill="#8B5CF6"/>

