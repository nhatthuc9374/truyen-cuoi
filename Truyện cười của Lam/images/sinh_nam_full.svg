      <text x="135" y="86" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#0369A1" text-anchor="middle">"Mẹ ơi cẩn thận nha!</text>
      <text x="135" y="104" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#0369A1" text-anchor="middle">Bụng mẹ hôm nay to quá trời!"</text>

      <path d="M300 25 Q300 5 380 5 L550 5 Q600 5 600 32 Q600 62 520 62 L450 62 L430 85 L435 62 L350 62 Q300 62 300 25 Z" fill="#FFF1F2" stroke="#F43F5E" stroke-width="2.5"/>
      <text x="450" y="28" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#9F1239" text-anchor="middle">"Mẹ con mình đi khám thai định kỳ thôi..."</text>
      <text x="450" y="48" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#9F1239" text-anchor="middle">"Bụng to thế này chắc em bé khỏe lắm! ❤️"</text>
    </g>

    <rect x="15" y="12" width="240" height="26" rx="6" fill="#1E293B"/>
    <text x="135" y="29" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38BDF8" text-anchor="middle">CẢNH 1: BỤNG BẦU SIÊU TO</text>
    <rect x="15" y="385" width="610" height="30" rx="6" fill="#0F172A" opacity="0.85"/>
    <text x="320" y="405" font-family="'Segoe UI', sans-serif" font-size="12" fill="#F8FAFC" text-anchor="middle">Tôi dắt mẹ với chiếc bụng bầu to vượt mặt vào bệnh viện khám thai định kỳ...</text>
  </g>

  <!-- ==================== PANEL 2: CƠN ĐAU ĐỘT NGỘT ==================== -->
  <g transform="translate(685, 75) scale(0.97)">
    <rect width="640" height="425" rx="12" fill="url(#sBg2)" stroke="#1E293B" stroke-width="3"/>
    
    <!-- Mom in pain -->
