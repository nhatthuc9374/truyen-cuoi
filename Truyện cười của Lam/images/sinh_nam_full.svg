      <circle cx="18" cy="40" r="7" fill="#FFEDD5"/><circle cx="52" cy="40" r="7" fill="#FFEDD5"/>
      <text x="27" y="44" font-size="10">🌀</text><text x="39" y="44" font-size="10">🌀</text>
