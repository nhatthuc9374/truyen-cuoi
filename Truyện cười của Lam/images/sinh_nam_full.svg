      <circle cx="52" cy="50" r="22" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
      <path d="M44 62 Q54 70 64 62 Z" fill="#DC2626"/>
    </g>

    <!-- Speech 2 -->
    <g filter="url(#sShadow)">
      <path d="M120 20 L160 8 L185 18 L210 0 L240 18 L275 0 L285 22 L330 8 L320 38 L355 58 L325 78 L350 105 L310 102 L295 125 L270 105 L245 120 L235 98 L195 108 L202 85 L165 80 L185 58 Z" fill="#FEF2F2" stroke="#EF4444" stroke-width="3"/>
      <text x="250" y="42" font-family="'Impact', sans-serif" font-size="22" font-weight="900" fill="#DC2626" text-anchor="middle">Á Á Á ! ĐAU QUÁ !</text>
      <text x="250" y="65" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#991B1B" text-anchor="middle">"NÓ ĐÒI RA RỒI BÁC SĨ ƠI!"</text>

