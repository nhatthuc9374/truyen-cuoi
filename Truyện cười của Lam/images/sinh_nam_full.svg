  <!-- Canvas Background -->
  <rect width="1330" height="980" fill="#0F172A" rx="20"/>

  <!-- Comic Title Header -->
  <rect x="25" y="12" width="1280" height="50" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="665" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="url(#fullTitleBirth)" text-anchor="middle" letter-spacing="2">
    🏥👶 TRUYỆN TRANH HÀI HƯỚC: CA SINH 5 BẤT NGỜ CỦA MẸ 🎉
  </text>

  <!-- ==================== PANEL 1: BỤNG BẦU SIÊU TO ==================== -->
  <g transform="translate(25, 75) scale(0.97)">
    <rect width="640" height="425" rx="12" fill="url(#sBg1)" stroke="#1E293B" stroke-width="3"/>
    
    <!-- Red Cross -->
    <rect x="530" y="45" width="70" height="55" rx="6" fill="#FFFFFF"/>
    <path d="M555 55 h20 v35 h-20 z" fill="#EF4444"/>
    <path d="M547 63 h36 v19 h-36 z" fill="#EF4444"/>

    <rect x="30" y="50" width="180" height="32" rx="6" fill="#0284C7"/>
    <text x="120" y="72" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🏥 KHOA KHÁM THAI</text>

    <!-- Child -->
    <g transform="translate(100, 190)">
      <ellipse cx="40" cy="65" rx="20" ry="24" fill="#38BDF8" stroke="#0284C7" stroke-width="2"/>
      <circle cx="40" cy="30" r="18" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
      <path d="M24 25 C22 8 58 8 56 25 Z" fill="#292524"/>
      <circle cx="34" cy="28" r="3" fill="#1E293B"/><circle cx="46" cy="28" r="3" fill="#1E293B"/>
      <path d="M35 38 Q40 44 45 38" fill="none" stroke="#DC2626" stroke-width="2"/>
    </g>

    <!-- Mom Huge Belly -->
    <g transform="translate(230, 100)">
      <ellipse cx="110" cy="190" rx="80" ry="12" fill="#000000" opacity="0.2"/>
      <path d="M60 80 Q90 60 120 80 L180 185 L30 185 Z" fill="#FDA4AF"/>
      <ellipse cx="140" cy="135" rx="72" ry="62" fill="#FB7185" stroke="#E11D48" stroke-width="3"/>
      <circle cx="85" cy="45" r="26" fill="#FFEDD5" stroke="#1E293B" stroke-width="2.5"/>
      <path d="M58 45 C55 15 115 15 112 45 Z" fill="#451A03"/>
