        <circle cx="22" cy="30" r="15" fill="#FFEDD5"/>
        <circle cx="13" cy="34" r="4" fill="#F43F5E"/><circle cx="31" cy="34" r="4" fill="#F43F5E"/>
        <text x="22" y="12" font-size="10" text-anchor="middle">👑</text>
      </g>
      <!-- B4 -->
      <g transform="translate(190, 35)">
        <ellipse cx="20" cy="58" rx="16" ry="22" fill="#4ADE80"/>
        <circle cx="20" cy="30" r="14" fill="#FFEDD5"/>
        <circle cx="20" cy="34" r="3" fill="#991B1B"/>
      </g>
      <!-- B5 -->
      <g transform="translate(245, 38)">
        <ellipse cx="20" cy="55" rx="16" ry="22" fill="#C084FC"/>
        <circle cx="20" cy="30" r="14" fill="#FFEDD5"/>
        <circle cx="12" cy="34" r="3" fill="#FDA4AF"/><circle cx="28" cy="34" r="3" fill="#FDA4AF"/>
      </g>

      <rect x="80" y="122" width="160" height="22" rx="5" fill="#F59E0B"/>
      <text x="160" y="137" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">5 THIÊN THẦN MỈM MỈN 💖</text>
