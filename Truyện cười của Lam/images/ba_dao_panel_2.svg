<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bd2Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="65%" stop-color="#FEE2E2"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="bellyGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Khung tranh & Nền siêu thị -->
  <rect x="5" y="5" width="640" height="440" rx="16" fill="url(#bd2Bg)" stroke="#991B1B" stroke-width="4"/>

  <!-- Tiêu đề phân cảnh -->
  <rect x="25" y="20" width="340" height="36" rx="10" fill="#DC2626" filter="url(#shadow2)"/>
  <text x="195" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">⚡ CẢNH 2: TUYỆT KỸ BỤNG BẦU DỘI LỰC 💥🥋</text>

  <!-- Kệ hàng siêu thị phía sau -->
  <rect x="40" y="90" width="140" height="180" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <rect x="50" y="110" width="120" height="30" rx="3" fill="#BAE6FD"/><text x="110" y="130" font-size="11" font-weight="bold" fill="#0369A1" text-anchor="middle">SỮA BỘT MEIJI</text>
  <rect x="50" y="150" width="120" height="30" rx="3" fill="#FED7AA"/><text x="110" y="170" font-size="11" font-weight="bold" fill="#C2410C" text-anchor="middle">BỈM HUGGIES XXL</text>
  <rect x="50" y="190" width="120" height="30" rx="3" fill="#BBF7D0"/><text x="110" y="210" font-size="11" font-weight="bold" fill="#15803D" text-anchor="middle">KHĂN ƯỚT EM BÉ</text>

  <!-- MẸ BẦU HIÊN NGANG ĐỨNG CHỐNG NẠNH ƯỠN BỤNG CHIẾN ĐẤU -->
  <g id="me-bau-chien-dau" transform="translate(180, 100)">
    <!-- Đầu mẹ đeo kính râm cực ngầu -->
    <circle cx="65" cy="50" r="28" fill="#FFE4E6" stroke="#1E293B" stroke-width="2.5"/>
    <path d="M 40 45 C 40 15 90 15 90 45 Z" fill="#451A03"/>
    <!-- Kính râm đen ngầu lòi -->
    <rect x="48" y="42" width="16" height="10" rx="2" fill="#1E293B"/>
    <rect x="68" y="42" width="16" height="10" rx="2" fill="#1E293B"/>
    <line x1="64" y1="47" x2="68" y2="47" stroke="#1E293B" stroke-width="2"/>
    <!-- Miệng nhếch mép tự tin -->
    <path d="M 60 68 Q 70 72 75 65" stroke="#BE123C" stroke-width="2.5" fill="none"/>

    <!-- Thân váy bầu -->
    <path d="M 45 78 L 85 78 L 95 130 L 35 130 Z" fill="#FB7185"/>

    <!-- CHIẾC BỤNG BẦU SIÊU TO KHỔNG LỒ ƯỠN VỀ PHÍA TRƯỚC LÀM KHIÊN CHẮN -->
    <ellipse cx="120" cy="140" rx="100" ry="85" fill="url(#bellyGrad2)" stroke="#881337" stroke-width="4" filter="url(#shadow2)"/>
    <!-- Sóng xung kích bao quanh bụng bầu -->
    <circle cx="120" cy="140" r="110" stroke="#FDE047" stroke-width="4" stroke-dasharray="8 8" fill="none" opacity="0.8"/>
    <text x="120" y="145" font-family="'Impact', sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">KHIÊN HỘ THỂ 🛡️</text>

    <!-- Hai tay chống nạnh quyền lực -->
    <path d="M 45 85 Q 15 110 35 125" stroke="#FB7185" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="35" cy="125" r="7" fill="#FFE4E6"/>
  </g>

  <!-- HIỆU ỨNG BOINGGG NẢY BẬT TÊN CƯỚP -->
  <g transform="translate(370, 80)">
    <!-- Chữ BOINGGG khổng lồ màu vàng viền đỏ -->
    <text x="40" y="80" font-family="'Impact', sans-serif" font-size="42" fill="#FACC15" stroke="#DC2626" stroke-width="2" transform="rotate(-15)">BOINGGG! 💥</text>
    <!-- Tia năng lượng dội ngược -->
    <line x1="20" y1="90" x2="80" y2="120" stroke="#EF4444" stroke-width="4"/>
    <line x1="10" y1="120" x2="70" y2="150" stroke="#EF4444" stroke-width="4"/>
    <line x1="30" y1="70" x2="90" y2="90" stroke="#EF4444" stroke-width="4"/>

    <!-- TÊN CƯỚP ÁO SỌC BỊ BẬT NGƯỢC BAY TRÊN KHÔNG TRUNG -->
    <g transform="translate(100, 70) rotate(35)">
      <!-- Đầu tên cướp xoay mòng mòng sao vàng -->
      <circle cx="40" cy="30" r="22" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
      <ellipse cx="32" cy="28" rx="5" ry="3" fill="#1E293B" transform="rotate(45 32 28)"/>
      <ellipse cx="48" cy="28" rx="5" ry="3" fill="#1E293B" transform="rotate(-45 48 28)"/>
      <path d="M 32 42 Q 40 32 48 42" stroke="#1E293B" stroke-width="2.5" fill="none"/>
      <!-- Nón len trộm rơi khỏi đầu -->
      <path d="M 15 15 Q 40 -5 65 15 Z" fill="#334155"/>
      <!-- Sao xoay quanh đầu -->
      <text x="25" y="0" font-size="16">💫 ⭐ 😵</text>

      <!-- Áo tù sọc đen trắng -->
      <rect x="20" y="52" width="40" height="50" rx="5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
      <line x1="20" y1="65" x2="60" y2="65" stroke="#1E293B" stroke-width="4"/>
      <line x1="20" y1="80" x2="60" y2="80" stroke="#1E293B" stroke-width="4"/>
      <line x1="20" y1="95" x2="60" y2="95" stroke="#1E293B" stroke-width="4"/>

      <!-- Tay chân giãy giụa văng túi xách -->
      <line x1="20" y1="60" x2="-10" y2="40" stroke="#FFEDD5" stroke-width="8" stroke-linecap="round"/>
      <line x1="60" y1="60" x2="90" y2="40" stroke="#FFEDD5" stroke-width="8" stroke-linecap="round"/>
      <!-- Túi xách phụ nữ văng ra -->
      <rect x="95" y="25" width="22" height="18" rx="4" fill="#EC4899" stroke="#9D174D" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Khách siêu thị và bảo vệ vỗ tay hoan hô -->
  <g transform="translate(480, 250)">
    <!-- Bác bảo vệ giơ 2 ngón cái -->
    <circle cx="50" cy="40" r="20" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
    <path d="M 30 35 L 70 35 L 65 25 L 35 25 Z" fill="#1E3A8A"/>
    <text x="50" y="32" font-size="7" fill="#FFFFFF" font-weight="bold" text-anchor="middle">SECURITY</text>
    <ellipse cx="44" cy="40" rx="2.5" ry="3" fill="#1E293B"/><ellipse cx="56" cy="40" rx="2.5" ry="3" fill="#1E293B"/>
    <path d="M 45 48 Q 50 54 55 48" stroke="#1E293B" stroke-width="2" fill="none"/>
    <rect x="35" y="60" width="30" height="40" rx="4" fill="#1D4ED8"/>
    <text x="50" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1E40AF" text-anchor="middle">"10 điểm công lực! 👏"</text>
  </g>

  <!-- Chú thích dưới đáy -->
  <rect x="25" y="390" width="600" height="40" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="325" y="415" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#991B1B" text-anchor="middle">Cú tông trúng bụng bầu đàn hồi cao cấp khiến tên cướp bay ngược 5 mét!</text>
</svg>
