<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <defs>
    <linearGradient id="wallBg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="65%" stop-color="#FEE2E2"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="stuckGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#EF4444" flood-opacity="0.5"/>
    </filter>
    <filter id="dropShadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Panel Border & Background -->
  <rect x="5" y="5" width="640" height="440" rx="16" fill="url(#wallBg2)" stroke="#1E293B" stroke-width="4"/>

  <!-- Speed / Panic Shocklines -->
  <g stroke="#EF4444" stroke-width="2" opacity="0.4" stroke-dasharray="6 4">
    <line x1="280" y1="210" x2="30" y2="40"/>
    <line x1="280" y1="210" x2="160" y2="20"/>
    <line x1="280" y1="210" x2="480" y2="30"/>
    <line x1="280" y1="210" x2="610" y2="80"/>
  </g>

  <!-- Floor separator line -->
  <line x1="5" y1="292" x2="645" y2="292" stroke="#94A3B8" stroke-width="2"/>

  <!-- Teacher Desk on Right of Teacher -->
  <g id="teacher-desk-jam" transform="translate(320, 195)">
    <rect x="15" y="25" width="95" height="15" rx="3" fill="#B45309" stroke="#451A03" stroke-width="2.5"/>
    <rect x="20" y="40" width="12" height="75" fill="#92400E"/>
    <rect x="90" y="40" width="12" height="75" fill="#92400E"/>
  </g>

  <!-- The Wooden Chair Trapping Teacher's Belly on Left -->
  <g id="chair-jam" transform="translate(145, 180)">
    <!-- Shadow -->
    <ellipse cx="40" cy="120" rx="45" ry="12" fill="#000000" opacity="0.25"/>
    <!-- Chair Seat -->
    <rect x="5" y="45" width="70" height="12" rx="3" fill="#9A3412" stroke="#431407" stroke-width="2.5"/>
    <!-- Chair Legs -->
    <rect x="10" y="57" width="10" height="60" fill="#7C2D12"/>
    <rect x="55" y="57" width="10" height="60" fill="#7C2D12"/>
    <!-- Backrest Posts -->
    <rect x="55" y="-30" width="12" height="80" rx="3" fill="#9A3412" stroke="#431407" stroke-width="2.5"/>
    <rect x="5" y="-30" width="12" height="80" rx="3" fill="#9A3412" stroke="#431407" stroke-width="2.5"/>
    <rect x="5" y="-25" width="62" height="14" rx="2" fill="#B45309" stroke="#431407" stroke-width="2"/>
    <!-- Armrest protruding toward belly -->
    <path d="M12 15 Q40 5 65 15" fill="none" stroke="#7C2D12" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Teacher STUCK & WEDGED Between Chair & Desk! -->
  <g id="teacher-stuck" transform="translate(200, 110)">
    <!-- Shadow -->
    <ellipse cx="85" cy="205" rx="65" ry="14" fill="#000000" opacity="0.2"/>

    <!-- Dress twisted/wedged -->
    <path d="M45 75 Q75 60 100 75 L145 200 L20 200 Z" fill="#FDA4AF" stroke="#E11D48" stroke-width="2.5"/>

    <!-- GIANT BELLY JAMMED TIGHT! -->
    <ellipse cx="105" cy="145" rx="72" ry="60" fill="#FB7185" stroke="#DC2626" stroke-width="3.5" filter="url(#stuckGlow)"/>

    <!-- Jam Sparks / Lightning around trapped belly -->
    <path d="M25 125 L12 140 L28 145 L15 165" fill="none" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
    <path d="M175 120 L190 135 L175 140 L192 155" fill="none" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
    <!-- Stuck "SQUEEZE" Lines on the belly sides -->
    <path d="M35 115 Q45 145 35 175" fill="none" stroke="#E11D48" stroke-width="3" stroke-dasharray="4 3"/>
    <path d="M170 120 Q160 145 170 170" fill="none" stroke="#E11D48" stroke-width="3" stroke-dasharray="4 3"/>

    <!-- Teacher Hands frantically holding the belly & trying to push chair away -->
    <path d="M45 80 Q10 120 30 140" fill="none" stroke="#FDA4AF" stroke-width="14" stroke-linecap="round"/>
    <circle cx="30" cy="140" r="10" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
    <path d="M95 80 Q145 110 130 140" fill="none" stroke="#FDA4AF" stroke-width="14" stroke-linecap="round"/>
    <circle cx="130" cy="140" r="10" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>

    <!-- Teacher Head with Flustered / Shocked Expression -->
    <circle cx="75" cy="42" r="26" fill="#FFEDD5" stroke="#1E293B" stroke-width="2.5"/>
    <circle cx="75" cy="18" r="12" fill="#3B2005"/>
    <path d="M48 42 C45 15 105 15 102 42 Z" fill="#3B2005"/>

    <!-- Crooked glasses -->
    <rect x="61" y="36" width="11" height="8" rx="1.5" fill="none" stroke="#DC2626" stroke-width="2" transform="rotate(-8 66 40)"/>
    <rect x="77" y="34" width="11" height="8" rx="1.5" fill="none" stroke="#DC2626" stroke-width="2" transform="rotate(-8 82 38)"/>

    <!-- Wide panicked eyes & huge sweat drops -->
    <circle cx="66" cy="40" r="3.5" fill="#1E293B"/>
    <circle cx="82" cy="38" r="3.5" fill="#1E293B"/>
    <ellipse cx="74" cy="54" rx="7" ry="9" fill="#991B1B"/> <!-- O-shaped shout -->
    <text x="35" y="25" font-size="18">💦</text>
    <text x="105" y="22" font-size="18">💦</text>
  </g>

  <!-- Big Comic SQUEEZE Banner -->
  <g filter="url(#dropShadow2)">
    <rect x="195" y="100" width="150" height="28" rx="6" fill="#EF4444"/>
    <text x="270" y="119" font-family="'Impact', Arial Black, sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" letter-spacing="1">⚡ KẸT CỨNG NGẮC! ⚡</text>
  </g>

  <!-- Bewildered Students in Background (Right side, sitting with '?') -->
  <g id="students-confused" transform="translate(450, 190)">
    <!-- Desk -->
    <rect x="10" y="55" width="160" height="15" rx="3" fill="#D97706" stroke="#451A03" stroke-width="2"/>
    <rect x="15" y="70" width="10" height="50" fill="#B45309"/>
    <rect x="155" y="70" width="10" height="50" fill="#B45309"/>

    <!-- Student 1 (Front desk) looking closely with curiosity -->
    <g transform="translate(20, 20)">
      <ellipse cx="25" cy="40" rx="18" ry="20" fill="#38BDF8" stroke="#0284C7" stroke-width="2"/>
      <circle cx="25" cy="15" r="16" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
      <path d="M12 12 C10 -5 40 -5 38 12 Z" fill="#1E293B"/>
      <!-- Big curious eyes noticing cô is stuck -->
      <circle cx="20" cy="15" r="2.5" fill="#1E293B"/><circle cx="29" cy="15" r="2.5" fill="#1E293B"/>
      <path d="M22 24 Q25 28 28 24" fill="none" stroke="#DC2626" stroke-width="1.5"/>
      <text x="42" y="8" font-size="16" font-weight="bold" fill="#F59E0B">💡</text>
    </g>

    <!-- Student 2 & 3 in background with huge question marks -->
    <g transform="translate(90, 15)">
      <ellipse cx="25" cy="42" rx="16" ry="20" fill="#A855F7" stroke="#7E22CE" stroke-width="2"/>
      <circle cx="25" cy="18" r="15" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
      <path d="M14 15 C12 -2 38 -2 36 15 Z" fill="#451A03"/>
      <!-- Puzzled face -->
      <circle cx="21" cy="18" r="2" fill="#1E293B"/><circle cx="29" cy="18" r="2" fill="#1E293B"/>
      <text x="35" y="5" font-size="18" font-weight="900" fill="#0284C7">?</text>
    </g>
  </g>

  <!-- Speech Bubble: Teacher Screaming / Stunned -->
  <g filter="url(#dropShadow2)">
    <path d="M100 15 
             L140 2 L160 14 L185 0 L215 15 L245 0 L255 18 L290 5 L285 30 L320 45 L295 62 L315 85 L280 82 L265 105 L245 85 L225 100 L215 80 L180 90 L185 70 L150 68 L165 48 Z" 
          fill="#FFF1F2" stroke="#EF4444" stroke-width="3"/>
    <text x="210" y="35" font-family="'Impact', Arial Black, sans-serif" font-size="16" font-weight="900" fill="#DC2626" text-anchor="middle">ÚI TRỜI ƠI !</text>
    <text x="210" y="55" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#991B1B" text-anchor="middle">"Kẹt bụng bầu rồi! Không nhúc nhích được!"</text>
  </g>

  <!-- Speech Bubble: Confused Students -->
  <g filter="url(#dropShadow2)">
    <path d="M420 100 Q420 80 480 80 L600 80 Q630 80 630 105 Q630 130 560 130 L520 130 L505 150 L510 130 L450 130 Q420 130 420 100 Z" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
    <text x="525" y="102" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#0369A1" text-anchor="middle">"Ủa cô sao vậy ta?"</text>
    <text x="525" y="120" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#0F172A" text-anchor="middle">"Hình như cô vướng cái gì rồi?!"</text>
  </g>

  <!-- Panel Header Banner -->
  <rect x="20" y="16" width="300" height="32" rx="8" fill="#1E293B"/>
  <text x="170" y="37" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#EF4444" text-anchor="middle">★ CẢNH 2: XOAY NGƯỜI BỊ KẸT BỤNG BẦU!</text>

  <!-- Caption at bottom -->
  <rect x="25" y="402" width="600" height="34" rx="8" fill="#0F172A" opacity="0.85"/>
  <text x="325" y="424" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#F8FAFC" text-anchor="middle">Vừa xoay người lách qua bàn thì chiếc bụng to kẹt cứng ngắc vào ghế, học sinh còn ngơ ngác...</text>
</svg>
