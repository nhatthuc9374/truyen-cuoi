<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <defs>
    <!-- Background wall and floor gradients -->
    <linearGradient id="wallP2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="68%" stop-color="#FEE2E2"/>
      <stop offset="68%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Desk wood gradient -->
    <linearGradient id="deskWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Belly sphere gradient -->
    <radialGradient id="bellyP2" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="45%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </radialGradient>

    <filter id="shadowP2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Panel Border & Background -->
  <rect x="5" y="5" width="640" height="440" rx="16" fill="url(#wallP2)" stroke="#1E293B" stroke-width="4"/>

  <!-- Classroom Floor & Tiles -->
  <line x1="5" y1="305" x2="645" y2="305" stroke="#94A3B8" stroke-width="2"/>
  <line x1="100" y1="305" x2="40" y2="445" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="260" y1="305" x2="200" y2="445" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="420" y1="305" x2="380" y2="445" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Blackboard on wall (Left corner) with half-finished poem -->
  <rect x="25" y="55" width="220" height="120" rx="6" fill="#065F46" stroke="#854D0E" stroke-width="4"/>
  <text x="135" y="80" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#FDE047" text-anchor="middle">TIẾT TẬP ĐỌC</text>
  <text x="45" y="108" font-family="'Segoe UI', cursive, sans-serif" font-size="13" fill="#FFFFFF">"Gió heo may se lạnh..."</text>
  <text x="45" y="132" font-family="'Segoe UI', cursive, sans-serif" font-size="13" fill="#FEF08A">"Tiếng trống trư..." [Rơi phấn!]</text>
  <!-- Chalk drop trajectory dashed curve -->
  <path d="M190 135 Q220 180 250 260 T310 325" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="235" y="210" font-size="11" font-weight="bold" fill="#DC2626">Cạch!</text>
  <text x="270" y="270" font-size="11" font-weight="bold" fill="#DC2626">Lăn tít...</text>

  <!-- Large Teacher's Wooden Desk (Right/Center) with hollow under-desk space -->
  <g id="teacher-desk" transform="translate(310, 180)">
    <!-- Desk shadow -->
    <rect x="-10" y="125" width="290" height="20" rx="6" fill="#000000" opacity="0.18"/>

    <!-- Desk top wooden slab -->
    <rect x="-15" y="0" width="280" height="24" rx="4" fill="url(#deskWood)" stroke="#451A03" stroke-width="2.5"/>

    <!-- Left and right thick wooden legs & back modesty board -->
    <rect x="-10" y="24" width="24" height="110" fill="#92400E" stroke="#451A03" stroke-width="2"/>
    <rect x="240" y="24" width="24" height="110" fill="#92400E" stroke="#451A03" stroke-width="2"/>
    <rect x="14" y="24" width="226" height="50" fill="#78350F" opacity="0.95"/>

    <!-- Under-desk dark cavity (GẦM BÀN) -->
    <rect x="14" y="74" width="226" height="60" fill="#1E1B4B" opacity="0.25"/>

    <!-- THE FALLEN CHALK DEEP UNDER DESK -->
    <g transform="translate(90, 122)">
      <!-- Glow halo -->
      <ellipse cx="12" cy="4" rx="20" ry="10" fill="#FEF08A" opacity="0.6"/>
      <!-- Chalk stick -->
      <rect x="0" y="0" width="22" height="7" rx="2" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.2" transform="rotate(8)"/>
      <text x="12" y="-6" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#DC2626" text-anchor="middle">⚡ Viên phấn ở đây!</text>
      <!-- Arrow pointing to chalk -->
      <path d="M12 -2 L12 2" stroke="#DC2626" stroke-width="2"/>
    </g>

    <!-- Books and pen cup on desk top -->
    <rect x="180" y="-12" width="36" height="12" rx="2" fill="#3B82F6"/>
    <rect x="184" y="-20" width="30" height="8" rx="2" fill="#10B981"/>
    <rect x="40" y="-18" width="16" height="18" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
    <line x1="45" y1="-23" x2="48" y2="-18" stroke="#EF4444" stroke-width="2"/>
  </g>

  <!-- TEACHER TRYING TO BEND DOWN - HILARIOUS BUMP OBSTRUCTION! -->
  <g id="bending-teacher" transform="translate(130, 125)">
    <!-- Floor shadow under teacher -->
    <ellipse cx="90" cy="195" rx="75" ry="14" fill="#000000" opacity="0.2"/>

    <!-- Left hand bracing against the desk edge -->
    <path d="M110 90 L165 60" stroke="#FBCFE8" stroke-width="14" stroke-linecap="round"/>
    <circle cx="165" cy="60" r="9" fill="#FED7AA" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Bent Legs with knees bent forward -->
    <g id="bent-legs">
      <!-- Thighs angled forward -->
      <path d="M60 140 L90 170 L75 200" stroke="#FBCFE8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M85 140 L115 170 L105 200" stroke="#FBCFE8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Pink shoes -->
      <ellipse cx="70" cy="202" rx="14" ry="7" fill="#F43F5E"/>
      <ellipse cx="102" cy="202" rx="14" ry="7" fill="#F43F5E"/>
    </g>

    <!-- Bent Maternity Dress Torso -->
    <path d="M45 40 Q75 35 105 45 L95 145 L40 145 Z" fill="#FBCFE8" stroke="#F43F5E" stroke-width="2"/>

    <!-- HUGE BABY BUMP PROTRUDING FORWARD & JAMMED HARD AGAINST KNEES! -->
    <!-- Belly hits knees at cx=120, cy=115 -->
    <ellipse cx="120" cy="115" rx="68" ry="58" fill="url(#bellyP2)" stroke="#E11D48" stroke-width="3"/>
    <!-- Highlight shine on belly -->
    <path d="M85 90 Q120 75 155 100" stroke="#FFF1F2" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round"/>

    <!-- CONTACT POINT / "CẤN ĐẦU GỐI" Comic visual emphasis -->
    <g transform="translate(145, 140)">
      <circle cx="0" cy="0" r="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" stroke-dasharray="3,2"/>
      <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#DC2626" text-anchor="middle">CẤN!</text>
      <line x1="-18" y1="-8" x2="-8" y2="-2" stroke="#EF4444" stroke-width="2"/>
      <line x1="18" y1="-8" x2="8" y2="-2" stroke="#EF4444" stroke-width="2"/>
    </g>

    <!-- Right Arm DESPERATELY STRETCHING DOWNWARDS toward the floor -->
    <g id="stretching-arm">
      <path d="M70 65 Q110 110 135 160 L150 178" fill="none" stroke="#FBCFE8" stroke-width="14" stroke-linecap="round"/>
      <circle cx="150" cy="178" r="9" fill="#FED7AA" stroke="#1E293B" stroke-width="1.8"/>
      <!-- Fingers wiggling hopelessly in mid-air -->
      <line x1="150" y1="178" x2="160" y2="188" stroke="#FED7AA" stroke-width="3" stroke-linecap="round"/>
      <line x1="153" y1="176" x2="164" y2="183" stroke="#FED7AA" stroke-width="3" stroke-linecap="round"/>
      <line x1="147" y1="180" x2="155" y2="192" stroke="#FED7AA" stroke-width="3" stroke-linecap="round"/>

      <!-- Measurement showing gap to floor! -->
      <line x1="168" y1="188" x2="168" y2="202" stroke="#EF4444" stroke-width="2"/>
      <line x1="163" y1="188" x2="173" y2="188" stroke="#EF4444" stroke-width="1.5"/>
      <line x1="163" y1="202" x2="173" y2="202" stroke="#EF4444" stroke-width="1.5"/>
      <text x="180" y="198" font-size="10" font-weight="bold" fill="#EF4444">1 gang tay!</text>
    </g>

    <!-- Head & Hilarious Straining Face -->
    <g id="teacher-face" transform="translate(42, 20)">
      <circle cx="20" cy="20" r="24" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5"/>
      <!-- Hair bun -->
      <circle cx="15" cy="-2" r="12" fill="#3B2005"/>
      <path d="-2 18 C-4 -5 45 -5 42 18 Z" fill="#3B2005"/>
      <!-- Glasses tilted comically -->
      <rect x="10" y="14" width="10" height="7" rx="2" fill="none" stroke="#DC2626" stroke-width="1.6" transform="rotate(-10 15 17)"/>
      <rect x="24" y="16" width="10" height="7" rx="2" fill="none" stroke="#DC2626" stroke-width="1.6" transform="rotate(-10 29 19)"/>
      <!-- Straining, embarrassed eyes (> <) -->
      <path d="M12 18 L18 20 L12 22" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
      <path d="M30 20 L24 22 L30 24" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
      <!-- Blushing red cheeks -->
      <ellipse cx="8" cy="27" rx="6" ry="4" fill="#F87171" opacity="0.85"/>
      <ellipse cx="32" cy="29" rx="6" ry="4" fill="#F87171" opacity="0.85"/>
      <!-- Helpless open mouth -->
      <ellipse cx="20" cy="32" rx="6" ry="4" fill="#991B1B"/>
      <!-- Sweat drops flying off! -->
      <text x="-12" y="10" font-size="16">💦</text>
      <text x="36" y="5" font-size="16">💦</text>
      <text x="38" y="35" font-size="14">😅</text>
    </g>
  </g>

  <!-- Large Comic Speech Bubble: Teacher -->
  <g filter="url(#shadowP2)">
    <path d="M170 18 Q170 0 240 0 L570 0 Q590 0 590 22 L590 68 Q590 88 510 88 L340 88 L300 115 L320 88 L230 88 Q170 88 170 68 Z" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="380" y="24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#B45309" text-anchor="middle">Cô giáo dở khóc dở cười, mặt đỏ bừng:</text>
    <text x="380" y="45" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="middle">“Úi chà chà! Bụng to quá cấn hết đầu gối rồi! 😅”</text>
    <text x="380" y="66" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#1E293B" text-anchor="middle">Tay cô ngắn cũn, cúi mãi không chạm tới sàn được các em ơi! 💦</text>
  </g>

  <!-- Top Title Bar -->
  <rect x="18" y="14" width="315" height="30" rx="8" fill="#1E293B"/>
  <text x="175" y="34" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#F87171" text-anchor="middle">★ CẢNH 2: RƠI PHẤN &amp; BỤNG BẦU "CẤN ĐÙI"</text>

  <!-- Bottom Narrative Caption -->
  <rect x="25" y="405" width="600" height="34" rx="8" fill="#0F172A" opacity="0.9"/>
  <text x="325" y="427" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#F8FAFC" text-anchor="middle">Viên phấn trớ trêu lăn vào gầm bàn, cô khom lưng nhặt nhưng bụng to cấn chặt đầu gối!</text>
</svg>
