<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <defs>
    <!-- Warm celebratory background gradient -->
    <linearGradient id="wallP4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="68%" stop-color="#FEF3C7"/>
      <stop offset="68%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Baby belly radial gradient -->
    <radialGradient id="bellyP4" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="45%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </radialGradient>

    <!-- Comic Kick Burst Gradient -->
    <radialGradient id="kickBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </radialGradient>

    <filter id="shadowP4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Panel Border & Background -->
  <rect x="5" y="5" width="640" height="440" rx="16" fill="url(#wallP4)" stroke="#1E293B" stroke-width="4"/>

  <!-- Classroom Floor & Tiles -->
  <line x1="5" y1="305" x2="645" y2="305" stroke="#94A3B8" stroke-width="2"/>
  <line x1="100" y1="305" x2="40" y2="445" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="260" y1="305" x2="200" y2="445" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="420" y1="305" x2="380" y2="445" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Celebratory Confetti & Floating Hearts in the background -->
  <text x="50" y="75" font-size="16">🎉</text>
  <text x="180" y="65" font-size="14">💖</text>
  <text x="320" y="55" font-size="16">✨</text>
  <text x="470" y="65" font-size="15">🎊</text>
  <text x="600" y="75" font-size="16">❤️</text>
  <circle cx="80" cy="95" r="4" fill="#F43F5E"/>
  <circle cx="260" cy="80" r="3.5" fill="#3B82F6"/>
  <circle cx="420" cy="90" r="4" fill="#10B981"/>
  <circle cx="580" cy="95" r="3.5" fill="#F59E0B"/>

  <!-- STUDENT GIVING CHALK BACK (Left Side) -->
  <g id="giving-chalk" transform="translate(60, 160)">
    <!-- Shadow -->
    <ellipse cx="40" cy="160" rx="35" ry="10" fill="#000000" opacity="0.2"/>

    <!-- Legs & Body in polite bow -->
    <rect x="25" y="100" width="10" height="55" fill="#1E3A8A"/>
    <rect x="42" y="100" width="10" height="55" fill="#1E3A8A"/>
    <ellipse cx="28" cy="155" rx="8" ry="5" fill="#0F172A"/>
    <ellipse cx="49" cy="155" rx="8" ry="5" fill="#0F172A"/>

    <!-- School Uniform -->
    <path d="M18 45 L62 45 L58 102 L22 102 Z" fill="#3B82F6" stroke="#1D4ED8" stroke-width="2"/>
    <polygon points="36,42 44,42 40,65" fill="#EF4444"/> <!-- Red Scarf -->

    <!-- Two Arms reverently offering chalk forward -->
    <path d="M22 55 L75 45" stroke="#3B82F6" stroke-width="10" stroke-linecap="round"/>
    <path d="M55 55 L78 50" stroke="#3B82F6" stroke-width="10" stroke-linecap="round"/>
    <circle cx="78" cy="47" r="7" fill="#FED7AA" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Intact Chalk lying in hands -->
    <rect x="70" y="38" width="18" height="6" rx="2" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.2"/>
    <text x="80" y="32" font-size="11">✨</text>

    <!-- Head with beaming polite smile -->
    <circle cx="40" cy="18" r="18" fill="#FED7AA" stroke="#1E293B" stroke-width="2"/>
    <path d="M24 16 C22 -2 58 -2 56 16 Z" fill="#1E293B"/>
    <!-- Smiling crescent eyes ( ^ ^ ) -->
    <path d="M31 16 Q35 12 39 16" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
    <path d="M43 16 Q47 12 51 16" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
    <circle cx="28" cy="22" r="3.5" fill="#FCA5A5"/>
    <circle cx="53" cy="22" r="3.5" fill="#FCA5A5"/>
    <path d="M36 24 Q41 30 46 24" fill="none" stroke="#DC2626" stroke-width="2"/>
    <text x="40" y="-8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#1D4ED8" text-anchor="middle">Lớp trưởng 4B</text>
  </g>

  <!-- RADIANT PREGNANT TEACHER WITH BABY KICK "BỤP!" (Center) -->
  <g id="radiant-teacher" transform="translate(240, 110)">
    <!-- Floor Shadow -->
    <ellipse cx="80" cy="210" rx="75" ry="15" fill="#000000" opacity="0.18"/>

    <!-- Pretty Maternity Dress -->
    <path d="M40 75 Q75 62 105 75 L145 198 Q75 208 20 198 Z" fill="#FBCFE8" stroke="#F43F5E" stroke-width="2"/>

    <!-- Pink shoes -->
    <ellipse cx="45" cy="208" rx="14" ry="7" fill="#F43F5E"/>
    <ellipse cx="110" cy="208" rx="14" ry="7" fill="#F43F5E"/>

    <!-- GIANT ROUND PREGNANT BELLY -->
    <ellipse cx="105" cy="140" rx="70" ry="60" fill="url(#bellyP4)" stroke="#E11D48" stroke-width="3"/>
    <path d="M70 110 Q105 90 145 115" stroke="#FFF1F2" stroke-width="5" fill="none" opacity="0.75"/>

    <!-- ================= DYNAMIC BABY KICK EFFECT! ================= -->
    <!-- The prominent bump on the belly pushing the fabric! -->
    <g transform="translate(138, 125)">
      <!-- Outward foot/hand bulge bump on belly -->
      <ellipse cx="0" cy="0" rx="14" ry="12" fill="#E11D48" stroke="#BE123C" stroke-width="2"/>
      <ellipse cx="-2" cy="-2" rx="8" ry="6" fill="#FDA4AF"/>

      <!-- Comic Burst Star Behind the Kick -->
      <polygon points="0,-22 6,-8 22,-14 12,0 26,12 10,12 8,26 -2,12 -18,20 -10,6 -26,-2 -10,-8" fill="url(#kickBurst)" stroke="#991B1B" stroke-width="1.5"/>

      <!-- Comic Vibration Sound Waves -->
      <path d="M18 -18 Q28 0 18 18" stroke="#DC2626" stroke-width="2.5" fill="none"/>
      <path d="M26 -26 Q38 0 26 26" stroke="#DC2626" stroke-width="2" fill="none"/>

      <!-- Sound Effect Text -->
      <rect x="25" y="-18" width="85" height="34" rx="8" fill="#FEF08A" stroke="#DC2626" stroke-width="2.2" filter="url(#shadowP4)"/>
      <text x="67" y="5" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" fill="#DC2626" text-anchor="middle">💥 BỤP!</text>
    </g>

    <!-- Teacher Both Hands Lovingly Cradling & Touching the Kick Spot -->
    <path d="M40 85 Q75 115 90 135" fill="none" stroke="#FBCFE8" stroke-width="14" stroke-linecap="round"/>
    <circle cx="90" cy="135" r="9" fill="#FED7AA" stroke="#1E293B" stroke-width="1.8"/>

    <path d="M85 85 Q135 105 130 140" fill="none" stroke="#FBCFE8" stroke-width="14" stroke-linecap="round"/>
    <circle cx="130" cy="140" r="9" fill="#FED7AA" stroke="#1E293B" stroke-width="1.8"/>

    <!-- Teacher Head & Joyful Glowing Face -->
    <circle cx="70" cy="42" r="26" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5"/>
    <circle cx="70" cy="18" r="13" fill="#3B2005"/> <!-- Bun -->
    <path d="M44 42 C40 16 100 16 96 42 Z" fill="#3B2005"/>
    <circle cx="52" cy="20" r="6" fill="#F43F5E"/> <!-- Clip -->

    <!-- Glasses -->
    <rect x="57" y="38" width="11" height="8" rx="2" fill="none" stroke="#DC2626" stroke-width="1.8"/>
    <rect x="73" y="38" width="11" height="8" rx="2" fill="none" stroke="#DC2626" stroke-width="1.8"/>
    <line x1="68" y1="42" x2="73" y2="42" stroke="#DC2626" stroke-width="1.8"/>

    <!-- Joyful sparkling eyes -->
    <circle cx="62" cy="42" r="2.5" fill="#1E293B"/>
    <circle cx="78" cy="42" r="2.5" fill="#1E293B"/>
    <circle cx="63" cy="41" r="1" fill="#FFFFFF"/>
    <circle cx="79" cy="41" r="1" fill="#FFFFFF"/>
    <!-- Deep rosy cheeks -->
    <circle cx="54" cy="48" r="5" fill="#FCA5A5"/>
    <circle cx="86" cy="48" r="5" fill="#FCA5A5"/>
    <!-- Radiant wide smile -->
    <path d="M64 50 Q70 58 76 50" fill="#BE123C" stroke="#BE123C" stroke-width="2"/>
    <text x="96" y="32" font-size="16">✨</text>
    <text x="35" y="35" font-size="15">🥰</text>
  </g>

  <!-- CHEERING CLASSMATES (Far Right) -->
  <g id="cheering-class" transform="translate(480, 160)">
    <!-- Desk front -->
    <rect x="0" y="55" width="140" height="15" rx="3" fill="#D97706" stroke="#78350F" stroke-width="2"/>
    <rect x="10" y="70" width="10" height="55" fill="#92400E"/>
    <rect x="120" y="70" width="10" height="55" fill="#92400E"/>

    <!-- Girl cheering with hands up -->
    <g transform="translate(25, 5)">
      <ellipse cx="20" cy="45" rx="16" ry="20" fill="#F472B6" stroke="#DB2777" stroke-width="2"/>
      <circle cx="20" cy="18" r="15" fill="#FED7AA" stroke="#1E293B" stroke-width="2"/>
      <path d="M6 16 C6 4 34 4 34 16 Z" fill="#3B2005"/>
      <circle cx="16" cy="18" r="2" fill="#1E293B"/><circle cx="24" cy="18" r="2" fill="#1E293B"/>
      <path d="M16 23 Q20 27 24 23" fill="none" stroke="#DC2626" stroke-width="2"/>
      <!-- Arms raised high celebrating! -->
      <line x1="6" y1="35" x2="-4" y2="15" stroke="#FED7AA" stroke-width="6" stroke-linecap="round"/>
      <line x1="34" y1="35" x2="44" y2="15" stroke="#FED7AA" stroke-width="6" stroke-linecap="round"/>
      <text x="40" y="10" font-size="12">👏</text>
    </g>

    <!-- Boy cheering with thumbs up -->
    <g transform="translate(75, 10)">
      <ellipse cx="20" cy="45" rx="16" ry="20" fill="#10B981" stroke="#047857" stroke-width="2"/>
      <circle cx="20" cy="18" r="15" fill="#FED7AA" stroke="#1E293B" stroke-width="2"/>
      <path d="M6 16 C6 4 34 4 34 16 Z" fill="#1E293B"/>
      <circle cx="16" cy="18" r="2" fill="#1E293B"/><circle cx="24" cy="18" r="2" fill="#1E293B"/>
      <path d="M16 23 Q20 27 24 23" fill="none" stroke="#DC2626" stroke-width="2"/>
      <text x="25" y="10" font-size="14">🙌</text>
    </g>
  </g>

  <!-- Speech Bubble: Teacher -->
  <g filter="url(#shadowP4)">
    <path d="M130 18 Q130 0 200 0 L460 0 Q480 0 480 20 L480 70 Q480 90 400 90 L330 90 L300 112 L315 90 L160 90 Q130 90 130 70 Z" fill="#FFF1F2" stroke="#F43F5E" stroke-width="2.5"/>
    <text x="305" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#9F1239" text-anchor="middle">Cô giáo xúc động mỉm cười rạng rỡ:</text>
    <text x="305" y="44" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" fill="#DC2626" text-anchor="middle">“Em bé vừa đạp bụp một cái thật to này! ❤️”</text>
    <text x="305" y="65" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#1E293B" text-anchor="middle">Bé đang vỗ tay cảm ơn các anh chị lớp 4B đấy! 🥰</text>
  </g>

  <!-- Speech Bubble: Whole Class -->
  <g filter="url(#shadowP4)">
    <path d="M460 100 Q460 82 520 82 L630 82 Q642 82 642 98 L642 138 Q642 154 590 154 L550 154 L530 175 L540 154 L480 154 Q460 154 460 138 Z" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="550" y="102" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="bold" fill="#15803D" text-anchor="middle">“Yeahhhh! Hoan hô!”</text>
    <text x="550" y="121" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="bold" fill="#DC2626" text-anchor="middle">Em bé ngoan quá trời! 🎉</text>
    <text x="550" y="138" font-family="'Segoe UI', sans-serif" font-size="10" fill="#166534" text-anchor="middle">Em út danh dự 4B nha cô!</text>
  </g>

  <!-- Top Title Bar -->
  <rect x="18" y="14" width="320" height="30" rx="8" fill="#1E293B"/>
  <text x="178" y="34" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#FDE047" text-anchor="middle">★ CẢNH 4: CÚ ĐẠP "VỖ TAY" CỦA EM BÉ TRONG BỤNG</text>

  <!-- Bottom Narrative Caption -->
  <rect x="25" y="405" width="600" height="34" rx="8" fill="#0F172A" opacity="0.9"/>
  <text x="325" y="427" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#F8FAFC" text-anchor="middle">Em bé đạp bụp một cái như tràng pháo tay cảm ơn các anh chị 4B, khép lại tiết học ấm áp! 💕</text>
</svg>
