<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient Soft Warm Classroom -->
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>

    <!-- Comic panel frame shadow -->
    <filter id="softShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1000" height="800" fill="url(#warmBg)"/>

  <!-- Title Banner -->
  <g transform="translate(50, 20)" filter="url(#softShadow)">
    <rect width="900" height="60" rx="10" fill="#FFFFFF" stroke="#FB7185" stroke-width="2.5"/>
    <text x="450" y="38" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="bold" fill="#E11D48" text-anchor="middle">
      🤰🏫 TRUYỆN TRANH: CÔ GIÁO BỤNG BẦU SIÊU TO &amp; VIÊN PHẤN DƯỚI GẦM BÀN
    </text>
  </g>

  <!-- ==================== KHUNG 1: CÔ GIÁO BẦU KHỆ NỆ ==================== -->
  <g transform="translate(50, 100)" filter="url(#softShadow)">
    <rect width="435" height="320" rx="8" fill="#FFFFFF" stroke="#F43F5E" stroke-width="2"/>
    <rect x="0" y="0" width="435" height="28" rx="8" fill="#FFE4E6" stroke="#F43F5E" stroke-width="2"/>
    <text x="15" y="19" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#BE123C">1. Cô giáo tháng thứ 9 dáng đi chim cánh cụt</text>

    <!-- Chalkboard -->
    <rect x="20" y="40" width="180" height="70" rx="4" fill="#065F46" stroke="#92400E" stroke-width="2"/>
    <text x="110" y="65" font-size="11" font-weight="bold" fill="#FDE047" text-anchor="middle">TIẾT HỌC BUỔI SÁNG</text>
    <text x="110" y="85" font-size="10" fill="#FFFFFF" text-anchor="middle">Tập Đọc &amp; Kể Chuyện</text>

    <!-- Pregnant Teacher standing adorably -->
    <g transform="translate(50, 120)">
      <!-- Body & Pink maternity dress with HUGE round belly -->
      <path d="M40 40 L80 40 L90 140 L30 140 Z" fill="#F472B6"/>
      <!-- Giant round baby bump -->
      <circle cx="95" cy="85" r="32" fill="#FB7185" stroke="#E11D48" stroke-width="2"/>
      <path d="M70 85 Q95 65 118 85 Q95 110 70 85 Z" fill="#F43F5E" opacity="0.2"/>
      <!-- Legs -->
      <rect x="45" y="140" width="14" height="40" fill="#FBCFE8"/>
      <rect x="70" y="140" width="14" height="40" fill="#FBCFE8"/>
      <!-- Cute shoes -->
      <ellipse cx="50" cy="180" rx="10" ry="5" fill="#BE185D"/>
      <ellipse cx="78" cy="180" rx="10" ry="5" fill="#BE185D"/>
      <!-- One hand resting on belly, other holding chalk -->
      <path d="M40 50 L65 75 L80 85" stroke="#FBCFE8" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M80 50 L110 40 L130 35" stroke="#FBCFE8" stroke-width="8" stroke-linecap="round" fill="none"/>
      <!-- Head with gentle face -->
      <circle cx="60" cy="20" r="18" fill="#FED7AA" stroke="#1E293B" stroke-width="1.5"/>
      <path d="M42 12 Q60 0 78 12 Z" fill="#475569"/> <!-- Hair bun -->
      <circle cx="60" cy="0" r="8" fill="#475569"/>
      <circle cx="55" cy="18" r="2" fill="#1E293B"/>
      <circle cx="65" cy="18" r="2" fill="#1E293B"/>
      <path d="M56 26 Q60 30 64 26" stroke="#BE123C" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Speech bubble -->
    <g transform="translate(190, 130)">
      <path d="M10 0 L220 0 C230 0 230 10 230 10 L230 90 C230 100 220 100 220 100 L30 100 L0 120 L15 100 L10 100 C0 100 0 90 0 90 L0 10 C0 0 10 0 10 0 Z" fill="#FFF1F2" stroke="#FB7185" stroke-width="1.8"/>
      <text x="115" y="24" font-size="11" font-weight="bold" fill="#BE123C" text-anchor="middle">Cô giáo cười dịu dàng:</text>
      <text x="115" y="46" font-size="11" fill="#1E293B" text-anchor="middle">“Hôm nay em bé trong bụng cô</text>
      <text x="115" y="66" font-size="11" font-weight="bold" fill="#E11D48" text-anchor="middle">to tròn vượt mặt luôn rồi!”</text>
      <text x="115" y="86" font-size="10.5" fill="#4B5563" text-anchor="middle">Dáng đi lạch bạch cực đáng yêu 💕</text>
    </g>
  </g>

  <!-- ==================== KHUNG 2: VIÊN PHẤN RƠI & BỤNG BẦU BỊ CẤN ==================== -->
  <g transform="translate(515, 100)" filter="url(#softShadow)">
    <rect width="435" height="320" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <rect x="0" y="0" width="435" height="28" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="15" y="19" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#B45309">2. Sự cố rơi phấn &amp; chiếc bụng to cấn đùi</text>

    <!-- Teacher Desk with deep under-desk space -->
    <g transform="translate(180, 180)">
      <rect x="0" y="0" width="150" height="20" rx="3" fill="#D97706" stroke="#92400E" stroke-width="2"/>
      <rect x="10" y="20" width="10" height="90" fill="#78350F"/>
      <rect x="130" y="20" width="10" height="90" fill="#78350F"/>
      <!-- Fallen chalk on floor under desk -->
      <rect x="60" y="100" width="16" height="6" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
      <text x="68" y="90" font-size="9" fill="#DC2626" font-weight="bold" text-anchor="middle">Phấn rơi!</text>
    </g>

    <!-- Pregnant Teacher trying to bend down, stuck by giant belly! -->
    <g transform="translate(60, 130)">
      <!-- Bent body -->
      <path d="M40 30 Q70 20 85 45 L65 110 L30 100 Z" fill="#F472B6"/>
      <!-- Giant Bump protruding forward touching knees -->
      <circle cx="95" cy="70" r="30" fill="#FB7185" stroke="#E11D48" stroke-width="2"/>
      <!-- Legs bent slightly -->
      <rect x="30" y="110" width="14" height="40" fill="#FBCFE8"/>
      <rect x="55" y="110" width="14" height="40" fill="#FBCFE8"/>
      <!-- Arm stretching desperately downward but can't reach floor -->
      <path d="M60 45 L95 100 L115 115" stroke="#FBCFE8" stroke-width="8" stroke-linecap="round" fill="none"/>
      <!-- Head with comical sweating face -->
      <circle cx="35" cy="20" r="16" fill="#FED7AA" stroke="#1E293B" stroke-width="1.5"/>
      <circle cx="32" cy="18" r="2" fill="#1E293B"/>
      <circle cx="38" cy="18" r="2" fill="#1E293B"/>
      <!-- Straining mouth -->
      <ellipse cx="36" cy="27" rx="5" ry="3" fill="#991B1B"/>
      <!-- Sweat drops -->
      <text x="45" y="10" font-size="14">💦</text>
      <text x="15" y="10" font-size="14">💦</text>
    </g>

    <!-- Speech bubble -->
    <g transform="translate(190, 50)">
      <path d="M10 0 L225 0 C235 0 235 10 235 10 L235 95 C235 105 225 105 225 105 L40 105 L15 125 L25 105 L10 105 C0 105 0 95 0 95 L0 10 C0 0 10 0 10 0 Z" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.8"/>
      <text x="117" y="24" font-size="11" font-weight="bold" fill="#D97706" text-anchor="middle">Cô giáo dở khóc dở cười:</text>
      <text x="117" y="46" font-size="11" font-weight="bold" fill="#DC2626" text-anchor="middle">“Úi chà chà! Tay ngắn quá!”</text>
      <text x="117" y="66" font-size="11" fill="#1E293B" text-anchor="middle">Bụng bầu to cấn chặt đầu gối,</text>
      <text x="117" y="86" font-size="11" fill="#1E293B" text-anchor="middle">cúi mãi mà không chạm tới sàn!</text>
    </g>
  </g>

  <!-- ==================== KHUNG 3: BIỆT ĐỘI NHÍ LAO LÊN GIẢI CỨU ==================== -->
  <g transform="translate(50, 445)" filter="url(#softShadow)">
    <rect width="435" height="320" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="0" y="0" width="435" height="28" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
    <text x="15" y="19" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1D4ED8">3. Biệt đội học trò xung phong giải cứu</text>

    <!-- Teacher standing upright holding belly relieved -->
    <g transform="translate(40, 90)">
      <path d="M30 40 L65 40 L70 140 L25 140 Z" fill="#F472B6"/>
      <circle cx="75" cy="85" r="28" fill="#FB7185" stroke="#E11D48" stroke-width="2"/>
      <circle cx="45" cy="20" r="16" fill="#FED7AA" stroke="#1E293B" stroke-width="1.5"/>
      <!-- Hands cradling belly -->
      <path d="M30 50 L55 75 L75 85" stroke="#FBCFE8" stroke-width="6" stroke-linecap="round" fill="none"/>
      <!-- Surprised happy smile -->
      <circle cx="43" cy="18" r="2" fill="#1E293B"/>
      <circle cx="49" cy="18" r="2" fill="#1E293B"/>
      <path d="M43 25 Q46 29 49 25" stroke="#BE123C" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Two enthusiastic students crawling under the desk -->
    <g transform="translate(180, 180)">
      <!-- Teacher desk -->
      <rect x="0" y="0" width="170" height="18" rx="2" fill="#D97706" stroke="#92400E" stroke-width="2"/>
      <rect x="10" y="18" width="10" height="90" fill="#78350F"/>
      <rect x="150" y="18" width="10" height="90" fill="#78350F"/>

      <!-- Boy 1 crawling reaching for chalk -->
      <path d="M30 85 L90 85" stroke="#2563EB" stroke-width="14" stroke-linecap="round"/>
      <circle cx="20" cy="85" r="12" fill="#FED7AA" stroke="#1E293B" stroke-width="1.5"/>
      <path d="M90 85 L120 92" stroke="#FED7AA" stroke-width="6" stroke-linecap="round"/>
      <!-- Chalk picked up! -->
      <rect x="120" y="88" width="12" height="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
      <text x="80" y="70" font-size="9" fill="#1D4ED8" font-weight="bold">“Em nhặt được rồi!”</text>
    </g>

    <!-- Speech bubble -->
    <g transform="translate(160, 50)">
      <path d="M10 0 L250 0 C260 0 260 10 260 10 L260 85 C260 95 250 95 250 95 L50 95 L20 115 L35 95 L10 95 C0 95 0 85 0 85 L0 10 C0 0 10 0 10 0 Z" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
      <text x="130" y="22" font-size="11" font-weight="bold" fill="#1D4ED8" text-anchor="middle">Cả lớp nhao nhao chạy lên:</text>
      <text x="130" y="44" font-size="11.5" font-weight="bold" fill="#DC2626" text-anchor="middle">“Cô đừng cúi kẻo em bé chóng mặt!”</text>
      <text x="130" y="64" font-size="11" fill="#1E293B" text-anchor="middle">“Để tụi em chui vào gầm bàn nhặt cho cô!”</text>
      <text x="130" y="82" font-size="10.5" fill="#4B5563" text-anchor="middle">Cả đám bò toài dưới sàn nhiệt tình!</text>
    </g>
  </g>

  <!-- ==================== KHUNG 4: CÁI KẾT NGẬP TRÀN YÊU THƯƠNG ==================== -->
  <g transform="translate(515, 445)" filter="url(#softShadow)">
    <rect width="435" height="320" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <rect x="0" y="0" width="435" height="28" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="15" y="19" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#047857">4. Em bé đạp bụp một cái cảm ơn anh chị!</text>

    <!-- Teacher happily holding chalk with giant cute belly -->
    <g transform="translate(60, 90)">
      <path d="M30 40 L70 40 L75 140 L25 140 Z" fill="#F472B6"/>
      <!-- Giant belly with kick bump ripple effect! -->
      <circle cx="80" cy="85" r="30" fill="#FB7185" stroke="#E11D48" stroke-width="2"/>
      <!-- Kick bump mark! -->
      <circle cx="92" cy="78" r="6" fill="#F43F5E"/>
      <text x="105" y="75" font-size="13">💥 BỤP!</text>

      <!-- Head with beaming face -->
      <circle cx="50" cy="20" r="18" fill="#FED7AA" stroke="#1E293B" stroke-width="1.5"/>
      <circle cx="45" cy="18" r="2" fill="#1E293B"/>
      <circle cx="55" cy="18" r="2" fill="#1E293B"/>
      <path d="M46 25 Q50 32 54 25" stroke="#BE123C" stroke-width="2" fill="none"/>
      <!-- Chalk in raised hand -->
      <rect x="75" y="15" width="6" height="14" rx="2" fill="#FFFFFF" stroke="#1E293B" stroke-width="1"/>
    </g>

    <!-- Student holding hands together smiling brightly -->
    <g transform="translate(260, 150)">
      <path d="M20 40 L50 40 L55 100 L15 100 Z" fill="#3B82F6"/>
      <circle cx="35" cy="20" r="14" fill="#FED7AA" stroke="#1E293B" stroke-width="1.5"/>
      <text x="35" y="24" font-size="10" text-anchor="middle">😄</text>
      <text x="35" y="120" font-size="10" font-weight="bold" fill="#1E293B" text-anchor="middle">Lớp trưởng</text>
    </g>

    <!-- Speech bubble -->
    <g transform="translate(140, 45)">
      <path d="M10 0 L270 0 C280 0 280 10 280 10 L280 90 C280 100 270 100 270 100 L40 100 L10 125 L20 100 L10 100 C0 100 0 90 0 90 L0 10 C0 0 10 0 10 0 Z" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
      <text x="140" y="22" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">Cô giáo cười rạng rỡ:</text>
      <text x="140" y="44" font-size="11.5" fill="#1E293B" text-anchor="middle">“Cảm ơn biệt đội nhí của cô nhé!”</text>
      <text x="140" y="64" font-size="11.5" font-weight="bold" fill="#E11D48" text-anchor="middle">“Em bé vừa đạp bụp một cái trong bụng”</text>
      <text x="140" y="82" font-size="11" fill="#047857" text-anchor="middle">để vỗ tay cảm ơn các anh chị đấy! ❤️🥰</text>
    </g>

    <!-- Bottom heart badge -->
    <g transform="translate(50, 255)">
      <rect width="340" height="45" rx="6" fill="#FEE2E2" stroke="#F87171" stroke-width="1.5"/>
      <text x="170" y="28" font-size="12" font-weight="bold" fill="#BE123C" text-anchor="middle">
        💖 Tiết học tràn ngập tiếng cười ấm áp học trò!
      </text>
    </g>
  </g>
</svg>
