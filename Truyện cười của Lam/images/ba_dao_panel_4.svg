<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bd4Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="65%" stop-color="#F3E8FF"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="trophyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Khung tranh & Nền phòng sinh rực rỡ -->
  <rect x="5" y="5" width="640" height="440" rx="16" fill="url(#bd4Bg)" stroke="#6B21A8" stroke-width="4"/>

  <!-- Tiêu đề phân cảnh -->
  <rect x="25" y="20" width="370" height="36" rx="10" fill="#9333EA" filter="url(#shadow4)"/>
  <text x="210" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">🎉 CẢNH 4: BỘ ĐÔI SIÊU QUẬY BÁ ĐẠO RA ĐỜI 👶👶🏆</text>

  <!-- Pháo hoa giấy tưng bừng rơi khắp phòng -->
  <circle cx="60" cy="80" r="4" fill="#EF4444"/><circle cx="120" cy="70" r="5" fill="#3B82F6"/>
  <circle cx="560" cy="90" r="5" fill="#FACC15"/><circle cx="500" cy="70" r="4" fill="#10B981"/>
  <rect x="180" y="75" width="8" height="8" rx="2" fill="#EC4899" transform="rotate(25 180 75)"/>
  <rect x="450" y="85" width="8" height="8" rx="2" fill="#8B5CF6" transform="rotate(45 450 85)"/>

  <!-- Giường sinh êm ái -->
  <rect x="80" y="250" width="380" height="50" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <polygon points="80,250 140,180 200,250" fill="#EDE9FE"/>

  <!-- MẸ BẦU MÃN NGUYỆN NẰM TỰA GỐI, BỤNG ĐÃ XẸP NHẸ NHÕM -->
  <g transform="translate(100, 150)">
    <circle cx="50" cy="30" r="26" fill="#FFE4E6" stroke="#1E293B" stroke-width="2"/>
    <path d="M 28 25 C 28 0 72 0 72 25 Z" fill="#78350F"/>
    <ellipse cx="42" cy="28" rx="3.5" ry="4" fill="#1E293B"/><ellipse cx="58" cy="28" rx="3.5" ry="4" fill="#1E293B"/>
    <path d="M 45 40 Q 50 48 55 40" stroke="#E11D48" stroke-width="2.5" fill="none"/>
    <ellipse cx="36" cy="34" rx="4" ry="2.5" fill="#FDA4AF"/><ellipse cx="64" cy="34" rx="4" ry="2.5" fill="#FDA4AF"/>
    <path d="M 35 55 L 75 55 L 140 100 L 20 100 Z" fill="#F472B6"/>
    <text x="80" y="85" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Mẹ khỏe re! 💪</text>
  </g>

  <!-- HAI THIÊN THẦN BÉ BI SINH ĐÔI SIÊU BỤ BẪM GIƠ TAY "LIKE" BÁ ĐẠO -->
  <g transform="translate(250, 180)">
    <rect x="0" y="30" width="190" height="90" rx="16" fill="#FEF08A" stroke="#EAB308" stroke-width="3" filter="url(#shadow4)"/>
    <rect x="10" y="40" width="170" height="70" rx="10" fill="#FFFFFF"/>
    
    <!-- BÉ TRAI BÊN TRÁI (3.8kg) -->
    <g transform="translate(45, 45)">
      <circle cx="0" cy="0" r="22" fill="#FFEDD5" stroke="#1E293B" stroke-width="1.5"/>
      <path d="M -15 -8 C -15 -22 15 -22 15 -8 Z" fill="#0284C7"/>
      <path d="M -8 -2 Q -4 4 0 -2" stroke="#1E293B" stroke-width="2" fill="none"/>
      <path d="M 4 -2 Q 8 4 12 -2" stroke="#1E293B" stroke-width="2" fill="none"/>
      <ellipse cx="-10" cy="4" rx="4" ry="2" fill="#FDA4AF"/><ellipse cx="10" cy="4" rx="4" ry="2" fill="#FDA4AF"/>
      <ellipse cx="0" cy="18" rx="18" ry="12" fill="#BAE6FD"/>
      <circle cx="18" cy="5" r="5" fill="#FFEDD5" stroke="#1E293B" stroke-width="1"/>
      <rect x="16" y="-3" width="4" height="8" rx="2" fill="#FFEDD5" stroke="#1E293B" stroke-width="1"/>
      <text x="26" y="2" font-size="14">👍</text>
    </g>

    <!-- BÉ GÁI BÊN PHẢI (3.8kg) -->
    <g transform="translate(135, 45)">
      <circle cx="0" cy="0" r="22" fill="#FFE4E6" stroke="#1E293B" stroke-width="1.5"/>
      <polygon points="-8,-20 0,-16 8,-20 8,-12 0,-14 -8,-12" fill="#EC4899"/>
      <path d="M -8 -2 Q -4 4 0 -2" stroke="#1E293B" stroke-width="2" fill="none"/>
      <path d="M 4 -2 Q 8 4 12 -2" stroke="#1E293B" stroke-width="2" fill="none"/>
      <ellipse cx="-10" cy="4" rx="4" ry="2" fill="#FDA4AF"/><ellipse cx="10" cy="4" rx="4" ry="2" fill="#FDA4AF"/>
      <ellipse cx="0" cy="18" rx="18" ry="12" fill="#FCE7F3"/>
      <circle cx="18" cy="5" r="5" fill="#FFE4E6" stroke="#1E293B" stroke-width="1"/>
      <rect x="16" y="-3" width="4" height="8" rx="2" fill="#FFE4E6" stroke="#1E293B" stroke-width="1"/>
      <text x="26" y="2" font-size="14">👍</text>
    </g>
    <text x="95" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#854D0E" text-anchor="middle">BỘ ĐÔI SINH ĐÔI 7.6KG LIKE MẸ! 👍❤️</text>
  </g>

  <!-- BÁC SĨ TRƯỞNG KHOA TRAO CÚP VÀNG CHO MẸ -->
  <g transform="translate(470, 140)">
    <circle cx="45" cy="35" r="24" fill="#FFEDD5" stroke="#1E293B" stroke-width="2"/>
    <path d="M 25 25 Q 45 10 65 25 Z" fill="#0284C7"/>
    <ellipse cx="38" cy="32" rx="3" ry="3.5" fill="#1E293B"/><ellipse cx="52" cy="32" rx="3" ry="3.5" fill="#1E293B"/>
    <rect x="30" y="38" width="30" height="16" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
    <path d="M 25 60 L 65 60 L 70 140 L 20 140 Z" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>

    <path d="M 0 50 L 25 50 L 20 80 Q 12 95 5 95 L 0 95 Z" fill="url(#trophyGrad)" stroke="#A16207" stroke-width="2"/>
    <rect x="-3" y="95" width="16" height="6" fill="#78350F"/>
    <text x="10" y="70" font-size="12" font-weight="bold" fill="#78350F" text-anchor="middle">#1</text>
    <text x="45" y="160" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#15803D" text-anchor="middle">Bác sĩ: "Mẹ siêu nhân! 🏆"</text>
  </g>

  <!-- Chú thích dưới đáy -->
  <rect x="25" y="390" width="600" height="40" rx="8" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1.5"/>
  <text x="325" y="415" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#6B21A8" text-anchor="middle">Một hơi rặn sấm sét đón trọn 2 bé bụ bẫm giơ ngón tay LIKE bái phục mẹ bầu!</text>
</svg>
