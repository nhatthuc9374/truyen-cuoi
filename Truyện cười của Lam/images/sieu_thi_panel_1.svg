<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="martBg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="60%" stop-color="#FFFBEB"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="shadowSM1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Khung viền và nền siêu thị -->
  <rect x="6" y="6" width="788" height="538" rx="20" fill="url(#martBg1)" stroke="#059669" stroke-width="5"/>

  <!-- Kệ hàng siêu thị phía sau phóng to -->
  <g opacity="0.85">
    <rect x="520" y="80" width="260" height="280" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2.5"/>
    <line x1="520" y1="145" x2="780" y2="145" stroke="#059669" stroke-width="6"/>
    <line x1="520" y1="215" x2="780" y2="215" stroke="#059669" stroke-width="6"/>
    <line x1="520" y1="285" x2="780" y2="285" stroke="#059669" stroke-width="6"/>
    <!-- Hàng hóa kệ -->
    <rect x="540" y="98" width="30" height="42" rx="4" fill="#EF4444"/>
    <rect x="580" y="102" width="32" height="38" rx="4" fill="#3B82F6"/>
    <rect x="625" y="95" width="28" height="45" rx="4" fill="#F59E0B"/>
    <rect x="665" y="100" width="35" height="40" rx="4" fill="#10B981"/>
    <rect x="715" y="96" width="30" height="44" rx="4" fill="#8B5CF6"/>

    <ellipse cx="555" cy="180" rx="20" ry="18" fill="#22C55E"/>
    <ellipse cx="605" cy="178" rx="19" ry="19" fill="#EAB308"/>
    <ellipse cx="655" cy="180" rx="20" ry="18" fill="#EF4444"/>
    <ellipse cx="705" cy="178" rx="19" ry="19" fill="#F97316"/>
    <ellipse cx="750" cy="180" rx="18" ry="18" fill="#84CC16"/>

    <rect x="545" y="235" width="36" height="45" rx="3" fill="#0284C7"/>
    <rect x="600" y="235" width="36" height="45" rx="3" fill="#EC4899"/>
    <rect x="655" y="235" width="36" height="45" rx="3" fill="#EAB308"/>
    <rect x="710" y="235" width="36" height="45" rx="3" fill="#14B8A6"/>
  </g>

  <!-- Sàn gạch -->
  <line x1="6" y1="390" x2="794" y2="390" stroke="#94A3B8" stroke-width="3"/>

  <!-- TIÊU ĐỀ LỚN RÕ NÉT TRÊN ĐẦU -->
  <rect x="30" y="18" width="560" height="46" rx="12" fill="#059669" filter="url(#shadowSM1)"/>
  <text x="310" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">🛒 CẢNH 1: BA MẸ CON DẠO SIÊU THỊ CUỐI TUẦN 🥦</text>

  <!-- ==================== NHÂN VẬT: MẸ (ĐẦM MAXI RỘNG THÙNG THÌNH) ==================== -->
  <g id="mom" transform="translate(290, 80)">
    <!-- Bóng -->
    <ellipse cx="70" cy="325" rx="65" ry="16" fill="#000000" opacity="0.25"/>

    <!-- VÁY ĐẦM MAXI THỤNG VÀNG HOA NHÍ RỘNG RÃI -->
    <path d="M 35 130 C 20 200 -10 280 5 320 C 35 328 105 328 135 320 C 150 280 120 200 105 130 Z" fill="#FBBF24" stroke="#D97706" stroke-width="3.5" filter="url(#shadowSM1)"/>
    <!-- Họa tiết hoa nhí nổi bật -->
    <circle cx="45" cy="180" r="5" fill="#EF4444"/><circle cx="95" cy="195" r="5" fill="#EC4899"/>
    <circle cx="65" cy="235" r="5.5" fill="#3B82F6"/><circle cx="110" cy="255" r="5" fill="#10B981"/>
    <circle cx="35" cy="280" r="5" fill="#EF4444"/><circle cx="85" cy="300" r="5.5" fill="#F59E0B"/>

    <!-- Thân trên & Áo mẹ -->
    <path d="M 40 85 Q 70 70 100 85 L 105 130 L 35 130 Z" fill="#FDE68A" stroke="#D97706" stroke-width="2.5"/>

    <!-- Đầu & Cổ Mẹ -->
    <circle cx="70" cy="45" r="30" fill="#FFEDD5" stroke="#1E293B" stroke-width="3"/>
    <!-- Mái tóc búi củ tỏi xinh đẹp -->
    <path d="M 42 45 C 35 15 105 15 98 45 Z" fill="#451A03"/>
    <circle cx="70" cy="12" r="14" fill="#451A03"/>
    <!-- Nơ cài tóc -->
    <rect x="62" y="16" width="16" height="8" rx="3" fill="#EF4444"/>

    <!-- Mặt mẹ tươi cười rạng rỡ -->
    <circle cx="58" cy="43" r="4.5" fill="#1E293B"/><circle cx="82" cy="43" r="4.5" fill="#1E293B"/>
    <circle cx="60" cy="41" r="1.5" fill="#FFFFFF"/><circle cx="84" cy="41" r="1.5" fill="#FFFFFF"/>
    <path d="M 60 56 Q 70 66 80 56" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
    <!-- Má hồng duyên dáng -->
    <ellipse cx="50" cy="52" rx="6" ry="4" fill="#FB7185" opacity="0.7"/>
    <ellipse cx="90" cy="52" rx="6" ry="4" fill="#FB7185" opacity="0.7"/>

    <!-- Hai tay mẹ tạo dáng thướt tha -->
    <path d="M 38 100 Q 15 125 25 150" stroke="#FFEDD5" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M 102 100 Q 125 125 115 150" stroke="#FFEDD5" stroke-width="9" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ==================== NHÂN VẬT: CON LỚN ("TÔI") ĐẨY XE HÀNG TO RÕ ==================== -->
  <g id="child-me" transform="translate(60, 140)">
    <ellipse cx="55" cy="265" rx="42" ry="14" fill="#000000" opacity="0.25"/>

    <!-- Thân người -->
    <ellipse cx="55" cy="165" rx="26" ry="34" fill="#38BDF8" stroke="#0284C7" stroke-width="3"/>
    <rect x="42" y="195" width="26" height="55" fill="#1E3A8A" rx="5"/>
    <ellipse cx="44" cy="255" rx="10" ry="6" fill="#1E293B"/>
    <ellipse cx="66" cy="255" rx="10" ry="6" fill="#1E293B"/>

    <!-- Đầu con lớn -->
    <circle cx="55" cy="105" r="26" fill="#FFEDD5" stroke="#1E293B" stroke-width="3"/>
    <path d="M 32 100 C 28 72 82 72 78 100 Z" fill="#292524"/>
    <circle cx="47" cy="104" r="3.5" fill="#1E293B"/><circle cx="63" cy="104" r="3.5" fill="#1E293B"/>
    <path d="M 50 118 Q 55 124 60 118" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Tay đẩy xe -->
    <path d="M 62 155 L 110 170" stroke="#FFEDD5" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- XE ĐẨY SIÊU THỊ LỚN -->
    <g transform="translate(90, 110)">
      <!-- Tay cầm đỏ -->
      <line x1="20" y1="55" x2="35" y2="55" stroke="#EF4444" stroke-width="7" stroke-linecap="round"/>
      <line x1="25" y1="55" x2="30" y2="90" stroke="#64748B" stroke-width="4"/>
      <!-- Giỏ xe lưới kim loại -->
      <polygon points="30,90 135,90 120,155 40,155" fill="#E2E8F0" opacity="0.8" stroke="#334155" stroke-width="2.5"/>
      <line x1="55" y1="90" x2="60" y2="155" stroke="#64748B" stroke-width="2"/>
      <line x1="85" y1="90" x2="85" y2="155" stroke="#64748B" stroke-width="2"/>
      <line x1="110" y1="90" x2="105" y2="155" stroke="#64748B" stroke-width="2"/>
      <line x1="35" y1="120" x2="128" y2="120" stroke="#64748B" stroke-width="2"/>
      <!-- Hàng hóa trong giỏ xe -->
      <rect x="58" y="98" width="26" height="34" rx="3" fill="#F43F5E"/>
      <circle cx="100" cy="112" r="14" fill="#22C55E"/>
      <!-- Khung và bánh xe -->
      <line x1="40" y1="155" x2="48" y2="185" stroke="#475569" stroke-width="4"/>
      <line x1="120" y1="155" x2="112" y2="185" stroke="#475569" stroke-width="4"/>
      <line x1="40" y1="185" x2="120" y2="185" stroke="#475569" stroke-width="4"/>
      <circle cx="48" cy="185" r="9" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
      <circle cx="112" cy="185" r="9" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
    </g>
  </g>

  <!-- ==================== NHÂN VẬT: EM BÉ (CU TÍ 3 TUỔI) TO RÕ BỤ BẪM ==================== -->
  <g id="baby" transform="translate(460, 240)">
    <!-- Bóng -->
    <ellipse cx="45" cy="140" rx="35" ry="11" fill="#000000" opacity="0.25"/>

    <!-- Thân áo yếm xanh lá bụ bẫm -->
    <ellipse cx="45" cy="85" rx="25" ry="28" fill="#10B981" stroke="#047857" stroke-width="3"/>
    <!-- Chân bé múp míp -->
    <ellipse cx="32" cy="120" rx="10" ry="9" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
    <ellipse cx="58" cy="115" rx="10" ry="9" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>

    <!-- Đầu tròn xoe bánh bao cực cưng -->
    <circle cx="45" cy="40" r="26" fill="#FFEDD5" stroke="#1E293B" stroke-width="3"/>
    <ellipse cx="28" cy="48" rx="6" ry="4.5" fill="#FB7185" opacity="0.8"/>
    <ellipse cx="62" cy="48" rx="6" ry="4.5" fill="#FB7185" opacity="0.8"/>
    <!-- Chỏm tóc hài hước -->
    <path d="M 42 14 Q 45 -2 48 10" stroke="#451A03" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Mắt híp cười toe toét -->
    <path d="M 35 38 Q 40 33 45 38" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
    <path d="M 47 38 Q 52 33 57 38" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
    <!-- Miệng cười mở to -->
    <path d="M 38 50 Q 45 58 52 50" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>

    <!-- Hai tay giơ cao tung tăng -->
    <path d="M 24 75 Q 8 55 14 40" stroke="#FFEDD5" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 66 75 Q 82 55 76 40" stroke="#FFEDD5" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ==================== LỜI THOẠI TO RÕ RÀNG ==================== -->
  <!-- Lời thoại Mẹ -->
  <g transform="translate(260, 15)">
    <path d="M 0 0 L 250 0 Q 260 0 260 12 L 260 48 Q 260 60 250 60 L 50 60 L 30 75 L 38 60 L 0 60 Q -12 60 -12 48 L -12 12 Q -12 0 0 0 Z" fill="#FFFFFF" stroke="#D97706" stroke-width="3" filter="url(#shadowSM1)"/>
    <text x="125" y="27" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#B45309" text-anchor="middle">"Hôm nay mua thật nhiều đồ ngon nha!"</text>
    <text x="125" y="47" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#D97706" text-anchor="middle">🥦 Hai con thích ăn gì cứ bỏ vào xe! 🥩</text>
  </g>

  <!-- Lời thoại Bé Bi -->
  <g transform="translate(560, 310)">
    <path d="M 0 0 L 210 0 Q 220 0 220 12 L 220 48 Q 220 60 210 60 L 40 60 L 15 72 L 25 60 L 0 60 Q -12 60 -12 48 L -12 12 Q -12 0 0 0 Z" fill="#FFFFFF" stroke="#059669" stroke-width="3" filter="url(#shadowSM1)"/>
    <text x="105" y="27" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#047857" text-anchor="middle">"Siêu thị to quá mẹ ơi! 🍭"</text>
    <text x="105" y="47" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">🏃‍♂️ Mẹ đi nhanh lên nào!</text>
  </g>
</svg>
