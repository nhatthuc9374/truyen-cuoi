<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bd3Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="65%" stop-color="#DBEAFE"/>
      <stop offset="65%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Khung tranh & Sảnh thang máy -->
  <rect x="5" y="5" width="640" height="440" rx="16" fill="url(#bd3Bg)" stroke="#1E40AF" stroke-width="4"/>

  <!-- Tiêu đề phân cảnh -->
  <rect x="25" y="20" width="340" height="36" rx="10" fill="#2563EB" filter="url(#shadow3)"/>
  <text x="195" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">🚀 CẢNH 3: QUYỀN LỰC THANG MÁY VIP 🏢👑</text>

  <!-- Khung cửa thang máy trung tâm mở toang -->
  <rect x="160" y="80" width="330" height="290" rx="10" fill="#334155" stroke="#1E293B" stroke-width="4"/>
  <rect x="180" y="95" width="290" height="260" rx="6" fill="#FEF3C7"/>
  <rect x="250" y="100" width="150" height="15" rx="5" fill="#FDE047"/>
  <text x="325" y="112" font-size="10" font-weight="bold" fill="#854D0E" text-anchor="middle">TẦNG 8 - KHU MẸ VÀ BÉ 👶</text>

  <!-- Hai cánh cửa kim loại mở dạt sang 2 bên -->
  <rect x="130" y="90" width="55" height="270" fill="url(#doorGrad)" stroke="#475569" stroke-width="2"/>
  <rect x="465" y="90" width="55" height="270" fill="url(#doorGrad)" stroke="#475569" stroke-width="2"/>
  <text x="110" y="220" font-size="28" fill="#2563EB">◀◀</text>
  <text x="525" y="220" font-size="28" fill="#2563EB">▶▶</text>

  <!-- Đám đông hành khách nép sát hai bên cúi chào cung kính -->
  <g transform="translate(195, 140)">
    <circle cx="25" cy="30" r="16" fill="#FFEDD5" stroke="#1E293B" stroke-width="1.5"/>
    <path d="M 12 25 Q 25 15 38 25 Z" fill="#1E293B"/>
    <ellipse cx="20" cy="30" rx="2.5" ry="3" fill="#1E293B"/><ellipse cx="30" cy="30" rx="2.5" ry="3" fill="#1E293B"/>
    <path d="M 15 45 L 35 45 L 30 110 L 10 110 Z" fill="#475569"/>
    <text x="25" y="130" font-size="9" font-weight="bold" fill="#1E293B" text-anchor="middle">"Mời phu nhân!"</text>
  </g>

  <g transform="translate(415, 140)">
    <circle cx="25" cy="30" r="16" fill="#FFE4E6" stroke="#1E293B" stroke-width="1.5"/>
    <path d="M 10 28 C 10 12 40 12 40 28 Z" fill="#92400E"/>
    <ellipse cx="20" cy="30" rx="2.5" ry="3" fill="#1E293B"/><ellipse cx="30" cy="30" rx="2.5" ry="3" fill="#1E293B"/>
    <path d="M 15 45 L 35 45 L 35 110 L 15 110 Z" fill="#F472B6"/>
    <text x="25" y="130" font-size="9" font-weight="bold" fill="#BE185D" text-anchor="middle">"Bụng VIP quá! ❤️"</text>
  </g>

  <!-- MẸ BẦU TỰ TIN BƯỚC VÀO TRUNG TÂM VỚI CHIẾC BỤNG KHỔNG LỒ -->
  <g id="me-bau-thang-may" transform="translate(260, 115)">
    <circle cx="65" cy="45" r="28" fill="#FFE4E6" stroke="#1E293B" stroke-width="2.5"/>
    <path d="M 40 40 C 40 10 90 10 90 40 Z" fill="#78350F"/>
    <polygon points="50,15 55,25 65,10 75,25 80,15 80,28 50,28" fill="#FACC15" stroke="#CA8A04" stroke-width="1.5"/>
    <ellipse cx="56" cy="45" rx="3.5" ry="4.5" fill="#1E293B"/><ellipse cx="74" cy="45" rx="3.5" ry="4.5" fill="#1E293B"/>
    <path d="M 60 56 Q 65 62 70 56" stroke="#E11D48" stroke-width="2.5" fill="none"/>
    <ellipse cx="52" cy="50" rx="4" ry="2.5" fill="#FDA4AF"/><ellipse cx="78" cy="50" rx="4" ry="2.5" fill="#FDA4AF"/>

    <ellipse cx="65" cy="145" rx="90" ry="80" fill="#EC4899" stroke="#9D174D" stroke-width="4" filter="url(#shadow3)"/>
    <ellipse cx="45" cy="120" rx="15" ry="8" fill="#F472B6" opacity="0.6"/>
    <text x="65" y="150" font-family="'Impact', sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">SIÊU BỤNG BẦU ⭐</text>

    <path d="M 25 100 Q -5 135 15 155" stroke="#FB7185" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="15" cy="155" r="6" fill="#FFE4E6"/>
    <path d="M 105 100 Q 135 135 115 155" stroke="#FB7185" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="115" cy="155" r="6" fill="#FFE4E6"/>
  </g>

  <!-- Hộp thoại của mẹ bầu -->
  <rect x="25" y="70" width="130" height="55" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#shadow3)"/>
  <text x="90" y="92" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#1D4ED8" text-anchor="middle">"Cảm ơn mọi người,</text>
  <text x="90" y="110" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#1D4ED8" text-anchor="middle">hai bé nhà em nặng lắm! 😄"</text>

  <!-- Chú thích dưới đáy -->
  <rect x="25" y="390" width="600" height="40" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="325" y="415" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#1E40AF" text-anchor="middle">Cảm biến thang máy nhận diện 'VIP siêu to' tự động mở toang nhường đường!</text>
</svg>
